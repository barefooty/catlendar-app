  wrap.appendChild(legend);

  const aq=uiArc.q.trim();
  const hit=s=>!aq || String(s||'').includes(aq);
  const aTasks=tasks.filter(t=>t.archived && spaceMatch(t.space) && hit(t.title+' '+t.text));
  const aTrks=trackers.filter(t=>t.archived && spaceMatch(t.space) && hit(t.title));
  const aNotes=notes.filter(n=>n.archived && spaceMatch(n.space) && hit(n.text));
  const aSites=sites.filter(s=>s.archived && spaceMatch(s.space) && hit(s.title+' '+s.url));
  const aHabits=habits.filter(h=>h.archived && spaceMatch(h.space) && hit(h.name));
  const anyArchived=tasks.some(t=>t.archived)||trackers.some(t=>t.archived)||notes.some(n=>n.archived)||sites.some(s=>s.archived)||habits.some(h=>h.archived);
  if (anyArchived){
    const bar=document.createElement('div'); bar.style.cssText='margin-bottom:10px;';
    bar.appendChild(mkSearchBox('arcSearch','🔍 搜尋封存…',()=>uiArc.q,v=>uiArc.q=v,renderArchive));
    wrap.appendChild(bar);
  }
  if (!aTasks.length && !aTrks.length && !aNotes.length && !aSites.length && !aHabits.length){
    const e=document.createElement('div'); e.className='empty';
    e.textContent='封存是空的喵🐾 任務完成後按 🗄、或在「呼嚕收工」區按「🗄 全部封存」，就會依專案收進資料夾';
    wrap.appendChild(e); return;
  }
  const folders={};
  const fld=k=>folders[k]=folders[k]||{tasks:[],trks:[],notes:[],sites:[],habits:[]};
  aTasks.forEach(t=>fld(t.cat||'其他').tasks.push(t));
  aTrks.forEach(t=>fld(t.cat||'其他').trks.push(t));
  aNotes.forEach(n=>fld('其他').notes.push(n));
  aSites.forEach(s=>fld(s.cat||'其他').sites.push(s));
  aHabits.forEach(h=>fld('其他').habits.push(h));

  Object.keys(folders).sort((a,b)=>a.localeCompare(b,'zh-Hant')).forEach(cat=>{
    const f=folders[cat];
    const n=f.tasks.length+f.trks.length+f.notes.length+f.sites.length+f.habits.length;
    const card=document.createElement('div'); card.className='trkCard';
    const gh=document.createElement('div'); gh.className='pbGroupHead';
    const collapsed=uiArc.collapsed.has(cat);
    const chip=document.createElement('span'); chip.className='chip '+colorClass(cat);
    chip.textContent=cat;
    gh.append((collapsed?'▸ ':'▾ ')+'📁 ', chip, ' ');
    const cnt=document.createElement('span'); cnt.className='pbCount'; cnt.textContent=n+' 項';
    gh.appendChild(cnt);
    gh.onclick=()=>{ collapsed?uiArc.collapsed.delete(cat):uiArc.collapsed.add(cat); renderArchive(); };
    card.appendChild(gh);

    if (!collapsed){
      const mkRow=(icon, title, sub, restoreFn, delKey, delFn)=>{
        const row=document.createElement('div'); row.className='pbRow';
        const tl=document.createElement('span'); tl.className='pbName'; tl.textContent=icon+' '+title;
        row.appendChild(tl);
        if (sub){ const s=document.createElement('span'); s.className='pbInfo'; s.textContent=sub; row.appendChild(s); }
        const sp=document.createElement('span'); sp.style.flex='1'; row.appendChild(sp);
        const rb=document.createElement('button'); rb.className='qbtn'; rb.textContent='↩ 還原';
        rb.onclick=e=>{ e.stopPropagation(); restoreFn(); };
        row.appendChild(rb);
        const del=document.createElement('button'); del.className='qbtn';
        if (uiArc.delPending===delKey){
          del.textContent='確定刪除？'; del.style.cssText='background:var(--red);color:var(--on-red,#fff);';
          del.onclick=e=>{ e.stopPropagation(); delFn(); uiArc.delPending=null; };
        } else {
          del.textContent='🗑'; del.title='永久刪除（再點一次確認）';
          del.onclick=e=>{
            e.stopPropagation();
            uiArc.delPending=delKey; clearTimeout(uiArc.delTimer);
            uiArc.delTimer=setTimeout(()=>{uiArc.delPending=null; renderArchive();},3000);
            renderArchive();
          };
        }
        row.appendChild(del);
        return row;
      };
      f.tasks.forEach(t=>{
        card.appendChild(mkRow(
          (inAllView()?spaceIcon(t.space)+' ':'')+'📝', t.title,
          t.doneAt?('完成於 '+t.doneAt.slice(5).replace('-','/')):'',
          ()=>{ t.archived=false; save(); renderArchive(); catSay('還原到呼嚕收工區了喵',2000); },
          'at:'+t.id,
          ()=>{ tasks=tasks.filter(x=>x.id!==t.id); save(); renderArchive(); }
        ));
      });
      f.trks.forEach(trk=>{
        const act=trk.rows.filter(r=>!r.skipped);
        card.appendChild(mkRow(
          (inAllView()?spaceIcon(trk.space)+' ':'')+'📦', trk.title,
          act.filter(r=>r.done).length+'/'+act.length+' 已'+(trk.doneWord||'回傳'),
          ()=>{ trk.archived=false; saveTrack(); renderArchive(); catSay('追蹤表還原回追蹤項目了喵',2000); },
          'ak:'+trk.id,
          ()=>{ trackers=trackers.filter(x=>x.id!==trk.id); saveTrack(); renderArchive(); }
        ));
      });
      f.notes.forEach(nn=>{
        card.appendChild(mkRow(
          (inAllView()?spaceIcon(nn.space)+' ':'')+'📒', nn.text.split('\n')[0].slice(0,24),
          nn.created?('建於 '+nn.created.slice(5).replace('-','/')):'',
          ()=>{ nn.archived=false; saveNotes(); renderArchive(); catSay('便利貼還原了喵',2000); },
          'an:'+nn.id,
          ()=>{ notes=notes.filter(x=>x.id!==nn.id); saveNotes(); renderArchive(); }
        ));
      });
      f.sites.forEach(ss=>{
        card.appendChild(mkRow(
          (inAllView()?spaceIcon(ss.space)+' ':'')+'🔖', ss.title,
          ss.url.replace(/^https?:\/\//,'').slice(0,28),
          ()=>{ ss.archived=false; saveSites(); renderArchive(); catSay('收藏還原了喵',2000); },
          'as:'+ss.id,
          ()=>{ sites=sites.filter(x=>x.id!==ss.id); saveSites(); renderArchive(); }
        ));
      });
      f.habits.forEach(hh=>{
        card.appendChild(mkRow(
          (inAllView()?spaceIcon(hh.space)+' ':'')+(hh.icon||'🌱'), hh.name,
          '🏆 最佳連續 '+habitMaxStreak(hh)+' 天',
          ()=>{ hh.archived=false; saveHabits(); renderArchive(); catSay('習慣復出了！繼續加油喵',2200); },
          'ah:'+hh.id,
          ()=>{ habits=habits.filter(x=>x.id!==hh.id); saveHabits(); renderArchive(); }
        ));
      });
    }
    wrap.appendChild(card);
  });
}

/* 🎨 類別調色盤浮層：點色圓點展開——預設 8 色＋常用色（自動記最近 8 個自選色）＋自由選 */
let uiCatColor=null;   // 開著調色盤的類別 id
function pushColorHist(hex){
  settings.colorHist=[hex, ...(settings.colorHist||[]).filter(h=>h!==hex)].slice(0,8);
}
function mkCatPalette(cat){
  const pal=document.createElement('div');
  pal.style.cssText='display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin:2px 0 10px 4px;padding:9px 12px;background:var(--gray-bg);border-radius:12px;';
  const applyMsg=()=>catSay('顏色換好了，整個工具都會跟著這個色🎨',2400,'happy');
  const mkSw=(bg, cls, on, title, fn)=>{
    const s=document.createElement('button');
    s.className='palSw'+(cls?' '+cls:'')+(on?' on':'');
    if (bg) s.style.background=bg;
    s.title=title; s.onclick=fn;
    pal.appendChild(s);
  };
  CAT_COLORS.forEach(cl=>{
    mkSw(null, 'dotc-'+cl, cat.color===cl, '預設色', ()=>{
      cat.color=cl; uiCatColor=null;
      rebuildCustomCatCSS(); saveSettings(); renderSettings(); applyMsg();
    });
  });
  const applyHex=hex=>{
    cat.color='custom'; cat.hex=hex; uiCatColor=null; pushColorHist(hex);
    rebuildCustomCatCSS(); saveSettings(); renderSettings(); applyMsg();
  };
  const mkDiv=()=>{
    const dv=document.createElement('span');
    dv.style.cssText='width:1.5px;height:20px;background:var(--line);';
    pal.appendChild(dv);
  };
  // ⭐ 最愛色（手動釘選，永遠都在）
  const fav=settings.colorFav||[];
  if (fav.length){
    mkDiv();
    const fl=document.createElement('span'); fl.textContent='⭐'; fl.style.fontSize='13px';
    fl.title='最愛色'; pal.appendChild(fl);
    fav.forEach(hex=> mkSw(hex, null, cat.color==='custom'&&cat.hex===hex,
      '最愛色 '+hex, ()=>applyHex(hex)));
  }
  // 🕒 最近用過的自選色（自動記 8 個；已釘進最愛的不重複顯示）
  const hist=(settings.colorHist||[]).filter(h=>!fav.includes(h));
  if (hist.length){
    mkDiv();
    hist.forEach(hex=> mkSw(hex, null, cat.color==='custom'&&cat.hex===hex,
      '最近用過 '+hex, ()=>applyHex(hex)));
  }
  // 🎨 最後一顆＝自由選色（點了才開系統調色盤；挑好自動記進常用色）
  const pk=document.createElement('input'); pk.type='color';
  pk.style.cssText='position:absolute;width:0;height:0;opacity:0;pointer-events:none;';
  pk.value=cat.hex||'#9aab60';
  pk.oninput=()=>{ cat.color='custom'; cat.hex=pk.value; rebuildCustomCatCSS(); };
  pk.onchange=()=>{ pushColorHist(pk.value); saveSettings(); renderSettings(); applyMsg(); };   // 保持展開，方便順手按 ⭐＋釘最愛
  const free=document.createElement('button'); free.className='palSw';
  free.style.background='conic-gradient(#e0705f,#e0a45f,#c9a227,#7fb59a,#7da7cc,#a98fd1,#e8949e,#e0705f)';
  free.title='🎨 自由選色';
  free.onclick=()=>pk.click();
  pal.appendChild(free); pal.appendChild(pk);
  // ⭐＋／⭐−：把目前套用的自訂色釘進最愛（或移除）
  const curHex = cat.color==='custom' ? cat.hex : null;
  const inFav = !!(curHex && fav.includes(curHex));
  const favB=document.createElement('button'); favB.className='qbtn';
  favB.textContent = inFav ? '⭐−' : '⭐＋';
  favB.title = inFav ? '把目前這個顏色從最愛移除'
    : '把目前套用的自訂色釘進最愛（先用 🎨 或點一個常用色，再按這裡）';
  favB.onclick=()=>{
    if (!curHex){ catSay('先用 🎨 選一個自訂色，再按 ⭐ 釘進最愛喵',2800); return; }
    settings.colorFav = inFav ? fav.filter(h=>h!==curHex) : [curHex, ...fav].slice(0,12);
    saveSettings(); renderSettings();
    catSay(inFav?'從最愛移除了喵':'釘進最愛了⭐ 以後每個調色盤都會看到它喵！',2600,'happy');
  };
  pal.appendChild(favB);
  return pal;
}

/* ───────── 統計＋貓咪 ───────── */
/* v54：擱很久的逾期（超過 7 天、又沒標「急」）＝多半是沒有硬期限的專案型工作。
   首頁與貓咪不再把它們當「急事」吼人，改成溫和的一行提醒去重排；任務小窩裡照實顯示不變 */
function isStaleOverdue(t){
  const d=fromISO(t.due);
  return !!d && daysUntil(d)<-7 && !((t.tags||[]).includes('急'));
}
function countRed(){
  return spaceTasks().filter(t=>t.status==='todo'&&urgency(t).level==='red').length;
}
function countChase(){
  return spaceTasks().filter(t=>t.status==='waiting'&&t.followUp&&daysUntil(fromISO(t.followUp))<=0).length;
}
function renderStats(){
  const pool=spaceTasks();
  const act=pool.filter(t=>t.status!=='done');
  const red=countRed(), chase=countChase();
  const parts=[];
  parts.push(`待辦 <b>${pool.filter(t=>t.status==='todo').length}</b>`);
  parts.push(`等回覆 <b>${pool.filter(t=>t.status==='waiting').length}</b>`);
  if (red) parts.push(`<span class="alert">🔴 急件 <b>${red}</b></span>`);
  if (chase) parts.push(`<span class="alert">⏰ 該催了 <b>${chase}</b></span>`);
  curCats().filter(c=>c.vis==='show').forEach(c=>{
    const n=act.filter(t=>t.cat===c.name).length;
    if (n) parts.push(`${c.name} <b>${n}</b>`);
  });
  document.getElementById('stats').innerHTML=parts.map(p=>`<span>${p}</span>`).join('');
  // 分頁標題徽章：有急件時顯示 (N)，一開瀏覽器就看得到
  document.title=(red?('('+red+') '):'')+BASE_TITLE;
}

const catBox=document.getElementById('catBox');
const bubble=document.getElementById('bubble');
let sayTimer=null;
function setMood(m){ catBox.className='catBox m-'+m; }
function updateCat(){
  if (sayTimer) return;
  const red=countRed(), chase=countChase();
  const pool=spaceTasks();
  const todo=pool.filter(t=>t.status==='todo').length;
  const wait=pool.filter(t=>t.status==='waiting').length;
  const P=persona();
  let mood, msg;
  const _fresh=pool.filter(t=>t.status==='todo'&&urgency(t).level==='red'&&!isStaleOverdue(t)).length;
  if (_fresh>0){ mood='alarmed'; msg=P.red(_fresh); }
  else if (chase>0){ mood='alarmed'; msg=P.chase(chase); }
  else if (red>0){ mood='normal'; msg=vocal('好久不見～有 '+red+' 件事擱了一陣子，不急，先挑一件最小的就好喵'); }
  else if (todo===0&&wait===0){ mood='sleepy'; msg=P.empty; }
  else if (todo===0){ mood='happy'; msg=vocal('待辦都清空了，剩等回覆的而已，悠哉喵～'); }
  else if (todo<=2){ mood='happy'; msg=P.few(todo); }
  else { mood='normal'; msg=P.normal(todo); }
  setMood(mood); bubble.textContent=msg;
}
function catSay(text,ms,mood){
  clearTimeout(sayTimer);
  if (settings && (settings.catPos || (typeof isMobileShell==='function' && isMobileShell())) && typeof showFloatBub==='function'){
    showFloatBub(vocal(text), ms||2000);   // 出門中／手機：話用浮動泡泡顯示（手機常駐泡泡已移除省空間）
  } else {
    bubble.textContent=vocal(text);
  }
  if (mood) setMood(mood);
  if (mood==='happy'){   // 開心＝蹦一下
    const box=document.getElementById('catBox');

/* 🕒 自動快照：每天開啟時自動留一份，最多 5 份（防手滑誤刪）
   v43 輪替保護：「最後一份有資料的快照」永遠不會被空快照擠掉——
   資料事故後每天自動拍的空快照，曾把僅存的好快照輪替掉（第四次事故實錄） */
const SNAP_DATA_KEYS=['tasks','rosters','trackers','notes','pbook','sites','money','manuals','habits','diary'];
function snapCount(s){                       // 這份快照有幾筆資料（算過就記在 s.n）
  if (typeof s.n==='number') return s.n;
  try{
    const d=JSON.parse(s.data);
    s.n=SNAP_DATA_KEYS.reduce((a,k)=>a+((d[k]||[]).length||0),0);
  }catch(e){ s.n=0; }
  return s.n;
}
function takeSnapshot(auto){
  try{
    let arr=JSON.parse(localStorage.getItem('taskInbox.snapshots'))||[];
    const today=toISO(new Date());
    if (auto && arr.length && arr[0].date===today) return;
    const payload=buildBackup();
    const n=SNAP_DATA_KEYS.reduce((a,k)=>a+((payload[k]||[]).length||0),0);
    arr.unshift({date:today, data:JSON.stringify(payload), n});
    if (arr.length>5){
      const kept=arr.slice(0,5);
      if (!kept.some(s=>snapCount(s)>0)){        // 留下的全是空的？
        const good=arr.find(s=>snapCount(s)>0);  // 從整串裡撈最後一份好的
        if (good) kept[kept.length-1]=good;      // 用最舊的位置換成它
      }
      arr=kept;
    }
    localStorage.setItem('taskInbox.snapshots', JSON.stringify(arr));
  }catch(e){}
}
/* 🛡 v43 開機防呆：所有資料全空、但快照裡還有一份非空 → 首頁跳出還原警告卡
   （只擋得住「快照倖存」的部分清空；全滅型事故仍靠硬碟備份，見定期匯出提醒） */
let bootWipeSnap=null;

  try{
    const total=tasks.length+rosters.length+trackers.length+notes.length+pbook.length
      +sites.length+money.length+manuals.length+habits.length+diary.length;
    if (total>0) return;
    const arr=JSON.parse(localStorage.getItem('taskInbox.snapshots'))||[];
    const good=arr.find(s=>snapCount(s)>0);
    if (good && (settings.ui||{}).wipeAck!==toISO(new Date())) bootWipeSnap=good;
  }catch(e){}
}
function restoreSnapshot(s){

    if (d.stocks) localStorage.setItem('taskInbox.stocks', JSON.stringify(d.stocks));      // 同上

function applyImport(data){
      const importTasks=arr=>{
        const map=new Map(tasks.map(t=>[t.id,t]));
        let added=0;
        (arr||[]).forEach(t=>{ if(t&&t.id){ if(!map.has(t.id)) added++; map.set(t.id,t); } });
        tasks=[...map.values()];
        migrate();
        return added;
      };
      let added=0;
      if (Array.isArray(data)){            // 舊版備份：只有任務
        added=importTasks(data);
      } else if (data && data.format==='taskInbox-backup'){   // 新版備份：任務＋名單＋追蹤＋對象
        added=importTasks(data.tasks);
        const rmap=new Map(rosters.map(x=>[x.id,x]));
        (data.rosters||[]).forEach(x=>{ if(x&&x.id) rmap.set(x.id,x); });
        rosters=[...rmap.values()];
        const tmap=new Map(trackers.map(x=>[x.id,x]));
        (data.trackers||[]).forEach(x=>{ if(x&&x.id) tmap.set(x.id,x); });
        trackers=[...tmap.values()];
        (data.contacts||[]).forEach(learnContact);
        if (data.settings && data.settings.cats && data.settings.cats.work){
          settings=data.settings; saveSettings(); applyMascot();
        }
        const nmap=new Map(notes.map(x=>[x.id,x]));
        (data.notes||[]).forEach(x=>{ if(x&&x.id) nmap.set(x.id,x); });
        notes=[...nmap.values()];
        saveNotes();
        const pmap=new Map(pbook.map(x=>[x.id,x]));
        (data.pbook||[]).forEach(x=>{ if(x&&x.id) pmap.set(x.id,x); });
        pbook=[...pmap.values()];
        savePB();
        const smap=new Map(sites.map(x=>[x.id,x]));
        (data.sites||[]).forEach(x=>{ if(x&&x.id) smap.set(x.id,x); });
        sites=[...smap.values()];
        saveSites();
        const mmap=new Map(money.map(x=>[x.id,x]));
        (data.money||[]).forEach(x=>{ if(x&&x.id) mmap.set(x.id,x); });
        money=[...mmap.values()];
        saveMoney();
        const manmap=new Map(manuals.map(x=>[x.id,x]));
        (data.manuals||[]).forEach(x=>{ if(x&&x.id) manmap.set(x.id,x); });
        manuals=[...manmap.values()];
        saveManuals();
        const dimap=new Map(diary.map(x=>[x.id,x]));
        (data.diary||[]).forEach(x=>{ if(x&&x.id) dimap.set(x.id,x); });
        diary=[...dimap.values()];
        saveDiary();
        if (data.pomodoro){   // 🍅 番茄園：每天取較多的那份、收成明細去重合併
          Object.entries(data.pomodoro.log||{}).forEach(([d2,n2])=>{ pomoData.log[d2]=Math.max(pomoData.log[d2]||0, n2||0); });
          const pseen=new Set(pomoData.hist.map(h=>h.d+'|'+h.f+'|'+h.m));
          (data.pomodoro.hist||[]).forEach(h=>{ const k=h.d+'|'+h.f+'|'+h.m; if(h&&h.d&&!pseen.has(k)){ pomoData.hist.push(h); pseen.add(k); } });
          pomoData.hist.sort((a,b)=>(b.d||'').localeCompare(a.d||''));
          pomoData.hist=pomoData.hist.slice(0,200);
          savePomo();
        }
        if (data.stocks){
          const slmap=new Map(stk.list.map(x=>[x.id,x]));
          (data.stocks.list||[]).forEach(x=>{ if(x&&x.id) slmap.set(x.id,x); });
          stk.list=[...slmap.values()];
          const swmap=new Map(stk.watch.map(x=>[x.id,x]));
          (data.stocks.watch||[]).forEach(x=>{ if(x&&x.id) swmap.set(x.id,x); });
          stk.watch=[...swmap.values()];
          Object.assign(stk.names, data.stocks.names||{});
          Object.assign(stk.settings, data.stocks.settings||{});
          saveStocks();
        }
        const hmap=new Map(habits.map(x=>[x.id,x]));
        (data.habits||[]).forEach(x=>{ if(x&&x.id) hmap.set(x.id,x); });
        habits=[...hmap.values()];
        saveHabits();
        saveTrack();
      } else throw new Error('不是 Catlendar 的備份格式');
      return added;
}

// fresh=true：新用戶，整組換上範本分類；fresh=false：既有用戶，只增不減（不動現有分類與已關成'more'以外的設定）
function applyRoleTemplate(key, fresh){
  const tp=ROLE_TEMPLATES[key]; if(!tp) return {mods:0, cats:0};
  let mc=0, cc=0;
  Object.entries(tp.mods).forEach(([m,v])=>{
    if (fresh || !settings.modules[m]){ if(settings.modules[m]!==v){mc++;} settings.modules[m]=v; }
  });
  if (fresh){
    settings.cats.work=tp.cats.map((c,i)=>({id:(c[0]==='其他'?'other':'r_'+key+'_'+i), name:c[0], color:c[1], vis:'show'}));
    cc=tp.cats.length;
  } else {
    tp.cats.forEach((c,i)=>{
      if (!settings.cats.work.some(x=>x.name===c[0])){
        settings.cats.work.push({id:'r_'+key+'_'+i, name:c[0], color:c[1], vis:'show'}); cc++;
      }
    });
    // 「其他」保持在最後，fallback 分類才直覺
    const oi=settings.cats.work.findIndex(x=>/^other/.test(x.id));
    if (oi>-1 && oi<settings.cats.work.length-1) settings.cats.work.push(settings.cats.work.splice(oi,1)[0]);
  }
  return {mods:mc, cats:cc};
}

/* ───────── 📈 股票（紀錄＋計算機，附加功能） ───────── */
const STK_KEY='taskInbox.stocks';
let stk={settings:{rate:0.1425, disc:1, min:20, tax:0.3}, list:[], watch:[], names:{}};
function loadStocks(){
  try{
    const d=JSON.parse(localStorage.getItem(STK_KEY));
    if (d && d.list) stk=d;
  }catch(e){}
  if (!stk.settings) stk.settings={};
  // 🏦 多券商：舊的單一費率設定自動搬進第一家券商
  if (!Array.isArray(stk.brokers) || !stk.brokers.length){
    stk.brokers=[{id:'b1', name:'我的券商',
      rate: stk.settings.rate!=null?stk.settings.rate:0.1425,
      disc: stk.settings.disc!=null?stk.settings.disc:1,
      min:  stk.settings.min!=null?stk.settings.min:20,
      tax:  stk.settings.tax!=null?stk.settings.tax:0.3}];
  }
  if (!stk.cur || !stk.brokers.find(b=>b.id===stk.cur)) stk.cur=stk.brokers[0].id;
  if (!stk.watch) stk.watch=[];
  if (!stk.names) stk.names={};
}
function saveStocks(){ localStorage.setItem(STK_KEY, JSON.stringify(stk)); }
const uiStk={ newOpen:false, sellOpen:null, delPending:null, delTimer:null, refOpen:false, feeOpen:false, bFilter:'all' };
function stkShares(r){ return (r.qty||0)*(r.unit==='股'?1:1000); }
// 每筆交易記著自己的券商；沒記的用「目前選中」的券商
function stkBroker(r){ return stk.brokers.find(b=>b.id===(r&&r.broker)) || stk.brokers.find(b=>b.id===stk.cur) || stk.brokers[0]; }
// toFixed(4) 是浮點數精度保護：1000000×0.001425 在 JS 會算出 1424.999…，直接 floor 會少 1 元
function stkFee(amount,b){ b=b||stkBroker(); return Math.max(b.min||0, Math.floor(+(amount*((b.rate||0.1425)/100)*(b.disc||1)).toFixed(4))); }
function stkTax(amount,b){ b=b||stkBroker(); return Math.floor(+(amount*((b.tax!=null?b.tax:0.3)/100)).toFixed(4)); }
function stkCost(r){ const b=stkBroker(r); const amt=stkShares(r)*(r.buyPrice||0); return amt+stkFee(amt,b); }   // 買進總成本（含手續費）
function stkNet(sh,p,b){ const amt=sh*p; return amt-stkFee(amt,b)-stkTax(amt,b); }                               // 賣出實拿（扣手續費＋證交稅）
function stkPL(r){ const b=stkBroker(r); return stkNet(stkShares(r), r.sellPrice||0, b)-stkCost(r); }
function stkSuggest(r, targetProfit){   // 要淨賺 targetProfit 元 → 至少要賣多少價
  const sh=stkShares(r); if(!sh) return null;
  const b=stkBroker(r);
  const cost=stkCost(r);
  let p=(cost+targetProfit)/sh/(1-((b.rate||0.1425)/100)*(b.disc||1)-((b.tax!=null?b.tax:0.3)/100));
  p=Math.floor(p*100)/100;
  let g=0;
  while (stkNet(sh,p,b)-cost<targetProfit && g++<3000) p=Math.round((p+0.01)*100)/100;
  return p;
}
function stkFmt(n){ const neg=n<0; const s='$'+Math.abs(Math.round(n)).toLocaleString('zh-Hant'); return neg?'-'+s:s; }
function stkLearn(code,name){ if(code) stk.names[code]=name||stk.names[code]||''; }
function stkDatalist(){
  let dl=document.getElementById('stkList');
  if (!dl){ dl=document.createElement('datalist'); dl.id='stkList'; document.body.appendChild(dl); }
  dl.innerHTML='';
  Object.entries(stk.names).forEach(([c,n])=>{
    const o=document.createElement('option'); o.value=c; o.label=n; dl.appendChild(o);
  });
}

/* ───────── 🍅 番茄鐘（附加功能，預設隱藏） ───────── */
const pomo={ total:25*60, left:25*60, running:false, timer:null, focus:'', doneToday:0, doneDate:'' };
/* 🍅 番茄園：完成的番茄會種下來留紀錄（可在番茄鐘頁關掉）。專注 15 分鐘以上才算一顆，休息不算 */
const POMO_KEY='taskInbox.pomo';
let pomoData={log:{}, hist:[]};   // log:{'2026-07-29':3}＝每天幾顆；hist＝最近的收成明細
function loadPomo(){
  try{ const d=JSON.parse(localStorage.getItem(POMO_KEY)); if (d&&d.log) pomoData=d; }catch(e){}
  if (!pomoData.hist) pomoData.hist=[];
}
function savePomo(){ localStorage.setItem(POMO_KEY, JSON.stringify(pomoData)); }
function pomoTick(){
  if (!pomo.running) return;
  pomo.left--;
  const mm=('0'+Math.floor(pomo.left/60)).slice(-2), ss=('0'+pomo.left%60).slice(-2);
  document.title='🍅 '+mm+':'+ss+(pomo.focus?' '+pomo.focus.slice(0,8):'');
  const el=document.getElementById('pomoTime');
  if (el) el.textContent=mm+':'+ss;
  if (pomo.left<=0){
    pomoStop();
    const today=toISO(new Date());
    if (pomo.doneDate!==today){ pomo.doneDate=today; pomo.doneToday=0; }
    pomo.doneToday++;
    // 🍅 種番茄：15 分鐘以上的專注才結果，休息鐘不算
    if (settings.pomoGarden!==false && pomo.total>=15*60){
      pomoData.log[today]=(pomoData.log[today]||0)+1;
      pomoData.hist.unshift({d:today, f:pomo.focus||'', m:Math.round(pomo.total/60)});
      pomoData.hist=pomoData.hist.slice(0,200);
      savePomo();
      notifyUser('🍅 番茄鐘完成！'+(pomo.focus?'「'+pomo.focus+'」':'')+'園子裡多了一顆番茄，今天第 '+pomoData.log[today]+' 顆！');
    } else {
      notifyUser('🍅 番茄鐘完成！'+(pomo.focus?'「'+pomo.focus+'」':'')+'休息一下吧！');
    }
    if (module==='pomo') renderPomo();
  }
}
function pomoStart(){ if (pomo.running) return; pomo.running=true; pomo.timer=setInterval(pomoTick,1000); if(module==='pomo') renderPomo(); }
function pomoStop(){ pomo.running=false; clearInterval(pomo.timer); document.title=BASE_TITLE||document.title; if(module==='pomo') renderPomo(); }
function pomoSet(min){ pomoStop(); pomo.total=min*60; pomo.left=min*60; if(module==='pomo') renderPomo(); }
function renderPomo(){
  const wrap=document.getElementById('pomoPane');
  wrap.innerHTML='';
  const todayIso=toISO(new Date());
  const todayN=pomoData.log[todayIso]||0;
  const c=document.createElement('div'); c.className='trkCard';
  c.innerHTML='<div class="trkHead"><span class="tTitle">🍅 番茄鐘</span><span class="spacer"></span>'
    +(todayN?'<span style="font-size:13.5px;">今天 '+'🍅'.repeat(Math.min(todayN,10))+' '+todayN+' 顆</span>':'')+'</div>'
    +'<div class="setNote">專注 25 分鐘、休息 5 分鐘。開始後分頁標題會倒數，切去別的分頁也看得到；時間到貓咪會喊你（開了桌面通知連背景都會跳）。</div>';
  const mm=('0'+Math.floor(pomo.left/60)).slice(-2), ss=('0'+pomo.left%60).slice(-2);
  const big=document.createElement('div'); big.id='pomoTime';
  big.style.cssText='font-size:64px;font-weight:700;text-align:center;margin:18px 0;font-variant-numeric:tabular-nums;color:'+(pomo.running?'var(--accent)':'var(--ink)')+';';
  big.textContent=mm+':'+ss;
  c.appendChild(big);
  const row=document.createElement('div');
  row.style.cssText='display:flex;gap:8px;justify-content:center;flex-wrap:wrap;';
  const go=document.createElement('button'); go.className='btnAdd';
  go.textContent= pomo.running ? '⏸ 暫停' : (pomo.left<pomo.total?'▶ 繼續':'▶ 開始專注');
  go.onclick=()=>{ pomo.running ? pomoStop() : pomoStart(); };
  row.appendChild(go);
  const rs=document.createElement('button'); rs.className='qbtn'; rs.textContent='↺ 重設';
  rs.onclick=()=>pomoSet(pomo.total/60);
  row.appendChild(rs);
  c.appendChild(row);
  const pr=document.createElement('div');
  pr.style.cssText='display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px;';
  [['🍅 專注 25 分',25],['☕ 休息 5 分',5],['🛋 長休 15 分',15],['⚡ 衝刺 50 分',50]].forEach(([l,m])=>{
    const b=document.createElement('button'); b.className='qbtn'+(pomo.total===m*60?' on':'');
    b.textContent=l; b.onclick=()=>pomoSet(m);
    pr.appendChild(b);
  });
  c.appendChild(pr);
  const fr=document.createElement('div');
  fr.style.cssText='display:flex;gap:8px;justify-content:center;align-items:center;margin-top:14px;flex-wrap:wrap;';
  const fi=document.createElement('input'); fi.className='miniInput'; fi.style.width='220px';
  fi.placeholder='這顆番茄要專注做什麼？（選填）';
  fi.value=pomo.focus;
  fi.oninput=()=>{ pomo.focus=fi.value.trim(); };
  fr.appendChild(fi);
  c.appendChild(fr);
  wrap.appendChild(c);

  // 🍅 番茄園：收成紀錄（不想要收集感可以關掉，紀錄會保留）
  const g=document.createElement('div'); g.className='trkCard';
  const gh=document.createElement('div'); gh.className='trkHead';
  gh.innerHTML='<span class="tTitle">🍅 番茄園</span><span class="spacer"></span>';
  const gt=document.createElement('button'); gt.className='qbtn';
  gt.textContent= settings.pomoGarden!==false ? '🌱 種番茄：開' : '🌱 種番茄：關';
  gt.title='完成 15 分鐘以上的專注就種下一顆番茄。關掉之後不再種新的，已種的會保留';
  gt.onclick=()=>{ settings.pomoGarden = settings.pomoGarden===false ? true : false; saveSettings(); renderPomo(); };
  gh.appendChild(gt);
  g.appendChild(gh);
  const month=todayIso.slice(0,7);
  const monthN=Object.entries(pomoData.log).filter(([d])=>d.startsWith(month)).reduce((s,[,n])=>s+n,0);
  const totalN=Object.values(pomoData.log).reduce((s,n)=>s+n,0);
  if (!totalN){
    const e=document.createElement('div'); e.className='empty';
    e.textContent= settings.pomoGarden!==false ? '園子還空空的🌱 完成一顆專注番茄鐘就會種下第一顆！' : '種番茄目前關閉中';
    g.appendChild(e);
  } else {
    const sum=document.createElement('div');
    sum.style.cssText='font-size:13.5px;margin-top:8px;';
    sum.innerHTML='本月收成 <b>'+monthN+'</b> 顆｜歷年累計 <b>'+totalN+'</b> 顆';
    g.appendChild(sum);
    // 最近的收成：一天一行，番茄排排站
    const days=[...new Set(pomoData.hist.map(h=>h.d))].slice(0,10);
    days.forEach(d=>{
      const row=document.createElement('div');
      row.style.cssText='font-size:13.5px;margin-top:6px;line-height:1.7;';
      const n=pomoData.log[d]||0;
      const focuses=[...new Set(pomoData.hist.filter(h=>h.d===d && h.f).map(h=>h.f))].join('、');
      row.textContent=d.slice(5).replace('-','/')+'　'+'🍅'.repeat(Math.min(n,14))+' '+n+' 顆'+(focuses?'　— '+focuses.slice(0,40):'');
      g.appendChild(row);
    });
  }
  const gn=document.createElement('div'); gn.className='setNote';
  gn.textContent='專注 15 分鐘以上的番茄鐘才會結果（休息鐘不算）。紀錄會跟著備份一起匯出。';
  g.appendChild(gn);
  wrap.appendChild(g);
}

/* ───────── ⏰ 提醒引擎（工具開著才會提醒；習慣的提醒時間＋今天到期任務的時間） ───────── */
const remindFired={};   // 今天已提醒過的不重複（key: 日期|類型|id|時間）
function notifyUser(msg){
  catSay(msg, 9000, 'alarmed');
  // 分頁標題閃鈴鐺 10 秒，切到別的分頁也看得到
  const t0=document.title;
  let flash=0;
  const fl=setInterval(()=>{
    document.title = (flash++%2 ? '🔔 '+msg.slice(0,12)+'…' : t0);
    if (flash>10){ clearInterval(fl); document.title=t0; }
  },1000);
  try{
    if (window.Notification && Notification.permission==='granted')
      new Notification('Catlendar 🐾', {body:msg});
  }catch(e){}
}
function checkReminders(){
  const now=new Date();
  const hm=('0'+now.getHours()).slice(-2)+':'+('0'+now.getMinutes()).slice(-2);
  const today=toISO(now);
  habits.filter(h=>!h.archived && (h.times||[]).length).forEach(h=>{
    h.times.forEach(tm=>{
      const key=today+'|h|'+h.id+'|'+tm;
      if (tm===hm && !remindFired[key] && habitScheduledOn(h,now) && !habitDone(h,today)){
        remindFired[key]=1;
        notifyUser((h.icon||'🌱')+' 提醒：該做「'+h.name+'」了！（'+tm+'，今天 '+(h.log[today]||0)+'/'+(h.daily||1)+'）');
      }
    });
  });
  tasks.filter(t=>t.status==='todo' && !t.archived && t.due===today && t.time).forEach(t=>{
    const key=today+'|t|'+t.id;
    if (t.time===hm && !remindFired[key]){
      remindFired[key]=1;
      notifyUser('⏰ 時間到：'+t.title.slice(0,20));
    }
  });
}
setInterval(checkReminders, 20000);   // 每 20 秒看一次錶，同一分鐘只提醒一次

/* ───────── ☁️ 個人雲端同步（Google Apps Script 版）───────── */
const SYNC_KEY='taskInbox.sync';
let syncCfg={url:'', token:'', auto:true, lastAt:0};
try{ const s=JSON.parse(localStorage.getItem(SYNC_KEY)); if(s&&s.url!==undefined) syncCfg=Object.assign(syncCfg,s); }catch(e){}
function saveSyncCfg(){ localStorage.setItem(SYNC_KEY, JSON.stringify(syncCfg)); }
let syncBusy=false, syncTimer=null;
function syncStatus(msg, ok){
  const el=document.getElementById('syncStatus');
  if (el){ el.textContent=msg; el.style.color= ok===false?'var(--red)': ok?'var(--green)':'var(--sub)'; }
}
async function syncCall(body){
  const res=await fetch(syncCfg.url,{method:'POST', body:JSON.stringify(Object.assign({token:syncCfg.token},body))});
  return await res.json();
}
async function syncPush(){
  if (!syncCfg.url||!syncCfg.token||syncBusy) return false;
  syncBusy=true; syncStatus('⬆ 同步中…');
  let ok=false;   // 回傳成敗：貓咪選單的「☁️ 推上雲端」要照這個回話
  try{
    const payload=JSON.stringify(Object.assign(buildBackup(),{syncStamp:Date.now()}));
    const r=await syncCall({action:'push', data:payload});
    if (r.ok){ syncCfg.lastAt=Date.now(); saveSyncCfg(); syncStatus('✅ 已同步到雲端　'+new Date().toLocaleTimeString('zh-Hant'),true); ok=true; }
    else syncStatus('⚠️ 推送失敗：'+(r.err||'未知錯誤'),false);
  }catch(e){ syncStatus('⚠️ 連不上雲端（離線中也沒關係，之後會再推）',false); }
  syncBusy=false;
  return ok;
}
function queueSyncPush(){
  if (!syncCfg.url||!syncCfg.auto) return;
  clearTimeout(syncTimer);
  syncTimer=setTimeout(syncPush, 3000);   // 停手 3 秒才推，避免連續操作狂送
}
async function syncPullApply(force){
  if (!syncCfg.url||!syncCfg.token) return;
  syncStatus('⬇ 檢查雲端…');
  try{
    const r=await syncCall({action:'pull'});
    if (!r.ok){ syncStatus('⚠️ '+(r.err||'拉取失敗'),false); return; }
    if (!r.data){ syncStatus('雲端還沒有資料；你做任何修改就會自動推上去'); return; }
    const d=JSON.parse(r.data);
    if (!force && !((d.syncStamp||r.updated||0) > syncCfg.lastAt)){
      syncStatus('✅ 已是最新　'+new Date().toLocaleTimeString('zh-Hant'),true); return;
    }
    takeSnapshot(false);   // 套用雲端資料前自動留快照，隨時可還原
    localStorage.setItem('taskInbox.v1', JSON.stringify(d.tasks||[]));
    localStorage.setItem('taskInbox.rosters', JSON.stringify(d.rosters||[]));
    localStorage.setItem('taskInbox.trackers', JSON.stringify(d.trackers||[]));
    localStorage.setItem('taskInbox.notes', JSON.stringify(d.notes||[]));
    localStorage.setItem('taskInbox.phonebook', JSON.stringify(d.pbook||[]));
    localStorage.setItem('taskInbox.sites', JSON.stringify(d.sites||[]));
    localStorage.setItem('taskInbox.money', JSON.stringify(d.money||[]));
    localStorage.setItem('taskInbox.habits', JSON.stringify(d.habits||[]));
    localStorage.setItem(CONTACT_KEY, JSON.stringify(d.contacts||[]));
    if (d.manuals) localStorage.setItem('taskInbox.manuals', JSON.stringify(d.manuals));
    if (d.stocks) localStorage.setItem('taskInbox.stocks', JSON.stringify(d.stocks));
    if (d.pomodoro) localStorage.setItem('taskInbox.pomo', JSON.stringify(d.pomodoro));
    if (d.diary) localStorage.setItem('taskInbox.diary', JSON.stringify(d.diary));
    if (d.settings && d.settings.cats) localStorage.setItem(SETTINGS_KEY, JSON.stringify(d.settings));
    syncCfg.lastAt=Date.now(); saveSyncCfg();
    location.reload();
  }catch(e){ syncStatus('⚠️ 連不上雲端',false); }
}

'/** Catlendar 同步小幫手（Google Apps Script）',

'',
'function doPost(e){',
'  try{',

"    if (b.action === 'push'){ getFile().setContent(b.data); return out({ok:true}); }",

'}',

'function out(o){ return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON); }',
'function findFile(){ const it = DriveApp.getFilesByName(FILE_NAME); return it.hasNext() ? it.next() : null; }',

].join('\n');

    try{ const r=await syncCall({action:'pull'});
      syncStatus(r.ok?('✅ 連線成功'+(r.data?'，雲端已有資料':'，雲端還沒有資料檔')):'⚠️ '+(r.err||'失敗'), r.ok);
    }catch(e){ syncStatus('⚠️ 連不上：網址對嗎？部署是選「任何人」嗎？',false); } };
  const bU=document.createElement('button'); bU.className='qbtn'; bU.textContent='⬆ 立刻推上雲端';
  bU.onclick=()=>syncPush();
  const bD=document.createElement('button'); bD.className='qbtn'; bD.textContent='⬇ 用雲端覆蓋本機';
  bD.title='把雲端資料整份拉下來取代本機（會先自動留快照）';
  bD.onclick=()=>syncPullApply(true);
  const at=document.createElement('span'); at.className='memberTag'+(syncCfg.auto?' on':'');
  at.textContent='自動同步：'+(syncCfg.auto?'開':'關');
  at.onclick=()=>{ syncCfg.auto=!syncCfg.auto; saveSyncCfg(); renderSettings(); };
  r2.append(bT,bU,bD,at);
  // 📱 安裝連結：把同步設定夾帶在網址裡——換手機/重加主畫面/開新瀏覽器，開這條連結就自動設定好，不用再貼
  if (/^https?:$/.test(location.protocol)){
    const bL=document.createElement('button'); bL.className='qbtn'; bL.textContent='📱 複製安裝連結';
    bL.title='複製「開了就自動完成同步設定」的網址。⚠️ 連結含通行碼，只留給自己（存在自己的備忘錄/書籤）';
    bL.onclick=()=>{
      if (!syncCfg.url||!syncCfg.token){ catSay('先把上面的網址和通行碼填好喵',2600,'alarmed'); return; }
      copyText(location.origin+location.pathname+'#sync='+encodeURIComponent(syncCfg.url)+'|'+encodeURIComponent(syncCfg.token),
        '安裝連結複製好了！含通行碼，只能留給自己用喵');
    };
    r2.appendChild(bL);
  }
  c.appendChild(r2);
  const st=document.createElement('div'); st.id='syncStatus';
  st.style.cssText='margin-top:8px;font-size:13.5px;font-weight:600;color:var(--sub);';
  st.textContent= syncCfg.url ? (syncCfg.lastAt?('上次同步：'+new Date(syncCfg.lastAt).toLocaleString('zh-Hant')):'尚未同步過') : '尚未設定';
  c.appendChild(st);
  wrap.appendChild(c);
};
// 📱 安裝連結進場：網址帶 #sync=網址|通行碼 → 自動完成同步設定（新手機/重加主畫面不用重貼）
try{
  const hm=location.hash.match(/^#sync=([^|]+)\|(.+)$/);
  if (hm){
    const nu=decodeURIComponent(hm[1]), nt=decodeURIComponent(hm[2]);
    const changed=(syncCfg.url!==nu || syncCfg.token!==nt);
    syncCfg.url=nu; syncCfg.token=nt; syncCfg.auto=true; saveSyncCfg();
    history.replaceState(null,'',location.pathname+location.search);   // 含通行碼的部分立刻從網址列拿掉
    if (changed) setTimeout(()=>catSay('☁️ 雲端同步設定好了！正在幫你拉資料…',3600,'happy'), 600);
  }
}catch(e){}
// 開啟工具 1 秒後自動檢查雲端（雲端較新才套用）
if (syncCfg.url && syncCfg.auto) setTimeout(()=>syncPullApply(false), 1000);

/* ⚙️ 設定頁分層收合：每張卡點標題展開/收合，狀態記住（預設只開功能開關，頁面瞬間清爽） */
const _rsForFold=renderSettings;
renderSettings=function(){
  _rsForFold();
  const wrap=document.getElementById('settingsPane');
  [...wrap.querySelectorAll(':scope > .trkCard')].forEach(card=>{
    const head=card.querySelector(':scope > .trkHead'); if (!head) return;
    const tt=head.querySelector('.tTitle'); if (!tt) return;
    const title=tt.textContent;
    const open=settings.setOpen.includes(title);
    [...card.children].forEach(ch=>{
      if (ch===head) return;
      // v52 修：展開時要還原「原本的 inline display」（例如按鈕列的 flex）——
      // 之前直接清空成 ''，把 display:flex 抹掉、gap 全失效，設定頁按鈕黏成一團（v43 起的潛伏 bug）
      if (ch.dataset.origD===undefined) ch.dataset.origD=ch.style.display||'';
      ch.style.display=open?ch.dataset.origD:'none';
    });
    tt.textContent=(open?'▾ ':'▸ ')+title;
    head.classList.add('foldHead');
    head.title=open?'點擊收合':'點擊展開';
    head.addEventListener('click',e=>{
      if (e.target.closest('button,input,select,a,.memberTag,.chip')) return;   // 卡片標題列上的控制項不受影響
      const i=settings.setOpen.indexOf(title);
      if (i>-1) settings.setOpen.splice(i,1); else settings.setOpen.push(title);
      saveSettings(); renderSettings();
    });
  });
};

(function init(){
  const now=new Date();
  document.getElementById('todayLabel').textContent=
    `${now.getFullYear()}/${now.getMonth()+1}/${now.getDate()}（週${WD[now.getDay()]}）`;
  const firstRun=!localStorage.getItem(SETTINGS_KEY);   // 進 loadSettings 前判斷才準
  loadSettings();
  applyMascot();
  applyCatPos();   // 貓咪記得上次待的位置
  renderDatalist();
  load(); loadTrack(); loadNotes(); loadPB(); loadSites(); loadManuals(); loadMoney(); loadStocks(); loadHabits(); loadPomo(); loadDiary();
  renderDatalist();
  checkWipeAtBoot();    // 🛡 先看資料是否異常歸零（要在拍今日快照前判斷）
  takeSnapshot(true);   // 每天第一次開啟自動留快照（最多5份；空快照不會擠掉好快照）
  render();
  decorateUI();
  uiObs.observe(document.body,{childList:true, subtree:true});
  if (firstRun) showOnboard();   // 初次使用：問角色→開功能＋套分類範本
})();
</script>
