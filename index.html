<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<!-- 📱 PWA／加入主畫面（file:// 本機無害；manifest 與圖示連結由 JS 在 http(s) 環境才掛上，避免本機 404） -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Catlendar">
<meta name="theme-color" content="#9aab60">
<script>window.APP_BUILD='v54-2026-09-21';</script><!-- 🔄 版本戳：上線版靠它偵測新版本（每次改版要一起改） -->
<title>Catlendar — 可憐上班族的貓貓日曆 🐾</title>
<!-- 2026-08-07 v41：全站排版打磨——表單標籤化／次要按鈕滑過才亮／追蹤卡表格設定收納 -->
<!-- 2026-08-08 v42：可用性體檢——對比度全面達標（--on-accent/--on-red/--on-green 深色主題自動深字、淺色門檻4.8、accent對soft底驗證）、提示字級12px、術語統一（點名→追蹤）、新用戶導覽補齊 diary 預設關閉 -->
<!-- 2026-08-08 v43：資料防災2.0（快照輪替保護、開機歸零偵測警告卡、定期備份提醒卡）＋匯入預覽（確認才合併、先拍快照、固定狀態面板）＋字體設定搬進「📝 文字顯示」卡＋功能開關分常用/進階＋觸控目標加大＋icon鈕aria-label -->
<style>
  /* 📏 字階規範（v39 收斂，改字級一律從這五階挑，不要自創新尺寸）：
     16px 區塊標題(h2) ｜ 15px 卡片標題/便利貼 ｜ 13.5px 內文 ｜ 12.5px 標籤/按鈕 ｜ 11.5px 提示小字
     例外：10/10.5px 日曆與甘特的微字（空間受限）、14px 圖示型按鈕、17px+ 展示用大數字 */
  :root{
    --bg:#fdf8f2; --card:#ffffff; --ink:#4a4038; --sub:#a3968a; --line:#f0e6da;
    --accent:#e8a87c; --accent-soft:#fbeee2;
    --red:#e0705f; --red-bg:#fdecea;
    --orange:#e09a4a; --orange-bg:#fdf3e3;
    --yellow:#c9a227; --yellow-bg:#faf6e0;
    --gray:#a8a29a; --gray-bg:#f4f1ed;
    --green:#7fb59a; --green-bg:#eaf5ef;
    --blue:#7da7cc; --blue-bg:#ecf3fa;
    --purple:#a98fd1; --purple-bg:#f3eefa;
    --teal:#6cb5ab; --teal-bg:#e9f5f3;
    --pink:#e8949e; --pink-bg:#fceef0;
    --cell-bg:#fffdfa; --faint:#cbbfb2; --muted:#7a7167; --muted2:#877d72; --imp:#b08d1e;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{overflow-x:hidden;}
  body{
    font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;
    background:var(--bg); color:var(--ink); padding:18px 16px 80px;
  }
  .wrap{max-width:1400px; width:100%; margin:0 auto;}

  /* ── 貓咪區 ── */
  .catBar{display:flex; align-items:center; gap:12px; margin-bottom:14px; flex-wrap:wrap;}
  .catBox{position:relative; cursor:pointer; flex:0 0 auto; transition:transform .15s;}
  /* 縮放+旋轉會讓向量貓被點陣化而發糊，改用位移表達互動感 */
  .catBox:hover{transform:translateY(-2px);}
  .catBox:active{transform:translateY(1px);}
  .catBox svg{display:block;}
  .bubble{
    position:relative; background:var(--card); border:2px solid var(--line);
    border-radius:16px; padding:10px 16px; font-size:13.5px; max-width:420px;
    box-shadow:0 2px 6px rgba(180,140,100,.08);
  }
  .bubble::before{
    content:''; position:absolute; left:-10px; top:50%; transform:translateY(-50%);
    border:8px solid transparent; border-right-color:var(--line); border-left:none;
  }
  .bubble::after{
    content:''; position:absolute; left:-7px; top:50%; transform:translateY(-50%);
    border:7px solid transparent; border-right-color:var(--card); border-left:none;
  }
  /* ◽ 極簡模式：泡泡變成一行安靜的狀態文字（無框無箭頭） */
  body.plainUI .bubble{background:transparent; border:none; box-shadow:none;
    padding:6px 0 6px 4px; color:var(--sub); font-size:12.5px;}
  body.plainUI .bubble::before, body.plainUI .bubble::after{display:none;}
  .headRight{margin-left:auto; text-align:right;}
  .headRight h1{font-size:19px; letter-spacing:.5px;}
  .headRight .today{color:var(--sub); font-size:13.5px; margin-top:2px;}
  .headRight .tagline{color:var(--sub); font-size:12.5px; letter-spacing:.5px; margin-top:1px;}
  .heart{
    position:absolute; left:50%; top:-4px; font-size:18px; pointer-events:none;
    animation:floatUp 1.1s ease-out forwards;
  }
  @keyframes floatUp{
    from{opacity:1; transform:translate(-50%,0) scale(.7);}
    to{opacity:0; transform:translate(-50%,-46px) scale(1.25);}
  }
  .m-normal .eyesOpen circle.pupil, .m-alarmed .eyesOpen circle.pupil{
    transform-box:fill-box; transform-origin:center; animation:blink 4.6s infinite;
  }
  @keyframes blink{ 0%,94%,100%{transform:scaleY(1);} 96%,98%{transform:scaleY(.08);} }
  .catBox .eyesHappy,.catBox .eyesSleepy,.catBox .blush,.catBox .sweat,.catBox .zzz{display:none;}
  .catBox.m-happy .eyesOpen{display:none;} .catBox.m-happy .eyesHappy{display:block;} .catBox.m-happy .blush{display:block;}
  .catBox.m-sleepy .eyesOpen{display:none;} .catBox.m-sleepy .eyesSleepy{display:block;} .catBox.m-sleepy .zzz{display:block;}
  .catBox.m-alarmed .sweat{display:block;}
  .zzz{animation:zzzFloat 2.2s infinite ease-in-out;}
  @keyframes zzzFloat{0%,100%{opacity:.4; transform:translateY(0);}50%{opacity:1; transform:translateY(-3px);}}
  .catBox.m-alarmed{animation:shiver 3s infinite;}
  @keyframes shiver{0%,92%,100%{transform:rotate(0);}94%{transform:rotate(2deg);}96%{transform:rotate(-2deg);}98%{transform:rotate(1deg);}}

  .stats{display:flex; gap:12px; font-size:13.5px; color:var(--sub); margin-bottom:12px; flex-wrap:wrap;}
  .stats b{color:var(--ink);}
  .stats .alert b{color:var(--red);}

  /* ── 輸入區 ── */
  .inputCard{background:var(--card); border:2px solid var(--line); border-radius:18px; padding:14px; margin-bottom:16px; box-shadow:0 2px 8px rgba(180,140,100,.07);}
  .inputCard textarea{
    width:100%; min-height:60px; border:none; outline:none; resize:vertical;
    font:inherit; font-size:15px; color:var(--ink); background:transparent;
  }
  .inputCard textarea::placeholder{color:var(--faint);}
  /* 📌📝 新增任務＝兩個固定欄位：標題、內文（使用者明確要求要有各自的填寫處） */
  .inLabel{font-size:12.5px; font-weight:700; color:var(--sub); margin-top:6px;
    display:flex; align-items:baseline; gap:8px;}
  .inLabel .inHint{font-weight:400; font-size:12px; color:var(--muted2);}
  #input{min-height:38px;}
  #inputBody{min-height:52px; font-size:14.5px; line-height:1.7; max-height:60vh;}
  .previewRow{display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-top:8px; min-height:28px;}
  .previewRow:empty{margin-top:0; min-height:0;}   /* 沒東西就不佔位，框框乾淨 */
  .previewRow .hint{font-size:12.5px; color:var(--sub);}
  .quickDates{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; align-items:center;}
  .qlabel{font-size:12.5px; color:var(--sub);}
  .qbtn{
    background:var(--gray-bg); border:none; border-radius:14px; padding:6px 12px; min-height:30px;
    font-size:12.5px; color:var(--muted); cursor:pointer; display:inline-flex; align-items:center; gap:3px;
  }
  /* ♿ 鍵盤焦點一律看得見 */
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:6px;}
  /* 🎛 互動元素統一 150ms 微過渡（UI/UX 準則：即時但不突兀） */
  .qbtn,.chip.clickable,.memberTag,.navItem,.toolRow .filters button,.viewToggle button,
  .btnAdd,.task .actions button,.detailToggle{transition:background .15s,color .15s,border-color .15s,filter .15s,opacity .15s;}
  /* ♿ 使用者系統設定「減少動態」→ 關掉裝飾性動畫 */
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms !important; transition-duration:.01ms !important;}
  }
  /* 文字清晰度：抗鋸齒＋易讀性渲染 */
  body{-webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;}
  /* 🖥 寬螢幕善用空間：任務卡與設定卡雙欄「瀑布式」排列——卡片各自緊貼往下疊，
     高矮不同或收合後的矮卡旁邊不會留大片空白；窄螢幕自動回單欄 */
  @media (min-width:1100px){
    .secGrid{columns:2; column-gap:12px;}
    .secGrid .task{break-inside:avoid;}
    /* 只有一張卡時不分欄，避免孤零零佔半欄 */
    .secGrid:not(:has(.task:nth-child(2))){columns:1;}
    /* 展開編輯列（快選列/專案選單/註解）時維持雙欄：選項自動換行、卡片長高
       （使用者明確要求：不要整區跳回單欄，很怪） */
    #settingsPane{columns:2; column-gap:14px;}
    #settingsPane>.trkCard{break-inside:avoid;}
  }
  /* 💬 註解：便條質感；寬螢幕時像 Word 一樣掛在卡片右側 */
  /* 💬 註解列（Google 文件式）：日期在上、內文在下；✓✕ 平常淡淡的、滑過整條才亮 */
  .cmtRow{padding:8px 2px 6px;}
  .cmtRow .cmtAct{opacity:.25; padding:2px 7px; min-height:0; font-size:11.5px; transition:opacity .12s;}
  .cmtRow:hover .cmtAct{opacity:1;}
  .cmtDate{font-size:11.5px; color:var(--imp); background:var(--yellow-bg); border-radius:8px; padding:1px 7px; white-space:nowrap; font-weight:700;}
  /* 被註解引用的文字：框框起來（藍底＋細框），一眼對得上是哪句被註 */
  .cmtMark{background:var(--blue-bg); color:var(--blue); font-weight:600; border-radius:5px;
    padding:0 4px; border:1px solid var(--blue); box-decoration-break:clone; -webkit-box-decoration-break:clone;}
  /* 💬 卡片右上角的註解 bubble：顯示未處理數量，常駐（不會被「+N」標籤收走） */
  .cmtBubble{position:absolute; top:-8px; right:-6px; z-index:3; cursor:pointer; user-select:none;
    min-width:24px; height:24px; padding:0 7px; border-radius:999px;
    display:inline-flex; align-items:center; justify-content:center; gap:2px;
    font-size:11.5px; font-weight:700; background:var(--accent); color:var(--on-accent,#fff);
    border:2px solid var(--card); box-shadow:0 2px 6px rgba(0,0,0,.18);}
  .cmtBubble:hover{filter:brightness(1.08);}
  .cmtBubble.allDone{background:var(--gray-bg); color:var(--sub); box-shadow:none;}
  /* 🌱 貓咪出門時，門口對話框整條變花園 */
  .gardenBub{background:#fff !important; border:2px dashed var(--green) !important; color:var(--green) !important;
    cursor:pointer; font-weight:600; flex:1; text-align:center;}
  .gardenBub:hover{filter:brightness(.97);}
  .task{position:relative;}
  /* 💬 註解：一律內嵌在卡片下方（側欄浮動版修了四次都會被切/看不到，正式退役）。
     乾淨小卡樣式：白底、細框、絕不出現橫向捲軸 */
  .cmtBox{background:var(--cell-bg); border:1px solid var(--line); border-radius:12px; overflow-x:hidden;}
  .cmtBox textarea{font:inherit; font-size:13.5px; line-height:1.6; color:var(--ink);
    border:1.5px solid var(--line); border-radius:10px; padding:6px 10px;
    resize:none; overflow:hidden; background:var(--card); outline:none;}
  .cmtBox textarea:focus{border-color:var(--accent);}
  /* 摺疊標題統一手感 */
  .foldHead{user-select:none; cursor:pointer;}
  .foldHead:hover{opacity:.8;}
  /* 🐾 開心時蹦一下 */
  @keyframes catHop{0%{transform:translateY(0)}30%{transform:translateY(-8px) rotate(-4deg)}60%{transform:translateY(0)}80%{transform:translateY(-3px)}100%{transform:translateY(0)}}
  #catBox.catBounce svg{animation:catHop .5s ease;}
  /* 📱 觸控裝置：命中面積放大到建議值 */
  @media (pointer:coarse){
    .qbtn{min-height:40px; padding:9px 14px;}
    .chip.clickable{padding:6px 12px;}
    .navItem{min-height:44px;}
  }
  .qbtn:hover{background:var(--accent-soft); color:var(--accent);}
  .qbtn.on{background:var(--accent); color:var(--on-accent,#fff);}
  .qbtn input[type=date]{border:none; background:transparent; font:inherit; font-size:12.5px; color:inherit; width:112px; cursor:pointer;}
  .whoInput{
    border:1.5px solid var(--line); border-radius:14px; padding:3px 10px; font:inherit;
    font-size:12.5px; width:110px; color:var(--ink); background:var(--card); outline:none;
  }
  .whoInput:focus{border-color:var(--accent);}
  /* 👤 對象建議小下拉（最多 5 筆） */
  #whoSuggest{display:none; position:absolute; z-index:400; min-width:130px; max-width:220px;
    background:var(--card); border:1.5px solid var(--line); border-radius:12px;
    box-shadow:0 6px 18px rgba(0,0,0,.12); padding:4px; overflow:hidden;}
  #whoSuggest .whoOpt{padding:6px 12px; font-size:13.5px; color:var(--ink); border-radius:8px;
    cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  #whoSuggest .whoOpt:hover, #whoSuggest .whoOpt.hi{background:var(--accent-soft); color:var(--accent);}
  .inputActions{display:flex; justify-content:flex-end; align-items:center; gap:10px; margin-top:10px;}
  .inputActions .tip{font-size:12.5px; color:var(--sub); margin-right:auto;}
  button{font:inherit; cursor:pointer; border:none; border-radius:10px;}
  .btnAdd{background:var(--accent); color:var(--on-accent,#fff); padding:8px 26px; font-size:15px; border-radius:20px; box-shadow:0 2px 5px rgba(232,168,124,.4);}
  .btnAdd:hover{filter:brightness(1.07);}

  /* chips */
  .chip{display:inline-flex; align-items:center; gap:4px; font-size:12.5px; padding:4px 10px; border-radius:20px; white-space:nowrap;}
  .chip.clickable{cursor:pointer; user-select:none;}
  .chip.clickable:hover{filter:brightness(.95);}
  .cat-課規{background:var(--blue-bg); color:var(--blue);}
  .cat-SOS{background:var(--purple-bg); color:var(--purple);}
  .cat-跨校通識{background:var(--teal-bg); color:var(--teal);}
  .cat-其他{background:var(--gray-bg); color:var(--gray);}
  .urg-red{background:var(--red-bg); color:var(--red); font-weight:bold;}
  .urg-orange{background:var(--orange-bg); color:var(--orange);}
  .urg-yellow{background:var(--yellow-bg); color:var(--yellow);}
  .urg-gray{background:var(--gray-bg); color:var(--gray);}
  .chip.type{background:var(--gray-bg); color:var(--muted2);}
  .chip.who{background:var(--pink-bg); color:var(--pink);}
  .tag{border:1.5px solid transparent;}
  .tag-急{background:var(--red-bg); color:var(--red);}
  .tag-重要{background:var(--yellow-bg); color:var(--imp); font-weight:700; box-shadow:inset 0 0 0 1.5px var(--yellow);}
  .tag-不急{background:var(--green-bg); color:var(--green);}
  .tag.off{background:transparent; color:var(--faint); border-color:var(--line);}

  /* 篩選＋檢視切換 */
  .toolRow{display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; align-items:center;}
  .toolRow .filters{display:flex; gap:6px; flex-wrap:wrap;}
  .toolRow .filters button{background:var(--card); border:1.5px solid var(--line); padding:5px 14px; border-radius:20px; font-size:13.5px; color:var(--sub);}
  .toolRow .filters button.on{background:var(--ink); color:var(--bg); border-color:var(--ink);}
  .viewToggle{margin-left:auto; display:flex; gap:4px; background:var(--card); border:1.5px solid var(--line); border-radius:20px; padding:3px;}
  .viewToggle button{background:none; padding:4px 14px; font-size:13.5px; color:var(--sub); border-radius:16px;}
  .viewToggle button.on{background:var(--accent); color:var(--on-accent,#fff);}

  /* 區塊 */
  .section{margin-bottom:22px;}
  .section h2{font-size:16px; margin-bottom:8px; display:flex; align-items:center; gap:6px;}
  /* ⏳ 等回覆區顯眼化：淡藍底＋虛線框，一眼看到「這區在等別人」 */
  .section.waitSec{background:var(--blue-bg); border:1.5px dashed var(--blue); border-radius:14px; padding:12px 12px 6px;}
  .section.waitSec h2{color:var(--blue);}
  .section h2 .count{font-size:11.5px; color:var(--muted); font-weight:600;
    background:var(--gray-bg); border-radius:10px; padding:1px 8px;}
  .section h2 .secSub{font-size:12px; color:var(--muted2); font-weight:normal; letter-spacing:.2px;}
  .empty{font-size:13.5px; color:var(--muted); padding:14px 2px; text-align:center; line-height:1.7;}

  /* 任務卡 */
  .task{background:var(--card); border:1.5px solid var(--line); border-radius:14px; padding:10px 13px; margin-bottom:8px; box-shadow:0 1px 3px rgba(180,140,100,.06);}
  /* 急切度只靠「分區＋彩色標籤」表達——邊框重複編碼一律不要（v33.1 拿掉粗邊、
     v37 連細紅線也拿掉：使用者嫌醜，且 🔴逾期 標籤已足夠表意） */
  .task.doneCard{opacity:.55;}
  .task .title{font-size:15px; line-height:1.5; word-break:break-word; font-weight:600;}
  .task .dragHandle{cursor:grab; color:var(--faint); user-select:none; font-size:14px;
    margin-right:6px; touch-action:none; display:none; padding:0 2px;}
  /* 只有任務清單的分區（secGrid）內才能拖曳排序——其他場景（總月曆日清單等）不顯示把手，免得看得到拉不動 */
  .secGrid > .task .dragHandle{display:inline-block;}
  .task .dragHandle:hover{color:var(--accent);}
  .task.dragging{opacity:.45;}
  .task.dropBefore{box-shadow:0 -3px 0 0 var(--accent);}
  .task.dropAfter{box-shadow:0 3px 0 0 var(--accent);}
  .task .title.done{text-decoration:line-through; color:var(--sub); font-weight:normal;}
  .task .titleEdit{width:100%; font:inherit; font-size:15px; font-weight:600; color:var(--ink);
    border:1.5px solid var(--accent); border-radius:8px; padding:4px 8px; outline:none;}
  /* v54 長文排版：正文色 15px/1.75、拿掉灰底與內層捲動（捲中捲很難讀）、左側細線當引導、閱讀寬上限約 40 字；
     超過 6 行先收合＋漸層遮罩，按「展開全文」才全開 */
  .task .detail{font-size:15px; color:var(--ink); line-height:1.75; white-space:pre-wrap; word-break:break-word;
    margin-top:6px; padding:2px 4px 2px 12px; border-left:3px solid var(--line); max-width:40em; position:relative;}
  .task .detail.clamp{max-height:10.6em; overflow:hidden;}
  .task .detail.clamp::after{content:''; position:absolute; left:0; right:0; bottom:0; height:3.2em; pointer-events:none;
    background:linear-gradient(to bottom, transparent, var(--card));}
  .task .detail b,.task .detail strong{font-weight:700; background:linear-gradient(transparent 58%, var(--accent-soft) 58%); padding:0 1px;}
  .previewRow .hint.addedOk{display:inline-block; font-size:13.5px; font-weight:700; color:var(--green); background:var(--green-bg);
    border-radius:999px; padding:3px 12px;}
  @keyframes v54NewCard{0%{box-shadow:0 0 0 3px var(--accent);} 100%{box-shadow:0 0 0 0 transparent;}}
  .task.justAdded{animation:v54NewCard 1.8s ease-out 1;}
  .searchEmpty{display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-size:13.5px; line-height:1.6; color:var(--ink);
    background:var(--orange-bg); border:1.5px solid var(--orange); border-radius:12px; padding:9px 14px; margin-bottom:10px;}
  .task .detailToggle{background:none; font-size:12.5px; color:var(--sub); padding:2px 4px; margin-top:2px;}
  .task .detailToggle:hover{color:var(--accent);}
  .task .meta{display:flex; align-items:center; gap:5px; flex-wrap:wrap; margin-top:7px;}
  .task .meta .spacer{flex:1;}
  .task .actions{display:flex; gap:1px; flex-wrap:wrap;}
  .task .actions button{background:none; padding:4px 7px; font-size:12.5px; color:var(--sub); border-radius:8px;}
  /* 🧹 桌面版降噪：動作鈕與「📝 加內文」平常淡淡的，滑到卡片上才亮（觸控裝置維持常亮）
     ——每張卡都印一行「加內文」被使用者反映很吵 */
  @media (hover:hover){
    .task .actions button, .task .addBody{opacity:.4; transition:opacity .12s;}
    .task:hover .actions button, .task .actions button:focus-visible,
    .task:hover .addBody, .task .addBody:focus-visible,
    .task .actions button.confirmDel{opacity:1;}
  }
  .task .actions button:hover{background:var(--accent-soft); color:var(--ink);}
  .task .actions button.primary{color:var(--green);}
  .task .actions button.danger:hover{color:var(--red);}
  .task .actions button.confirmDel{background:var(--red); color:var(--on-red,#fff);}
  .task .actions button.confirmDel:hover{background:var(--red); color:var(--on-red,#fff);}
  .task .waitInfo{font-size:12.5px; color:var(--orange); margin-top:4px;}
  .task .waitInfo.due{color:var(--red); font-weight:bold;}
  .task .pickerRow{display:flex; gap:6px; margin-top:7px; align-items:center; flex-wrap:wrap;
    background:var(--bg); border-radius:10px; padding:6px 8px;}
  .task .pickerRow .plabel{font-size:12.5px; color:var(--sub);}
  .task .subList{display:flex; flex-direction:column; gap:4px; margin-top:7px;
    background:var(--bg); border-radius:10px; padding:7px 10px;}
  .task .subItem{display:flex; align-items:center; gap:7px; font-size:13.5px; cursor:pointer;}
  .task .subItem input{accent-color:var(--accent); width:15px; height:15px; cursor:pointer; margin:0;}
  .task .subItem .subName{color:var(--ink); cursor:text;}
  .task .subItem .subEdit{background:none; border:none; padding:0 4px; font-size:12.5px; color:var(--faint); cursor:pointer;}
  .task .subItem:hover .subEdit{color:var(--accent);}
  .task .subItem.subDone .subName{color:var(--sub); text-decoration:line-through;}
  .task .subItem .subDate{font-size:12.5px; color:var(--green); margin-left:auto;}
  /* ☑ 清單底部常駐的「＋加一項」列：平常淡淡的，滑過/聚焦才亮 */
  .task .subAddRow{display:flex; align-items:center; gap:6px; margin-top:2px;}
  .task .subAddRow input{border:1.5px dashed var(--line); border-radius:10px; padding:3px 10px;
    font:inherit; font-size:12.5px; flex:1; min-width:0; max-width:220px;
    color:var(--ink); background:var(--card); outline:none; opacity:.65;}
  .task .subAddRow input:focus{border-color:var(--accent); border-style:solid; opacity:1;}
  .task .subAddRow button{background:none; border:none; padding:2px 6px; font-size:13.5px;
    color:var(--sub); cursor:pointer;}
  .task .subAddRow button:hover{color:var(--accent);}
  .chip.subProg{background:var(--green-bg); color:var(--green);}

  /* ── 日曆 ── */
  .calCard{background:var(--card); border:2px solid var(--line); border-radius:18px; padding:14px; margin-bottom:18px;}
  .calHead{display:flex; align-items:center; justify-content:center; gap:14px; margin-bottom:10px;}
  .calHead .mTitle{font-size:16px; font-weight:bold; min-width:110px; text-align:center;}
  .calHead button{background:var(--gray-bg); border-radius:50%; width:28px; height:28px; font-size:13.5px; color:var(--muted);}
  .calHead button:hover{background:var(--accent-soft); color:var(--accent);}
  .calHead .todayBtn{width:auto; border-radius:14px; padding:0 12px; font-size:12.5px; height:26px;}
  .quadGrid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}   /* 🎯 象限：桌機 2×2 */
  .calGrid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px;}
  .calGrid .wd{text-align:center; font-size:12.5px; color:var(--sub); padding:4px 0;}
  .calCell{
    min-height:clamp(88px, 10vw, 170px);
    border:1.5px solid var(--line); border-radius:10px; padding:4px 6px;
    cursor:pointer; background:var(--cell-bg); overflow:hidden;
  }
  .calIcons{line-height:1.2; margin-bottom:2px;}
  .calIcon{display:inline-block; font-size:17px; margin:0 1px; cursor:pointer;}
  .calIcon.endDay{border-bottom:2.5px solid var(--red); padding-bottom:1px;}
  .calCell:hover{border-color:var(--accent);}
  .calCell.dim{opacity:.35;}
  .calCell.today{border-color:var(--accent); background:var(--accent-soft);}
  .calCell.sel{outline:2px solid var(--accent);}
  .calCell .dnum{font-size:clamp(12px,1vw,14.5px); color:var(--sub); margin-bottom:2px;}
  .calCell.today .dnum{color:var(--accent); font-weight:bold;}
  .calWd{display:none;}   /* 星期小字：只在手機週列表顯示 */
  .calPill{
    display:block; font-size:clamp(11px,1vw,13.5px); border-radius:6px; padding:2px 6px; margin-bottom:2px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; cursor:pointer;
  }
  .calPill:hover{filter:brightness(.92);}
  .habDot{width:22px; height:22px; border-radius:50%; background:var(--gray-bg);
    display:inline-flex; align-items:center; justify-content:center; font-size:10.5px; color:var(--sub);}
  .habDot.on{background:var(--accent); color:var(--on-accent,#fff);}
  .habDot.today{box-shadow:0 0 0 2px var(--card), 0 0 0 3.5px var(--accent);}
  .habCell{width:30px; height:30px; border:none; border-radius:9px; background:var(--gray-bg);
    font-size:12.5px; color:var(--sub); cursor:pointer; display:flex; align-items:center; justify-content:center;}
  .habCell.on{background:var(--accent); color:var(--on-accent,#fff);}
  .habCell.today{box-shadow:0 0 0 2px var(--accent);}
  .habDot.part, .habCell.part{background:var(--accent-soft); color:var(--accent); border:1.5px solid var(--accent);}
  .hdSq{width:15px; height:15px; border-radius:4px; background:var(--gray-bg); display:inline-block;}
  .hdSq.on{background:var(--accent);}
  .hdSq.part{background:var(--accent-soft); box-shadow:inset 0 0 0 1.5px var(--accent);}
  .hdSq.ns{opacity:.22;}
  .calPill.more{background:none; color:var(--sub);}
  .calPill.donePill{background:var(--green-bg); color:var(--green);}
  .calModes{display:flex; gap:6px; justify-content:center; margin-bottom:6px; flex-wrap:wrap;}
  .calLegend{text-align:center; font-size:12.5px; color:var(--sub); margin-bottom:8px;}
  .calDayList h3{font-size:13.5px; margin:14px 0 8px;}

  /* ── 側邊導覽＋設定頁 ── */
  .appLayout{display:flex; gap:14px; align-items:flex-start;}
  .sideNav{flex:0 0 132px; display:flex; flex-direction:column; gap:6px; position:sticky; top:12px;}
  .navItem{background:var(--card); border:1.5px solid var(--line); border-radius:12px; padding:10px 13px;
    font-size:15px; color:var(--sub); text-align:left; cursor:pointer;}
  .navItem:hover{border-color:var(--accent); color:var(--accent);}
  .navItem.on{background:var(--accent); border-color:var(--accent); color:var(--on-accent,#fff);}
  .navDivider{height:1px; background:var(--line); margin:6px 4px;}
  .spaceBtn{background:var(--accent-soft); border-color:var(--accent-soft); color:var(--accent); font-weight:600;}
  .spaceBtn.life{background:var(--pink-bg); border-color:var(--pink-bg); color:var(--pink);}
  .spaceBtn.allv{background:var(--blue-bg); border-color:var(--blue-bg); color:var(--blue);}
  .mainCol{flex:1; min-width:0; max-width:100%;}
  .trkCard,.inputCard,.calCard{max-width:100%;}
  .calGrid>*{min-width:0;}
  .catc-blue{background:var(--blue-bg); color:var(--blue);}
  .catc-purple{background:var(--purple-bg); color:var(--purple);}
  .catc-teal{background:var(--teal-bg); color:var(--teal);}
  .catc-pink{background:var(--pink-bg); color:var(--pink);}
  .catc-green{background:var(--green-bg); color:var(--green);}
  .catc-orange{background:var(--orange-bg); color:var(--orange);}
  .catc-yellow{background:var(--yellow-bg); color:var(--yellow);}
  .catc-gray{background:var(--gray-bg); color:var(--gray);}
  /* 📊 時間軸（甘特）檢視 */
  .ganttWrap{overflow-x:auto; padding-bottom:8px;}
  .gHead{display:flex;}
  .gHead .gPad{flex:0 0 150px;}
  .gHead .gDay{flex:0 0 26px; font-size:10px; color:var(--sub); text-align:center; overflow:hidden;}
  .gRow{display:flex; align-items:center; min-height:30px;}
  .gLabel{flex:0 0 150px; font-size:12.5px; padding-right:6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .gTrack{position:relative; height:24px; border-radius:4px;
    background:repeating-linear-gradient(to right, var(--faint) 0 1px, transparent 1px 26px);}
  .gBar{position:absolute; top:2px; height:20px; border-radius:10px; font-size:11.5px; line-height:20px; padding:0 7px;
    white-space:nowrap; overflow:hidden; cursor:grab; touch-action:none; user-select:none; box-shadow:0 1px 2px rgba(0,0,0,.15);}
  .gBar.dragging{opacity:.75; cursor:grabbing;}
  .gToday{position:absolute; top:0; bottom:0; width:2px; background:var(--red); opacity:.55; pointer-events:none;}
  /* 🎖 習慣集點卡 */
  .stampRow{display:flex; flex-wrap:wrap; gap:5px; margin-top:8px;}
  .stamp{width:26px; height:26px; border-radius:50%; border:1.5px dashed var(--muted);
    display:flex; align-items:center; justify-content:center; font-size:13.5px; box-sizing:border-box;}
  .stamp.on{border:1.5px solid var(--green); background:var(--green-bg);}
  .stamp.today{box-shadow:0 0 0 2px var(--accent);}
  .stamp.future{opacity:.35;}
  .stamp.rest{border:none; opacity:.3;}
  .dotc-blue{background:var(--blue);} .dotc-purple{background:var(--purple);} .dotc-teal{background:var(--teal);}
  .dotc-pink{background:var(--pink);} .dotc-green{background:var(--green);} .dotc-orange{background:var(--orange);}
  .dotc-yellow{background:var(--yellow);} .dotc-gray{background:var(--gray);}
  .colorDot{width:20px; height:20px; border-radius:50%; border:2px solid var(--card); box-shadow:0 0 0 1.5px var(--line); cursor:pointer; padding:0; flex:0 0 auto;}
  .catRow{display:flex; gap:8px; align-items:center; flex-wrap:wrap; padding:7px 0; border-bottom:1px solid var(--line);}
  .catRow:last-of-type{border-bottom:none;}
  .miniSelect{border:1.5px solid var(--line); border-radius:10px; padding:4px 6px; font:inherit; font-size:12.5px; color:var(--ink); background:var(--card); outline:none; cursor:pointer;}
  .mascotGrid{display:flex; gap:10px; flex-wrap:wrap; margin-top:10px;}
  .mascotOpt{display:flex; flex-direction:column; align-items:center; gap:4px; padding:10px 12px;
    background:var(--bg); border:2px solid var(--line); border-radius:14px; cursor:pointer; font-size:12.5px; color:var(--sub);}
  .mascotOpt:hover{border-color:var(--accent);}
  .mascotOpt.on{border-color:var(--accent); background:var(--accent-soft); color:var(--accent); font-weight:600;}
  .setNote{font-size:12.5px; color:var(--sub); line-height:1.8;}
  code{background:var(--gray-bg); border-radius:4px; padding:0 5px; font-family:Consolas,'Courier New',monospace; font-size:.92em;}
  .mdPre{background:var(--gray-bg); border-radius:8px; padding:8px 10px; margin:4px 0;
    font-family:Consolas,'Courier New',monospace; font-size:12.5px; overflow-x:auto; white-space:pre;}
  /* 迷你 Markdown（Notion 式）：分級標題／引用／分隔線／表格 */
  .mdH1{font-weight:800; font-size:1.3em; margin:8px 0 3px; line-height:1.4;}
  .mdH2{font-weight:700; font-size:1.16em; margin:7px 0 2px; line-height:1.4;}
  .mdH3{font-weight:700; font-size:1.06em; margin:5px 0 1px; line-height:1.4;}
  .mdQuote{border-left:3px solid var(--accent); padding:1px 0 1px 10px; color:var(--muted); margin:3px 0;}
  .mdHr{border:none; border-top:1.5px solid var(--line); margin:9px 0;}
  .mdTableWrap{overflow-x:auto; margin:6px 0; max-width:100%;}
  .mdTable{border-collapse:collapse; font-size:.95em; white-space:normal;}
  .mdTable th,.mdTable td{border:1px solid var(--line); padding:4px 10px; text-align:left; vertical-align:top;}
  .mdTable th{background:var(--gray-bg); font-weight:700;}
  .mdCheck{opacity:.85;}
  .monoText .task .detail, .monoText .stickyNote .nText{font-family:Consolas,'Courier New',monospace; font-size:13.5px;}
  /* 記事本 */
  .noteGrid{display:flex; flex-wrap:wrap; gap:12px; align-items:flex-start;}
  .stickyNote{
    color:#4a4038;   /* 便利貼永遠是亮色紙，字固定深色（深色模式也是） */
    width:228px; padding:12px 13px 9px; border-radius:4px 16px 16px 16px;
    box-shadow:0 2px 6px rgba(180,140,100,.15); font-size:13.5px; line-height:1.6;
    transition:box-shadow .15s;
    /* 抓右下角可以直接拉大小（拉過的尺寸會記住） */
    resize:both; overflow:auto; min-width:170px; min-height:84px; max-width:100%;
    display:flex; flex-direction:column;
    /* 原本的微旋轉會讓文字在部分螢幕發糊，為了易讀性拿掉（歪斜感改用圓角表現） */
  }
  .stickyNote .nText{flex:1;}
  .stickyNote:nth-child(even){border-radius:16px 4px 16px 16px;}
  .stickyNote:hover{box-shadow:0 4px 10px rgba(180,140,100,.25);}
  .stickyNote.szM{width:340px; font-size:13.5px;}
  .stickyNote.szL{width:100%; font-size:15px;}
  .stickyNote .nText{white-space:pre-wrap; word-break:break-word; cursor:text; min-height:20px;}
  .stickyNote .nFoot{display:flex; flex-wrap:wrap; row-gap:2px; align-items:center; gap:6px; margin-top:auto; padding-top:8px; font-size:11.5px; color:rgba(0,0,0,.35);}
  .stickyNote .nFoot .spacer{flex:1;}
  .stickyNote .nFoot button{background:none; padding:3px 6px; font-size:14px; color:rgba(0,0,0,.4); border-radius:6px;}
  .stickyNote .nFoot button:hover{color:var(--red);}
  .stickyNote textarea{
    width:100%; border:none; outline:none; background:transparent;
    font:inherit; font-size:inherit; line-height:inherit; color:inherit;
    resize:none; min-height:60px; overflow:hidden; flex:1;
  }
  /* 📔 手札：長內容的便利貼型態——全寬、跟著佈景主題走、支援 Markdown */
  .journalCard{background:var(--cell-bg); border:1.5px solid var(--line); border-left:5px solid var(--accent);
    border-radius:12px; padding:14px 18px; width:100%; font-size:15px; line-height:1.75;
    box-shadow:0 1px 4px rgba(0,0,0,.05);}
  .journalCard .nText{white-space:pre-wrap; word-break:break-word; cursor:text; min-height:24px;}
  .journalCard .nFoot{display:flex; flex-wrap:wrap; row-gap:2px; align-items:center; gap:6px; margin-top:10px;
    padding-top:8px; border-top:1px dashed var(--line); font-size:11.5px; color:var(--sub);}
  .journalCard .nFoot .spacer{flex:1;}
  .journalCard .nFoot button{background:none; padding:3px 6px; font-size:14px; color:var(--sub); border-radius:6px;}
  .journalCard .nFoot button:hover{color:var(--red);}
  .journalCard textarea{
    width:100%; border:none; outline:none; background:transparent;
    font:inherit; font-size:inherit; line-height:inherit; color:inherit;
    resize:none; min-height:80px; overflow:hidden;
  }
  .journalSecHead{font-weight:700; font-size:15px; margin:16px 0 10px; display:flex; align-items:center; gap:8px;}
  .editHint{font-size:12px; color:var(--muted2); margin-top:2px; user-select:none;}
  /* 🔔 跨頁動作回饋條：釘在畫面下方、附「前往」鈕——貓咪泡泡會消失，這個看得見也點得到 */
  #catToast{position:fixed; left:50%; bottom:20px; transform:translate(-50%,16px); opacity:0; pointer-events:none;
    display:flex; gap:10px; align-items:center; background:var(--card); border:1.5px solid var(--accent);
    border-radius:14px; padding:10px 16px; font-size:13.5px; color:var(--ink);
    box-shadow:0 6px 22px rgba(0,0,0,.18); z-index:98; transition:all .25s; max-width:92vw;}
  #catToast.show{opacity:1; transform:translate(-50%,0); pointer-events:auto;}
  #catToast button{background:var(--accent); color:var(--on-accent,#fff); border-radius:10px; padding:5px 12px; font-size:12.5px; white-space:nowrap;}
  #catToast button.tClose{background:none; color:var(--sub); padding:5px 4px;}
  /* 💬 滑過「💬 N」標籤的預覽泡泡 */
  #cmtPeek{position:fixed; display:none; z-index:97; width:300px; max-width:92vw;
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    box-shadow:0 6px 18px rgba(0,0,0,.16); padding:9px 12px; pointer-events:none;}
  .ri{width:15px; height:15px; display:inline-block; vertical-align:-2px; pointer-events:none;}
  .chip .ri,.plabel .ri,.qlabel .ri{width:13px; height:13px; vertical-align:-2px;}
  .nFoot button .ri:hover{color:inherit;}
  .palSw{width:24px; height:24px; border-radius:50%; border:2px solid var(--line); cursor:pointer; padding:0;}
  .palSw:hover{transform:scale(1.12);}
  .palSw.on{border-color:var(--ink); transform:scale(1.12);}
  .nDot{width:13px; height:13px; border-radius:50%; border:1.5px solid rgba(0,0,0,.15); padding:0; cursor:pointer;}
  .nDot.on{border-color:rgba(0,0,0,.5); transform:scale(1.15);}
  .nBadge{font-size:12.5px; color:var(--green); font-weight:600; margin-top:6px;}
  .nAttach{margin-top:6px; display:flex; gap:5px; flex-wrap:wrap; font-size:12.5px;}
  .n-yellow{background-color:#fdf3c9;} .n-pink{background-color:#fde3e7;} .n-blue{background-color:#ddedfa;}
  .n-green{background-color:#ddf2e4;} .n-purple{background-color:#ece4f8;}
  /* 紙張質感：頂部一抹光澤＋左上折角圓角（顏色本身由 .n-* 決定） */
  .stickyNote{background-image:linear-gradient(180deg, rgba(255,255,255,.45), rgba(255,255,255,0) 30px);}
  /* 電話簿 */
  .pbGroupHead{display:flex; align-items:center; gap:8px; cursor:pointer; font-weight:700; font-size:15px; user-select:none;}
  .pbCount{font-size:12.5px; color:var(--sub); font-weight:normal;}
  .pbRow{display:flex; gap:8px; align-items:center; flex-wrap:wrap; padding:8px 2px; border-bottom:1px solid var(--line); font-size:13.5px;}
  .pbRow .qbtn{font-size:13.5px;}   /* 列上的動作鈕加大，一眼看得懂 */
  .pbRow:last-child{border-bottom:none;}
  .pbName{font-weight:600;}
  .pbInfo{color:var(--sub); font-size:12.5px; display:inline-flex; gap:4px; align-items:center;}
  .pbInfo a{color:var(--blue); text-decoration:none;}
  .pbInfo a:hover{text-decoration:underline;}
  .pbNote{font-size:12.5px; color:var(--sub); width:100%; padding-left:2px;}

  /* ── 回傳追蹤區 ── */
  .trkCard{background:var(--card); border:2px solid var(--line); border-radius:18px; padding:14px; margin-bottom:12px; box-shadow:0 2px 8px rgba(180,140,100,.07);}
  /* 🏠 首頁模組卡：可點前往 → 滑過亮框給回饋 */
  .homeCard{transition:border-color .15s;}
  .homeCard:hover{border-color:var(--accent);}
  .trkHead{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .trkHead .tTitle{font-weight:700; font-size:16px;}
  .trkHead .spacer{flex:1;}
  .progressWrap{display:flex; align-items:center; gap:10px; margin-top:10px;}
  .progressBar{flex:1; height:7px; background:var(--gray-bg); border-radius:4px; overflow:hidden;}
  .progressFill{height:100%; background:var(--green); border-radius:4px; transition:width .3s;}
  .progressText{font-size:12.5px; color:var(--sub); white-space:nowrap;}
  .tblWrap{overflow-x:auto; margin-top:10px;}
  .trkTable{width:100%; border-collapse:collapse; font-size:13.5px;}
  .trkTable th{text-align:left; color:var(--sub); font-weight:normal; font-size:12.5px; padding:4px 8px; border-bottom:1.5px solid var(--line); white-space:nowrap;}
  .trkTable td{padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:middle;}
  .trkTable tr:last-child td{border-bottom:none;}
  .trkTable input[type=checkbox]{accent-color:var(--accent); width:16px; height:16px; cursor:pointer;}
  .trkTable .rDone .rName{color:var(--sub); text-decoration:line-through;}
  .trkTable .rOver .rName{color:var(--red); font-weight:600;}
  .trkTable .rOver .rDue{color:var(--red); font-weight:600;}
  .trkTable .rDue{font-size:12.5px; color:var(--sub);}
  .trkTable .rDate{font-size:12.5px; color:var(--green); white-space:nowrap;}
  .trkTable tr.rSkip{opacity:.55;}
  .trkTable tr.rSkip .rName{text-decoration:line-through; color:var(--sub);}
  .numIn{width:46px; text-align:center; -moz-appearance:textfield;}
  .numIn::-webkit-outer-spin-button, .numIn::-webkit-inner-spin-button{-webkit-appearance:none; margin:0;}
  .miniInput{border:1.5px solid var(--line); border-radius:10px; padding:4px 9px; font:inherit; font-size:12.5px; color:var(--ink); background:var(--card); outline:none;}
  .miniInput:focus{border-color:var(--accent);}
  .cellInput{border:none; background:transparent; font:inherit; font-size:13.5px; color:var(--ink);
    outline:none; width:100%; min-width:72px; padding:2px 4px; border-radius:6px;
    border-bottom:1px dashed transparent;}
  .cellInput:hover{border-bottom-color:var(--line);}
  .cellInput:focus{background:var(--accent-soft); border-bottom-color:var(--accent);}
  .cellInput::placeholder{color:var(--faint);}
  .trkNote{width:100%; margin-top:10px; border:1.5px solid var(--line); border-radius:10px; padding:8px 10px; font:inherit; font-size:13.5px; color:var(--ink); background:var(--bg); outline:none; resize:vertical; min-height:42px;}
  .trkNote:focus{border-color:var(--accent);}
  .pasteArea{min-height:64px; transition:min-height .25s ease;}
  .pasteArea:focus, .pasteArea.big{min-height:240px;}
  .ghostBtn{background:var(--card); border:1.5px dashed var(--line); color:var(--sub); border-radius:14px; padding:6px 14px; font-size:13.5px;}
  .ghostBtn:hover{border-color:var(--accent); color:var(--accent);}
  .memberTag{display:inline-flex; align-items:center; gap:4px; background:var(--gray-bg); border-radius:12px; padding:3px 10px; font-size:12.5px; cursor:pointer; border:1.5px solid transparent; user-select:none;}
  .memberTag:hover{filter:brightness(.96);}
  .memberTag.on{background:var(--accent-soft); color:var(--accent); border-color:var(--accent);}
  .pickerRow{display:flex; gap:6px; margin-top:7px; align-items:center; flex-wrap:wrap;
    background:var(--bg); border-radius:10px; padding:6px 8px;}

  /* 🧾 表單通用：欄位名在上、輸入框在下（股票／習慣編輯等表單用，看得懂每格要填什麼） */
  .fField{display:inline-flex; flex-direction:column; gap:3px;}
  .fField .fLab{font-size:11.5px; color:var(--sub); font-weight:600; letter-spacing:.3px; white-space:nowrap;}
  .fRow{display:flex; gap:8px 12px; flex-wrap:wrap; align-items:flex-end;}

  /* 🫥 卡片上的次要按鈕（封存/刪除/設定）：平常淡淡的，滑到卡片上才亮（觸控維持常亮） */
  @media (hover:hover){
    .subtleBtn{opacity:.35; transition:opacity .15s;}
    .trkCard:hover .subtleBtn, .subtleBtn:focus-visible{opacity:1;}
    /* 便利貼／手札的動作列同理：滑過那張才浮現，牆面乾淨很多 */
    .stickyNote .nFoot button, .journalCard .nFoot button{opacity:0; transition:opacity .15s;}
    .stickyNote:hover .nFoot button, .stickyNote:focus-within .nFoot button,
    .journalCard:hover .nFoot button, .journalCard:focus-within .nFoot button{opacity:1;}
    /* 任務卡拖曳把手也一樣：要用再亮 */
    .secGrid > .task .dragHandle{opacity:.3; transition:opacity .15s;}
    .task:hover .dragHandle{opacity:1;}
  }
  /* 追蹤表格：滑過整列微亮，長名單不看丟行 */
  .trkTable tbody tr:hover td{background:var(--bg);}
  /* 「無期限」灰 chip 資訊量低，降噪（仍可點擊設期限） */
  .chip.urg-gray{opacity:.65;}

  /* footer */
  .footer{display:flex; gap:10px; justify-content:center; margin-top:30px; flex-wrap:wrap;}
  .footer button{background:var(--card); border:1.5px solid var(--line); padding:6px 16px; font-size:13.5px; color:var(--sub); border-radius:16px;}
  .footer button:hover{color:var(--ink); border-color:var(--accent);}
  .footer button.confirmClear{background:var(--red); color:var(--on-red,#fff); border-color:var(--red);}
  .footer .note{width:100%; text-align:center; font-size:12.5px; color:var(--muted2); margin-top:6px;}
  details.doneSection summary{cursor:pointer; font-size:13.5px; color:var(--sub); margin-bottom:8px; user-select:none;}

  /* 手機 */
  @media (max-width:880px){
    body{padding:12px 8px 60px;}
    /* v52 修：直排後 align-items 必須改 stretch——沿用桌機的 flex-start 會讓內容欄
       縮成「內容自然寬」，內容少的頁（首頁空狀態、習慣打卡）整欄變窄靠左 */
    .appLayout{flex-direction:column; align-items:stretch;}
    .sideNav{flex-direction:row; position:static; width:100%; flex:auto; flex-wrap:wrap;}
    .navItem{flex:1 1 auto; text-align:center; padding:8px 10px; font-size:13.5px;}
    .navDivider{display:none;}
    .headRight{margin-left:0; text-align:left; width:100%;}
    .bubble{max-width:100%;}
    .calCell{min-height:64px;}
    .calPill{font-size:10.5px;}
    .task .actions button{padding:5px 8px;}
  }
  /* 📱 v43 觸控裝置：點擊目標加大（桌機滑鼠完全不受影響） */
  @media (pointer:coarse){
    .task .actions button, .task .addBody{min-height:38px; padding:8px 12px;}
    .qbtn{min-height:40px; padding:8px 14px;}
    .memberTag{padding:8px 12px;}
    .navItem{min-height:42px;}
    .tag{padding:6px 10px;}
    /* v48 四角色測試補漏：檢視切換／搜尋框／下拉選單／頁尾備份鈕／日曆翻頁鈕 */
    .viewToggle button{min-height:38px; padding:8px 14px;}
    .miniInput{min-height:38px; padding-top:7px; padding-bottom:7px;}
    .miniSelect{min-height:38px;}
    .footer button{min-height:42px; padding:9px 18px;}
    .calHead button{width:38px; height:38px;}
    .calHead .todayBtn{height:38px; width:auto;}
    .toolRow .filters button{min-height:38px;}
  }
  /* 📱 手機殼 Phase 1（≤600px）：底部固定導覽列＋貓咪列瘦身＋輸入區摺疊浮動鈕 */
  #mobAddBtn{display:none;}
  .mobOnly{display:none !important;}   /* 只在手機出現的控制項（桌機藏） */
  @media (max-width:600px){
    /* 🧹 手機減法（2026-08-25 真機回饋）：說明文字與次要控制項收斂，易讀易用優先 */
    .mobHide{display:none !important;}
    .mobOnly{display:inline-flex !important;}
    .calLegend{display:none;}          /* 各日曆的語意說明：桌機看得到，手機不佔畫面 */
    .secSub{display:none;}             /* 分區標題的（括號說明）：手機只留重點，不再折行 */
    .mobFoldable:not(.open){display:none;}   /* 手機預設收合的工具列（點按展開） */
    body{padding:10px 10px calc(78px + env(safe-area-inset-bottom, 0px));}
    /* 🍎 iOS 鐵律：輸入控制項字級 <16px 會觸發聚焦自動放大（且不會縮回）——手機上一律 16px */
    input, textarea, select{font-size:16px !important;}
    input[type=checkbox]{font-size:inherit !important;}
    /* 🎯 象限：手機改單欄，卡片不再兩欄硬擠 */
    .quadGrid{grid-template-columns:1fr;}
    /* 底部固定導覽列（拇指區）：毛玻璃質感、橫向可捲、不換行 */
    .sideNav{position:fixed; left:0; right:0; bottom:0; top:auto; z-index:90; width:100%;
      flex-direction:row; flex-wrap:nowrap; overflow-x:auto; -webkit-overflow-scrolling:touch;
      gap:4px; padding:7px 8px calc(7px + env(safe-area-inset-bottom, 0px)); margin:0;
      background:var(--card);
      background:color-mix(in srgb, var(--card) 88%, transparent);
      -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
      border-top:1.5px solid var(--line);
      box-shadow:0 -4px 14px rgba(0,0,0,.10);}
    .sideNav::-webkit-scrollbar{display:none;}
    .navItem{flex:0 0 auto; white-space:nowrap; font-size:13.5px; padding:9px 13px;
      border:none; background:transparent; border-radius:12px;}
    .navItem.on{background:var(--accent); color:var(--on-accent,#fff);}
    .navDivider{display:none;}
    /* 貓咪列瘦身：貓縮小、常駐對話框移除（回饋改浮動泡泡、互動改點貓選單）；右側標題讓位給內容 */
    .catBox svg{width:60px; height:50px;}
    .catBar{gap:8px; margin-bottom:8px;}
    .catBar .bubble{display:none;}
    .headRight{display:none;}
    /* 內容留白收窄、工具列可橫捲 */
    .trkCard,.inputCard,.calCard{padding:12px 10px;}
    .toolRow{gap:6px;}
    .toolRow .filters{flex-wrap:nowrap; overflow-x:auto; -webkit-overflow-scrolling:touch; max-width:100%;}
    .toolRow .filters::-webkit-scrollbar{display:none;}
    .toolRow .filters button{white-space:nowrap; flex:0 0 auto;}
    #taskSearch{flex:1; width:auto !important; min-width:120px;}
    .viewToggle{margin-left:0;}
    /* 等寬表格（追蹤等）：改為可橫向捲動，不撐破版面 */
    .trkTable{display:block; overflow-x:auto; -webkit-overflow-scrolling:touch;}
    /* 📦 表格捲動時凍結第一欄（追蹤主表再多凍「名字」欄；開了編號欄的只凍第一欄） */
    .trkTable th:first-child, .trkTable td:first-child{position:sticky; left:0; z-index:2; background:var(--card);}
    .trkTable.trkMain:not(.hasNum) th:nth-child(2), .trkTable.trkMain:not(.hasNum) td:nth-child(2){
      position:sticky; left:38px; z-index:2; background:var(--card);
      max-width:118px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
    .trkTable tr.rSkip{opacity:1;}                      /* 半透明列會讓凍結欄透出底下字，改用淡色 */
    .trkTable tr.rSkip td{color:var(--faint);}
    /* 🗓️ 手機日曆＝週列表（任務日曆與總月曆共用）：一天一列、事項整行可讀 */
    .calGrid{display:flex; flex-direction:column; gap:5px;}
    .calGrid .wd{display:none;}
    .calCell.dim{display:none;}
    .calCell{min-height:0; display:grid; grid-template-columns:48px 1fr; column-gap:9px;
      align-items:start; padding:6px 9px; overflow:visible;}
    .calCell>*{grid-column:2;}
    .calCell .dnum{grid-column:1; grid-row:1; display:flex; flex-direction:column; align-items:center;
      font-size:14.5px; margin-bottom:0; padding-top:1px;}
    .calWd{display:block; font-size:10.5px; color:var(--muted2); line-height:1.4; font-weight:400;}
    .calPill{white-space:normal; line-height:1.45; font-size:13.5px; padding:3px 9px; margin-bottom:3px;}
    .calIcons{margin:1px 0 2px;}
    /* 有事的日子左緣一道主題色槓：捲動掃過去一眼看到哪天有事 */
    .calCell:not(.dim):is(:has(.calPill),:has(.calIcons)){border-left:4px solid var(--accent);}
    /* 🖥 桌機限定功能在手機隱藏：⠿ 拖曳排序（改用排序選單）、追蹤表拖曳把手、總月曆時間軸 */
    .task .dragHandle, .trkDragHd, .deskOnly{display:none !important;}
    /* 📒 便利貼手機一律全寬：窄卡在小螢幕又擠又難讀 */
    .stickyNote, .stickyNote.szM{width:100%;}
    /* 🌱 習慣新增表單手機直排：輸入全寬 → 圖示橫向滑動選 → ＋鈕全寬好按 */
    .habNewForm{flex-direction:column; align-items:stretch; gap:8px;}
    .habNewForm .miniInput{width:100% !important;}
    .habNewForm .habIconRow{flex-wrap:nowrap !important; overflow-x:auto; -webkit-overflow-scrolling:touch;
      padding-bottom:4px; max-width:100%;}
    .habNewForm .habIconRow::-webkit-scrollbar{display:none;}
    .habNewForm .habIconRow .qbtn{flex:0 0 auto; min-width:44px;}
    .habNewForm > .qbtn:last-child{width:100%; justify-content:center; min-height:44px; font-size:15px;}
    /* 主要動作鈕不再折行（「貼上便利貼📒」曾折成兩行） */
    .btnAdd{white-space:nowrap;}
    /* 表格欄字不再被壓成直排（寬度交給橫向捲動；追蹤/記帳/名單都適用） */
    .trkTable th, .trkTable td{white-space:nowrap;}
    /* 沒事的日子壓成細細一列快速掃過（舊瀏覽器不支援 :has 就維持普通列，無害） */
    .calCell:not(.today):not(.sel):not(:has(.calPill)):not(:has(.calIcons)){
      padding:2px 9px; opacity:.5; border-color:transparent; background:transparent;}
    .calCell:not(.today):not(.sel):not(:has(.calPill)):not(:has(.calIcons)) .dnum{
      flex-direction:row; gap:6px; font-size:12.5px; align-items:baseline;}
    /* 🗓️ 格狀月曆模式（手機檢視下拉選「格狀月曆」）：傳統一格一格，事項顯示成小色條，點格子看當日清單 */
    .calGrid.gridMode{display:grid; grid-template-columns:repeat(7,1fr); gap:3px;}
    .calGrid.gridMode .wd{display:block; font-size:11px;}
    .calGrid.gridMode .calCell{display:block; min-height:48px; padding:3px 4px; opacity:1;
      border:1px solid var(--line); background:var(--cell-bg);}
    .calGrid.gridMode .calCell.dim{display:block; opacity:.3;}
    .calGrid.gridMode .calCell.today{border-color:var(--accent); background:var(--accent-soft);}
    .calGrid.gridMode .calCell.sel{outline:2px solid var(--accent);}
    .calGrid.gridMode .dnum{display:block; font-size:11.5px; padding:0;}
    .calGrid.gridMode .calWd{display:none;}
    .calGrid.gridMode .calPill{display:block; height:6px; padding:0; margin:2px 0 0;
      border-radius:3px; overflow:hidden; color:transparent; font-size:1px; line-height:6px;}
    .calGrid.gridMode .calPill.more{display:none;}
    .calGrid.gridMode .calIcons{margin:0; line-height:1;}
    .calGrid.gridMode .calIcon{font-size:11px; margin:0;}
    /* 右下浮動「＋ 新增任務」（只在任務清單頁出現；展開後變 ✕＝收起） */
    body.mobFabOn #mobAddBtn{display:flex;}
    #mobAddBtn{position:fixed; right:14px; bottom:calc(86px + env(safe-area-inset-bottom, 0px));
      width:56px; height:56px; border-radius:50%; align-items:center; justify-content:center;
      background:var(--accent);
      background:linear-gradient(150deg, color-mix(in srgb, var(--accent) 82%, #fff 18%), var(--accent) 62%);
      color:var(--on-accent,#fff); font-size:27px; line-height:1;
      box-shadow:0 5px 16px color-mix(in srgb, var(--accent) 45%, rgba(0,0,0,.25));
      z-index:89; border:none; transition:transform .12s;}
    #mobAddBtn:active{transform:scale(.92);}
  }
</style>
</head>

    <main class="mainCol">

function rebuildCustomCatCSS(){
  let st=document.getElementById('customCatCSS');
  if (!st){ st=document.createElement('style'); st.id='customCatCSS'; document.head.appendChild(st); }
  const cellBg=getComputedStyle(document.documentElement).getPropertyValue('--cell-bg').trim()||'#ffffff';

  ['work','life'].forEach(sp=>(settings.cats[sp]||[]).forEach(c=>{
    if (c.color==='custom' && c.hex){
      css+='.catc-cx-'+c.id+'{background:'+c.hex+'26;color:'+ensureContrast(c.hex,cellBg,4.5)+';}';
      css+='.dotc-cx-'+c.id+'{background:'+c.hex+';}';
    }
  }));
  st.textContent=css;
}

function vocal(s){
  const m=MASCOTS[settings.mascot]||MASCOTS.orange;
  if (m.type==='dog') return s.replace(/呼嚕嚕+～?/g,'搖尾巴～').replace(/喵/g,'汪');

    .replace(/喵嗚|呼嚕嚕+～?/g,'')
    .replace(/[喵汪]+([～~！!。？?]?)/g,'$1')
    .replace(/～{2,}/g,'～').trim();
  return s;
}

/* ♿ 對比度保險（WCAG AA）：不夠就往「拉開對比」的方向逐步調整 */
function _hexRGB(h){ h=h.replace('#',''); if(h.length===3) h=h.split('').map(c=>c+c).join(''); return [0,2,4].map(i=>parseInt(h.substr(i,2),16)); }
function _rgbHex(rgb){ return '#'+rgb.map(c=>Math.round(c).toString(16).padStart(2,'0')).join(''); }
function _lum(rgb){ const [r,g,b]=rgb.map(c=>{ c/=255; return c<=0.03928 ? c/12.92 : Math.pow((c+0.055)/1.055,2.4); }); return .2126*r+.7152*g+.0722*b; }
function contrastRatio(a,b){ const l1=_lum(_hexRGB(a)), l2=_lum(_hexRGB(b)); return (Math.max(l1,l2)+.05)/(Math.min(l1,l2)+.05); }
function ensureContrast(fg,bg,target){
  if (!/^#[0-9a-fA-F]{3,6}$/.test(fg||'') || !/^#[0-9a-fA-F]{3,6}$/.test(bg||'')) return fg;
  let rgb=_hexRGB(fg);
  const darker=_lum(_hexRGB(bg))>=0.4;   // 亮底→把前景加深；暗底→加亮
  let guard=0;
  while (contrastRatio(_rgbHex(rgb),bg)<target && guard++<48){
    rgb=rgb.map(c=>Math.min(255,Math.max(0, c+(darker?-6:6))));
  }
  return _rgbHex(rgb);
}
function applyMascot(){
  const box=document.getElementById('catBox');
  const svg=box.querySelector('svg');
  if (svg) svg.remove();
  const m=MASCOTS[settings.mascot]||MASCOTS.orange;
  box.insertAdjacentHTML('afterbegin', mascotSVG(settings.mascot));
  // 布景整套跟著寵物走：亮/暗基底＋該寵物的主題覆蓋
  const merged={...(m.dark?DARK_TOKENS:LIGHT_TOKENS), ...(m.theme||{})};
  // ♿ 文字色對卡片底至少 4.5:1；深色模式有光暈感，門檻再拉高到 5.0
  const cardBg=merged['cell-bg']||merged.card||merged.bg;
  const txtTarget = m.dark ? 5.0 : 4.8;   // 淺色 4.8：cell-bg 之外還會落在較深的 bg/gray-bg 上
  merged.sub   =ensureContrast(merged.sub,   cardBg, txtTarget);
  merged.muted =ensureContrast(merged.muted, cardBg, txtTarget);
  merged.muted2=ensureContrast(merged.muted2,cardBg, txtTarget);
  merged.faint =ensureContrast(merged.faint, cardBg, 3.0);   // 裝飾/弱化字至少 3:1
  // 彩色標籤：文字色對自己的底色（chip/甘特條/日曆 pill 全吃這組）
  ['red','orange','yellow','gray','green','blue','purple','teal','pink'].forEach(c=>{
    if (merged[c] && merged[c+'-bg']) merged[c]=ensureContrast(merged[c], merged[c+'-bg'], 4.5);
  });
  if (merged.accent) merged.accent=ensureContrast(merged.accent, merged['accent-soft']||'#ffffff', 4.5);   // 空間鈕等 accent 文字常落在 accent-soft 底上
  // accent/red/green 當背景時的文字色：深色主題這些色會被調亮，白字會看不清 → 自動改深字
  merged['on-accent'] = contrastRatio('#ffffff', merged.accent) >= 4.5 ? '#ffffff' : '#26201b';
  merged['on-red']    = contrastRatio('#ffffff', merged.red)    >= 4.5 ? '#ffffff' : '#26201b';
  merged['on-green']  = contrastRatio('#ffffff', merged.green)  >= 4.5 ? '#ffffff' : '#26201b';
  merged.imp=ensureContrast(merged.imp, merged['yellow-bg']||cardBg, 4.5);   // ⭐重要 標籤的金色字
  const root=document.documentElement.style;
  Object.entries(merged).forEach(([k,v])=>root.setProperty('--'+k, v));
  // 📱 瀏覽器工具列/狀態列顏色跟著吉祥物主題走（PWA 加入主畫面後尤其明顯）
  const tc=document.querySelector('meta[name="theme-color"]');
  if (tc && merged.accent) tc.setAttribute('content', merged.accent);
  if (settings && settings.cats) rebuildCustomCatCSS();   // 自選顏色跟著主題重算對比
  // ◽ 極簡模式（黑貓/白貓）＝整體收斂：標題去爪印、副標改中性、導覽去 emoji、泡泡變安靜（給不愛花俏的人）
  const isPlain=!!m.plain;
  const h1=document.querySelector('.headRight h1');
  const tg=document.querySelector('.headRight .tagline');
  if (h1) h1.textContent = isPlain ? 'Catlendar' : '🐾 Catlendar';
  if (tg) tg.textContent = isPlain ? '離線個人工作站' : '可憐上班族的貓貓日曆';
  document.body.classList.toggle('plainUI', isPlain);
  document.querySelectorAll('#sideNav .navItem').forEach(b=>{
    if (b.id==='spaceBtn'||b.id==='navMore') return;   // 這兩顆的字樣由 render() 動態設定
    if (!b.dataset.orig) b.dataset.orig=b.textContent;
    b.textContent = isPlain ? b.dataset.orig.replace(/^\S+\s+/,'') : b.dataset.orig;
  });
  applyFont();
}

function whoCandidates(q){
  const pbNames=(typeof pbook!=='undefined')?pbook.map(p=>p.name):[];
  const all=[...new Set([...getContacts(), ...pbNames])].filter(Boolean);
  if (!q) return all.slice(0,5);                       // 沒打字＝最近學到的前 5 個
  const starts=all.filter(n=>n.startsWith(q)&&n!==q);  // 開頭吻合排前面
  const incl  =all.filter(n=>!n.startsWith(q)&&n.includes(q));
  return [...starts,...incl].slice(0,5);
}
function attachWhoSuggest(input, onPick){
  let items=[], hi=-1;
  const close=()=>{ whoSuggest.style.display='none'; hi=-1; };
  const renderList=()=>{
    items=whoCandidates(input.value.trim());
    if (!items.length){ close(); return; }
    whoSuggest.innerHTML='';
    items.forEach((n,i)=>{
      const d=document.createElement('div');
      d.className='whoOpt'+(i===hi?' hi':'');
      d.textContent=n;
      d.onmousedown=e=>{ e.preventDefault(); input.value=n; onPick(n); close(); };
      whoSuggest.appendChild(d);
    });
    const r=input.getBoundingClientRect();
    whoSuggest.style.display='block';
    whoSuggest.style.left=Math.max(8,Math.min(window.innerWidth-190,r.left+window.scrollX))+'px';
    whoSuggest.style.top=(r.bottom+window.scrollY+4)+'px';
  };
  input.addEventListener('focus',renderList);
  input.addEventListener('input',()=>{ hi=-1; renderList(); });
  input.addEventListener('blur',()=>setTimeout(close,150));
  input.addEventListener('keydown',e=>{
    if (whoSuggest.style.display==='none') return;
    if (e.key==='ArrowDown'){ e.preventDefault(); hi=Math.min(hi+1,items.length-1); renderList(); }
    else if (e.key==='ArrowUp'){ e.preventDefault(); hi=Math.max(hi-1,-1); renderList(); }
    else if (e.key==='Enter' && hi>=0){ e.preventDefault(); input.value=items[hi]; onPick(items[hi]); close(); }
    else if (e.key==='Escape') close();
  });
}
function detectWho(text){
  const list=getContacts().slice().sort((a,b)=>b.length-a.length);
  for (const name of list){ if (name && text.includes(name)) return name; }
  return null;
}

/* ───────── 標題擷取（貼信件用） ───────── */
function extractTitle(text){
  const m = text.match(/(?:主旨|標題|Subject|SUBJECT|subject)\s*[:：]\s*(.+)/);
  let t = m ? m[1].trim() : '';
  if (!t) t = (text.split(/\n/).map(s=>s.trim()).find(s=>s) || text.trim());
  t = t.replace(/^(Re|RE|Fwd|FWD|Fw|轉寄|回覆)[:：]\s*/g,'').trim();
  if (t.length > 42) t = t.slice(0,42)+'…';
  return t;
}
function needsDetail(text, title){
  const t = text.trim();
  return /\n/.test(t) || t.length > 46;
}
/* 從括號偵測子項目：例如「追蹤收據回覆信(高科 臺南 東華 中興)」→ 4個子項目
   防誤判：含數字/日期/時間字樣的括號（如「(下午3點 會議室)」「(7/25前)」）不當名單 */
const SUB_BAD_RE=/\d|[點:：]|上午|下午|早上|晚上|中午|今天|明天|後天|下週|下周|本週|本周|月底|月初|之前|以前|以內|之後|小時|分鐘|會議室/;
function detectSubs(text){
  // 「[]事項」＝空核選框接文字：[]小橘 []小黑（[]與【】都行；Markdown 的「- [ ]」中間有空格，不在此列）
  const eb=[...text.matchAll(/[\[【][\]】]\s*([^\[【\n]+)/g)]
    .flatMap(m=>m[1].split(/[、,，\/\s]+/)).map(s=>s.trim())
    .filter(s=>s.length>=1&&s.length<=20&&!/^[xX]$/.test(s));
  if (eb.length) return [...new Set(eb)];
  // ［方括號］＝使用者明確要建核選框：照單全收（1 項也行、1 個字也行，不做防誤判過濾）
  // ——圓括號自動偵測條件太嚴常失敗（≥2 項、每項≥2 字），方括號是可靠的手動觸發
  const b = text.match(/[\[【]([^\]】]{1,80})[\]】]/);
  if (b){
    const toks=b[1].split(/[、,，\/\s]+/).map(s=>s.trim())
      .filter(s=>s.length>=1&&s.length<=20&&!/^[xX]$/.test(s));   // 排掉 Markdown 的 [x]
    if (toks.length) return toks;
  }
  const m = text.match(/[（(]([^）)]{2,60})[）)]/);
  if (m){
    const toks = m[1].split(/[、,，\/\s]+/).map(s=>s.trim()).filter(s=>s.length>=2&&s.length<=10);
    if (toks.length>=2 && toks.every(t=>!SUB_BAD_RE.test(t))) return toks;
  }
  return [];
}

/* ───────── 中文日期解析 ───────── */
function parseDue(text){
  const now = new Date(); now.setHours(0,0,0,0);
  const mk = d => { const x=new Date(d); x.setHours(0,0,0,0); return x; };
  let m;

  if (/大後天/.test(text)) return addDays(now,3);
  if (/後天/.test(text))   return addDays(now,2);
  if (/明天|明日/.test(text)) return addDays(now,1);
  if (/今天|今日/.test(text)) return now;

  m = text.match(/(\d{1,2})[\/月](\d{1,2})日?/);
  if (m){
    const mo=+m[1], da=+m[2];
    if (mo>=1&&mo<=12&&da>=1&&da<=31){
      let d = mk(new Date(now.getFullYear(), mo-1, da));
      if (d < now) d = mk(new Date(now.getFullYear()+1, mo-1, da));
      return d;
    }
  }
  m = text.match(/(下{0,2})(?:週|周|星期|禮拜)([一二三四五六日天])/);
  if (m){
    const map={'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'日':0,'天':0};
    const target=map[m[2]];
    if (m[1]){
      const monday=addDays(now,-((now.getDay()+6)%7));
      const offset=(target+6)%7;
      return addDays(monday, m[1].length*7+offset);
    }
    return addDays(now,(target-now.getDay()+7)%7);
  }
  if (/月底/.test(text)){
    const nextMonth = /下個?月底/.test(text) ? 2 : 1;
    return mk(new Date(now.getFullYear(), now.getMonth()+nextMonth, 0));
  }
  m = text.match(/(\d{1,2})[天日]內/);
  if (m) return addDays(now,+m[1]);
  if (/這週|本週|這周|本周/.test(text)) return endOfWeek(now);
  return null;
}
/* 期間解析：「8/1到8/15」「7/1~7/31」→ {start,end} */
function parsePeriod(text){
  const m=text.match(/(\d{1,2})[\/月](\d{1,2})日?\s*[到至~～\-—]\s*(\d{1,2})[\/月](\d{1,2})日?/);
  if (!m) return null;
  const now=new Date(); now.setHours(0,0,0,0);
  const mk=(mo,da)=>{
    let d=new Date(now.getFullYear(), mo-1, da); d.setHours(0,0,0,0);
    return d;
  };
  let s=mk(+m[1],+m[2]), e=mk(+m[3],+m[4]);
  if (e<now){ s=new Date(s.getFullYear()+1,s.getMonth(),s.getDate()); e=new Date(e.getFullYear()+1,e.getMonth(),e.getDate()); }
  if (s>e) return null;
  return {start:s, end:e};
}
/* 時間解析：「早上10點」「14:00」「下午3點半→15:30 不支援半，取整點」 */
function parseTime(text){
  const m=text.match(/(上午|早上|中午|下午|晚上)?\s*(\d{1,2})[:：點](\d{2})?/);
  if (!m) return null;
  let h=+m[2];
  if (h>23) return null;
  const mm=m[3]!==undefined ? m[3] : '00';
  if (+mm>59) return null;
  const p=m[1]||'';
  if ((p==='下午'||p==='晚上') && h<12) h+=12;
  if (p==='中午' && h===12) h=12;
  if (!p && !m[3] && !/點/.test(m[0])) return null;   // 純數字如 7:xx 才算，避免誤抓
  return String(h).padStart(2,'0')+':'+mm;
}
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); x.setHours(0,0,0,0); return x; }
function endOfWeek(d){ const n=(7-d.getDay())%7; return addDays(d,n); }
function fmtDate(d){ return (d.getMonth()+1)+'/'+d.getDate(); }
function toISO(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fromISO(s){ if(!s) return null; const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function daysUntil(d){
  const now=new Date(); now.setHours(0,0,0,0);
  return Math.round((d-now)/86400000);
}
const WD=['日','一','二','三','四','五','六'];
/* 🔁 自訂例行規則（設定頁可增刪，出現在「例行事項嗎？」橫幅） */
function ruleLabel(r){
  if (r.t==='d') return '每'+r.n+'天';
  if (r.t==='w') return '每'+r.n+'週';
  if (r.t==='m') return '每'+r.n+'個月同日';
  if (r.t==='mw') return '每月'+(r.k==='last'?'最後':'第'+r.k)+'個週'+'日一二三四五六'[r.w];
  return '?';
}
function ruleNext(r, base){
  if (r.t==='d') return addDays(base, +r.n);
  if (r.t==='w') return addDays(base, 7*+r.n);
  if (r.t==='m'){ const x=new Date(base.getFullYear(), base.getMonth()+ +r.n, base.getDate()); x.setHours(0,0,0,0); return x; }
  if (r.t==='mw'){
    const y=base.getFullYear(), nm=base.getMonth()+1;   // 下個月
    if (r.k==='last'){
      let x=new Date(y, nm+1, 0); x.setHours(0,0,0,0);
      while (x.getDay()!==+r.w) x=addDays(x,-1);
      return x;
    }
    let x=new Date(y, nm, 1); x.setHours(0,0,0,0);
    while (x.getDay()!==+r.w) x=addDays(x,1);
    return addDays(x, 7*(+r.k-1));
  }
  return addDays(base,1);
}
/* 期間任務：從 start 到 due 每天呼叫一次 cb(iso, 是否最後一天) */
function eachPeriodDay(t, cb){
  let d=fromISO(t.start); const end=fromISO(t.due);
  if (!d||!end||d>end) return;
  let i=0;
  while (d<=end && i<180){ cb(toISO(d), toISO(d)===t.due); d=addDays(d,1); i++; }
}

function classify(text){
  let cat=fallbackCat();   // 專案分類不猜，預設歸「其他」，由使用者點 📂 自選
  let type='🛠 其他';
  for (const r of TYPE_RULES){ if (r.re.test(text)){ type=r.type; break; } }
  const period = parsePeriod(text);
  const due = period ? period.end : parseDue(text);
  const start = period ? period.start : null;
  const time = parseTime(text);
  const tags = URGENT_RE.test(text) ? ['急'] : [];
  const who = detectWho(text);
  return {cat, type, due, start, time, tags, who};
}

/* ───────── 急切性 ───────── */
function urgency(t){
  const due = fromISO(t.due);
  const n = due ? daysUntil(due) : null;
  if (n!==null){
    if (n<0)  return {level:'red', label:'🔴 逾期'+(-n)+'天'};
    if (n===0)return {level:'red', label:'🔴 今天到期'};
    if (n===1)return {level:'red', label:'🔴 明天到期'};
  }
  if (t.tags && t.tags.includes('急')) return {level:'red', label:'🔥 急件'};
  if (n===null){
    if (t.tags && t.tags.includes('不急')) return {level:'gray', label:'🐢 慢慢來'};
    return {level:'gray', label:'⚪ 無期限'};
  }
  if (n<=(settings.orangeDays||7)) return {level:'orange', label:'🟠 剩'+n+'天 ('+fmtDate(due)+')'};
  return {level:'yellow', label:'🟡 '+fmtDate(due)+' (剩'+n+'天)'};
}

    if (t.who===undefined) t.who = null;

    if (t.archived===undefined) t.archived=false;
  });
}

/* ───────── 共用：期限快選列 ───────── */
function dueOptions(){
  const now=new Date(); now.setHours(0,0,0,0);
  return [
    ['今天',   toISO(now)],
    ['明天',   toISO(addDays(now,1))],
    ['3天內',  toISO(addDays(now,3))],
    ['本週',   toISO(endOfWeek(now))],
    ['下週',   toISO(addDays(endOfWeek(now),7))],
    ['月底',   toISO(new Date(now.getFullYear(), now.getMonth()+1, 0))],
    ['無期限', null],
  ];
}
function buildDuePicker(current, onPick){
  const frag=document.createDocumentFragment();
  dueOptions().forEach(([label,iso])=>{
    const b=document.createElement('button');
    b.className='qbtn'+(current===iso?' on':'');
    b.textContent=label;
    b.onclick=()=>onPick(iso);
    frag.appendChild(b);
  });
  const pick=document.createElement('span');
  pick.className='qbtn';
  const di=document.createElement('input');
  di.type='date'; di.value=current||'';
  di.onchange=()=>onPick(di.value||null);
  pick.append('📅',di);
  frag.appendChild(pick);
  return frag;
}

      else {

  rp.title='例行任務：完成後自動排下一次（點擊循環：不重複 → 每週 → 每月）';
  rp.onclick=()=>{ draft.repeat = !draft.repeat ? 'weekly' : draft.repeat==='weekly' ? 'monthly' : null; renderPreview(); };
  quickDates.appendChild(rp);

function completeTask(t){
  t.status='done'; t.doneAt=toISO(new Date());
  if (t.repeat){
    const base = t.due ? fromISO(t.due) : new Date();
    const nd = t.repeat==='weekly' ? addDays(base,7)
             : (()=>{ const x=new Date(base.getFullYear(), base.getMonth()+1, base.getDate()); x.setHours(0,0,0,0); return x; })();
    tasks.unshift({...t, id:uid(), status:'todo', doneAt:null, followUp:null,
      due:toISO(nd), start:null, created:toISO(new Date()),
      tags:[...(t.tags||[])],
      subs:(t.subs||[]).map(s=>({name:s.name, done:false, doneAt:null}))});
    catSay('🔁 例行任務！下一次已排在 '+fmtDate(nd)+' 喵～',3000,'happy');
  } else {
    if (t.due) lastDone=t;
    catSay(randomOf(persona().praise),2200,'happy');
  }
  save();
}

function renderList(){
  let visible = spaceTasks().filter(t=>filterCat==='全部'||t.cat===filterCat);
  if (doerFilter==='me')
    visible=visible.filter(t=> t.status==='done' || (t.status==='todo' && t.type!=='👀 追蹤'));
  else if (doerFilter==='them')
    visible=visible.filter(t=> t.status==='waiting' || (t.status==='todo' && t.type==='👀 追蹤'));
  const q=taskQ.trim();
  if (q) visible=visible.filter(t=>((t.title||'')+' '+(t.text||'')+' '+(t.who||'')).includes(q));
  const active  = visible.filter(t=>t.status==='todo');
  const waiting = visible.filter(t=>t.status==='waiting');
  const done    = visible.filter(t=>t.status==='done');

  const impFirst=(a,b)=>{
    // ⠿ 拖曳過的照手動順序排最優先；沒拖過的（沒有 ord）走下面的自動規則
    const oa=(a.ord!=null?a.ord:1e15), ob=(b.ord!=null?b.ord:1e15);
    if (oa!==ob) return oa-ob;
    const ia=a.tags.includes('重要')?0:1, ib=b.tags.includes('重要')?0:1;
    if (ia!==ib) return ia-ib;
    const da=fromISO(a.due), db=fromISO(b.due);
    if (da&&db){
      const d=da-db; if (d) return d;
      const ta=a.time||'99:99', tb=b.time||'99:99';   // 同日：有時間的排前、時間早的在前
      if (ta!==tb) return ta<tb?-1:1;
      return 0;
    }
    if (da) return -1; if (db) return 1;
    return 0;
  };
  const bucket = t => {
    const due=fromISO(t.due);
    const n = due?daysUntil(due):null;
    if (n!==null && n<=1) return 0;
    if (t.tags.includes('急')) return 0;
    if (t.tags.includes('不急')) return 2;
    if (n!==null && n<=(settings.orangeDays||7)) return 1;
    return 2;
  };
  const fire = active.filter(t=>bucket(t)===0).sort(impFirst);
  const week = active.filter(t=>bucket(t)===1).sort(impFirst);
  const later= active.filter(t=>bucket(t)===2).sort(impFirst);
  waiting.sort((a,b)=>{
    const oa=(a.ord!=null?a.ord:1e15), ob=(b.ord!=null?b.ord:1e15);   // 拖曳過的照手動順序
    if (oa!==ob) return oa-ob;
    const fa=fromISO(a.followUp), fb=fromISO(b.followUp);
    if (fa&&fb) return fa-fb; if (fa) return -1; if (fb) return 1; return 0;
  });
  done.sort((a,b)=> (b.doneAt||'').localeCompare(a.doneAt||''));

  const secs=document.getElementById('sections');
  secs.innerHTML='';
  if (taskQ.trim()){
    const _hit=spaceTasks().filter(t=>((t.title||'')+' '+(t.text||'')+' '+(t.who||'')).includes(taskQ.trim())).length;
    if (!_hit){
      const se=document.createElement('div'); se.className='searchEmpty';
      const tx=document.createElement('span'); tx.textContent='🔍 正在搜尋「'+taskQ.trim().slice(0,30)+'」，沒有符合的任務——任務都還在，只是被搜尋條件藏起來了。';
      const cb=document.createElement('button'); cb.className='qbtn'; cb.textContent='✕ 清除搜尋';
      cb.onclick=()=>{ taskQ=''; const si=document.getElementById('taskSearch'); if (si) si.value=''; render(); };
      se.appendChild(tx); se.appendChild(cb); secs.appendChild(se);
    }
  }
  // 剛完成含期限的任務 → 問是不是例行事項（輕量重複任務）
  if (lastDone){
    const src=lastDone;
    const b=document.createElement('div'); b.className='trkCard';
    b.style.cssText+='border-color:var(--green);';
    const h=document.createElement('div');
    h.style.cssText='font-size:13.5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;';
    const lbl=document.createElement('span');
    lbl.innerHTML='✅ 已完成「<b>'+esc(src.title.slice(0,20))+'</b>」— 這是例行事項嗎？下次：';
    h.appendChild(lbl);
    const mkNext=(label,calc)=>{
      const btn=document.createElement('button'); btn.className='qbtn'; btn.textContent=label;
      btn.onclick=()=>{
        const base=fromISO(src.due)||new Date();
        const nd=calc(base);
        tasks.unshift({...src, id:uid(), status:'todo', doneAt:null, followUp:null,
          due:toISO(nd), start:null, created:toISO(new Date()),
          tags:[...(src.tags||[])],
          subs:(src.subs||[]).map(s=>({name:s.name, done:false, doneAt:null}))});
        lastDone=null; save(); render();
        catSay('下一次排好了！'+fmtDate(nd)+' 見喵～',2400,'happy');
      };
      h.appendChild(btn);
    };
    mkNext('明天', d=>addDays(d,1));
    mkNext('下週同日', d=>addDays(d,7));
    mkNext('下月同日', d=>{ const x=new Date(d.getFullYear(), d.getMonth()+1, d.getDate()); x.setHours(0,0,0,0); return x; });
    (settings.repeatRules||[]).forEach(r=>mkNext(ruleLabel(r), b=>ruleNext(r,b)));
    const no=document.createElement('button'); no.className='qbtn'; no.textContent='不是，謝了';
    no.onclick=()=>{ lastDone=null; render(); };
    h.appendChild(no);
    b.appendChild(h);
    secs.appendChild(b);
  }
  // 🔀 排序下拉選單：智慧分區（預設）＋六種單一清單排序
  if (settings.taskSort==='time') settings.taskSort='dueAsc';   // v45 舊值遷移
  const sortMode=settings.taskSort||'smart';
  const SORTS={
    smart:  {label:'🧠 智慧分區（急件優先）', tip:'分成 最急／一週內／慢慢來 三區；⭐重要與 ⠿ 拖曳順序優先'},
    dueAsc: {label:'⏰ 期限：近 → 遠',       tip:'照期限日期＋時間排，快到期的在前；沒期限的在最後'},
    dueDesc:{label:'⏰ 期限：遠 → 近',       tip:'最晚到期的在前；沒期限的在最前'},
    urgent: {label:'🔥 緊急 → 不急',         tip:'照 紅→橘→黃→灰 的急切度排，同級再比期限'},
    calm:   {label:'🐢 不急 → 緊急',         tip:'最不急的在前，想先清輕鬆的事就用這個'},
    newest: {label:'🆕 加入：新 → 舊',       tip:'最近加入的任務在前'},
    oldest: {label:'📦 加入：舊 → 新',       tip:'放最久的任務在前，適合清陳年舊案'},
  };
  const cmpDue=(a,b)=>{
    const da=fromISO(a.due), db=fromISO(b.due);
    if (da&&db){
      const d=da-db; if (d) return d;
      const ta=a.time||'99:99', tb=b.time||'99:99';   // 同日：有時間的排前、時間早的在前
      if (ta!==tb) return ta<tb?-1:1;
      return 0;
    }
    if (da) return -1; if (db) return 1; return 0;
  };
  const cmpNew=(a,b)=> (b.created||'').localeCompare(a.created||'') || (b.id||'').localeCompare(a.id||'');   // created 只到「日」，同日再用 id（開頭是時間戳）比
  const RANKV={red:0,orange:1,yellow:2,gray:3};
  const cmpUrg=(a,b)=> ((RANKV[urgency(a).level]??9)-(RANKV[urgency(b).level]??9)) || cmpDue(a,b);
  const FLAT_SORTS={
    dueAsc: {title:'⏰ 全部待辦（期限近 → 遠，沒期限的在最後）', cmp:cmpDue},
    dueDesc:{title:'⏰ 全部待辦（期限遠 → 近）',                 cmp:(a,b)=>cmpDue(b,a)},
    urgent: {title:'🔥 全部待辦（緊急 → 不急）',                 cmp:cmpUrg},
    calm:   {title:'🐢 全部待辦（不急 → 緊急）',                 cmp:(a,b)=>cmpUrg(b,a)},
    newest: {title:'🆕 全部待辦（新 → 舊）',                     cmp:cmpNew},
    oldest: {title:'📦 全部待辦（舊 → 新）',                     cmp:(a,b)=>cmpNew(b,a)},
  };
  const srow=document.createElement('div');
  srow.style.cssText='display:flex;gap:6px;align-items:center;margin:2px 0 10px;font-size:12.5px;color:var(--sub);flex-wrap:wrap;';
  const slb=document.createElement('span'); slb.textContent='排序：'; srow.appendChild(slb);
  const sSel=document.createElement('select'); sSel.className='miniSelect'; sSel.id='taskSortSel';
  Object.entries(SORTS).forEach(([k,s])=>{
    const o=document.createElement('option'); o.value=k; o.textContent=s.label; o.title=s.tip;
    if (sortMode===k) o.selected=true;
    sSel.appendChild(o);
  });
  sSel.title=(SORTS[sortMode]||SORTS.smart).tip;
  sSel.onchange=()=>{ settings.taskSort=sSel.value; saveSettings(); render(); };
  srow.appendChild(sSel);
  if (sortMode!=='smart'){
    const hint=document.createElement('span'); hint.style.cssText='color:var(--muted2);';
    hint.className='mobHide';   // 手機沒有拖曳功能，這句只會造成雜訊折行
    hint.textContent='（此排序下 ⠿ 拖曳不生效）';
    srow.appendChild(hint);
  }
  secs.appendChild(srow);
  const flat=FLAT_SORTS[sortMode];
  if (flat){
    secs.appendChild(section(flat.title, [...active].sort(flat.cmp), '沒有排隊中的任務喵🐾'));
  } else {
  secs.appendChild(section('🔥 最急（逾期／今明到期）', fire, '目前沒有急件，呼嚕嚕～'));
  secs.appendChild(section('📅 一週內', week, '本週暫無到期任務喵'));
  secs.appendChild(section('🐢 之後慢慢來（無期限）', later, '沒有排隊中的任務喵🐾'));
  }
  secs.appendChild(section('⏳ 等對方回覆（到追蹤日會變紅提醒你催）', waiting, '空的喵。寄出信之後在卡片上按「⏳ 等回覆」，任務就會移來這裡幫你排催辦', 'waitSec'));

  const det=document.createElement('details');
  det.className='doneSection';
  const sum=document.createElement('summary');
  sum.textContent='✅ 呼嚕收工 ('+done.length+')　';
  if (done.length){
    const ab=document.createElement('button'); ab.className='qbtn';
    ab.textContent='🗄 全部封存';
    ab.title='把已完成的任務全部收進封存資料夾（依專案分類）';
    ab.onclick=e=>{
      e.preventDefault(); e.stopPropagation();
      done.forEach(t=>t.archived=true);
      save(); render();
      catSay('已完成的 '+done.length+' 件都收進封存資料夾了，清爽喵！',2600,'happy');
    };
    sum.appendChild(ab);
  }
  det.appendChild(sum);
  done.slice(0,30).forEach(t=>det.appendChild(taskCard(t)));
  secs.appendChild(det);
}

function section(title, list, emptyMsg, cls){
  const d=document.createElement('div');
  d.className='section'+(cls?' '+cls:'');
  // 收合邏輯：手動動過＝照你的意思記憶；沒動過＝自動（空的收合、有內容展開）
  const manual=settings.secFoldM[title];
  const folded = manual!==undefined ? manual==='fold' : list.length===0;
  const h=document.createElement('h2');
  h.className='foldHead';
  // 標題的（補充說明）降成小字：掃視時只看到重點，說明還在但不搶戲
  const _br=title.indexOf('（');
  const _main=_br>-1?title.slice(0,_br):title;
  const _sub=_br>-1?title.slice(_br):'';
  h.innerHTML=(folded?'▸ ':'▾ ')+esc(_main)+' <span class="count">'+list.length+'</span>'
    +(_sub?' <span class="secSub">'+esc(_sub)+'</span>':'');
  h.title=folded?'點擊展開':'點擊收合';
  h.onclick=()=>{
    settings.secFoldM[title]= folded?'open':'fold';
    saveSettings(); render();
  };
  d.appendChild(h);
  if (folded) return d;   // 收合＝只留標題和數量
  if (!list.length){
    const e=document.createElement('div'); e.className='empty'; e.textContent=emptyMsg;
    d.appendChild(e);
  } else {
    const g=document.createElement('div'); g.className='secGrid';
    list.forEach(t=>g.appendChild(taskCard(t)));
    d.appendChild(g);
  }
  return d;
}
