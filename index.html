/* 💬 有註解引用到的文字，在卡片上用黃色螢光標起來（像 Word 一眼對得上） */
function cmtQuotes(t){
  const qs=[];
  (t.comments||[]).forEach(cm=>{
    const m=(cm.text||'').match(/「([^」]{2,60})」/);
    if (m) qs.push(m[1]);
  });
  return [...new Set(qs)];
}
function markQuotes(el, text, quotes){
  let html=esc(text);
  quotes.forEach(q=>{
    const eq=esc(q);
    const pat=eq.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    html=html.replace(new RegExp(pat,'g'), '<mark class="cmtMark">'+eq+'</mark>');
  });
  el.innerHTML=html;
}
const openActions=new Set();   // 任務卡「⋯ 更多動作」展開狀態
const openCatPick=new Set();   // 任務卡「📂 專案選單」展開狀態
const openComments=new Set();  // 任務卡「💬 註解」展開狀態
const openChips=new Set();     // 任務卡「+N 更多標籤」展開狀態
let commentDel=null, commentDelTimer=null, commentDraft={};   // 註解刪除確認＋輸入草稿
let subAddDraft={};            // ☑ 清單「＋加一項」的輸入草稿（keyed by taskId）
let editingSubKey=null;        // 正在改名的子項目（taskId:index）

// ⠿ 任務卡拖曳排序：在同一區塊內把卡拖到另一張卡的上/下，放開即重排。
// 順序存進 t.ord（拖過的任務照手動順序；沒拖過的照原本急切度規則排在後面）。
let taskDrag=null;
function startTaskDrag(e, t, card){
  const grid=card.closest('.secGrid');
  if (!grid) return;                       // 日曆彈窗等場景沒有區塊格線，不啟用拖曳
  e.preventDefault();
  taskDrag={t, card, grid, target:null, after:false};
  card.classList.add('dragging');
  const clearMarks=()=>grid.querySelectorAll('.dropBefore,.dropAfter')
    .forEach(el=>el.classList.remove('dropBefore','dropAfter'));
  const move=ev=>{
    if (!taskDrag) return;
    const el=document.elementFromPoint(ev.clientX, ev.clientY);
    const over=el && el.closest('.task[data-tid]');
    clearMarks();
    if (!over || over===card || over.parentElement!==grid){ taskDrag.target=null; return; }
    const r=over.getBoundingClientRect();
    taskDrag.after = ev.clientY > r.top + r.height/2;
    taskDrag.target=over;
    over.classList.add(taskDrag.after?'dropAfter':'dropBefore');
  };
  const up=()=>{
    window.removeEventListener('pointermove',move);
    window.removeEventListener('pointerup',up);
    card.classList.remove('dragging');
    const st=taskDrag; taskDrag=null;
    clearMarks();
    if (!st || !st.target) return;
    const ids=[...st.grid.querySelectorAll(':scope > .task')].map(el=>el.dataset.tid);
    const from=ids.indexOf(String(st.t.id));
    if (from>-1) ids.splice(from,1);
    let at=ids.indexOf(st.target.dataset.tid);
    if (at<0) return;
    if (st.after) at++;
    ids.splice(at,0,String(st.t.id));
    ids.forEach((id,i)=>{ const tk=tasks.find(x=>String(x.id)===id); if (tk) tk.ord=(i+1)*10; });
    save(); render();
    catSay('順序記住了喵！這一區之後就照你排的順序顯示',2600,'happy');
  };
  window.addEventListener('pointermove',move);
  window.addEventListener('pointerup',up);
}
function taskCard(t){
  const card=document.createElement('div');
  card.className='task';
  card.dataset.tid=t.id;   // 反黑加註解要靠它找回是哪張卡
  if (justAddedId && t.id===justAddedId){ card.classList.add('justAdded'); setTimeout(()=>{ if (justAddedId===t.id) justAddedId=null; },1900); }
  // 📱 手勢：待辦卡往右滑＝完成（跟手位移、過閾值亮綠框、放手觸發）。
  // 防誤觸：輸入框/子清單內不啟動、正在反黑選字不啟動、垂直捲動不啟動。桌機無 touch 天然不生效
  if (t.status==='todo' && 'ontouchstart' in window){
    let sx=0, sy=0, dx=0, dyA=0, sw=false;
    card.addEventListener('touchstart', e=>{
      if (e.touches.length!==1 || e.target.closest('input,textarea,select,button,.subList,.titleEdit,.trkNote')){ sw=false; return; }
      sx=e.touches[0].clientX; sy=e.touches[0].clientY; dx=0; dyA=0; sw=true;
    }, {passive:true});
    card.addEventListener('touchmove', e=>{
      if (!sw) return;
      const sel=window.getSelection();
      if (sel && !sel.isCollapsed){ sw=false; card.style.transform=''; card.style.outline=''; return; }
      dx=e.touches[0].clientX-sx; dyA=Math.abs(e.touches[0].clientY-sy);
      if (dyA>36){ sw=false; card.style.transform=''; card.style.outline=''; return; }
      if (dx>14){
        card.style.transition='none';
        card.style.transform='translateX('+Math.min(dx-14,96)+'px)';
        card.style.outline = dx>84 ? '2.5px solid var(--green)' : '';
      }
    }, {passive:true});
    card.addEventListener('touchend', ()=>{
      if (!sw) return; sw=false;
      const hit = dx>84 && dyA<=36;
      card.style.transition='transform .16s'; card.style.transform=''; card.style.outline='';
      if (hit){ completeTask(t); render(); }
    }, {passive:true});
  }
  const u=urgency(t);
  if (t.status==='todo' && u.level==='red') card.classList.add('overdue');
  else if (t.status==='todo' && u.level==='orange') card.classList.add('urgOrange');
  if (t.status==='done') card.classList.add('doneCard');

  // 標題（✏️ 進入行內編輯）
  if (editingTitle.has(t.id)){
    const ti=document.createElement('input');
    ti.className='titleEdit'; ti.type='text'; ti.value=t.title;
    const commit=()=>{
      if (!editingTitle.has(t.id)) return;
      editingTitle.delete(t.id);
      const nv=ti.value.trim();
      if (nv){
        // 改標題時「新補上」的 [名單]/[]項目 → 沒有清單的任務也能事後建核選框
        const prev=detectSubs(t.title||'').join('、'), now=detectSubs(nv);
        t.title=nv;
        if (!(t.subs&&t.subs.length) && now.length && now.join('、')!==prev){
          t.subs=now.map(n=>({name:n, done:false, doneAt:null}));
          catSay('偵測到括號名單，幫你建好 '+now.length+' 格核選框了喵',2800,'happy');
        }
      }
      save(); render();
    };
    ti.onkeydown=e=>{
      if (e.key==='Enter') commit();
      if (e.key==='Escape'){ editingTitle.delete(t.id); render(); }
    };
    ti.onblur=commit;
    card.appendChild(ti);
    setTimeout(()=>{ ti.focus(); ti.select(); },0);
  } else {
    const titleEl=document.createElement('div');
    titleEl.className='title'+(t.status==='done'?' done':'');
    if (t.status!=='done'){
      const dh=document.createElement('span');
      dh.className='dragHandle'; dh.textContent='⠿';
      dh.title='按住拖曳，放到別張卡的上/下即可手動排序';
      dh.onpointerdown=e=>startTaskDrag(e, t, card);
      titleEl.appendChild(dh);
    }
    const tSpan=document.createElement('span');
    const _tt=(t.tags.includes('重要')&&t.status!=='done'?'⭐ ':'')+t.title;
    const _qs=cmtQuotes(t);
    if (_qs.length) markQuotes(tSpan, _tt, _qs); else tSpan.textContent=_tt;
    titleEl.appendChild(tSpan);
    card.appendChild(titleEl);
  }

  // 內文區：長文照舊「▾ 看內文」；短任務（內文＝標題）也給「📝 加內文」入口
  //（使用者要求：任務要像其他地方一樣有標題＋內文，不能只有標題可編）
  // 內文跟標題不一樣＝有內文可看（就算只有一行短短的也要能打開）
  const hasDetail=needsDetail(t.text, t.title) || (t.text||'').trim()!==(t.title||'').trim();
  if (!hasDetail && t.status!=='done' && !editingText.has(t.id)){
    const ab=document.createElement('button');
    ab.className='detailToggle addBody'; ab.innerHTML=riIcon('fileText')+' 加內文';
    ab.title='幫這個任務補上內文說明';
    ab.onclick=()=>{ expandedDetail.add(t.id); editingText.add(t.id); render(); };
    card.appendChild(ab);
  }
  if (hasDetail || editingText.has(t.id)){
    const tog=document.createElement('button');
    tog.className='detailToggle';
    const open=expandedDetail.has(t.id) || editingText.has(t.id);
    tog.textContent=open?'▴ 收起內文':'▾ 看內文';
    tog.onclick=()=>{ open?expandedDetail.delete(t.id):expandedDetail.add(t.id); render(); };
    card.appendChild(tog);
    if (open){
      if (editingText.has(t.id)){
        const ta=document.createElement('textarea'); ta.className='trkNote';
        ta.style.minHeight='120px';
        // 內文＝標題（快速新增的短任務）→ 給空白編輯區，別把標題複製進來混淆
        ta.value = (t.text||'').trim()===(t.title||'').trim() ? '' : t.text;
        ta.placeholder='寫點內文說明…（支援 Markdown）';
        const commit=()=>{
          if (!editingText.has(t.id)) return;
          editingText.delete(t.id);
          const typed=ta.value.trim();
          const prev=detectSubs((t.text||'')===(t.title||'')?'':(t.text||'')).join('、');
          t.text = typed ? ta.value : t.title;   // 清空＝回到只有標題
          // 內文補打 [名單]/[]項目 → 沒有清單的任務也能事後建核選框
          const now=typed?detectSubs(ta.value):[];
          if (!(t.subs&&t.subs.length) && now.length && now.join('、')!==prev){
            t.subs=now.map(n=>({name:n, done:false, doneAt:null}));
            catSay('偵測到清單，幫你建好 '+now.length+' 格核選框了喵',2800,'happy');
          }
          save(); render();
        };
        ta.onblur=commit;
        ta.style.maxHeight='60vh';
        ta.addEventListener('input',()=>autoGrowTa(ta,120));
        setTimeout(()=>autoGrowTa(ta,120),0);
        bindCtrlSave(ta, commit);   // 內文＝寫內容的編輯區：Enter 換行、Ctrl+Enter 快速存
        card.appendChild(ta);
        card.appendChild(editHint());
        setTimeout(()=>ta.focus(),0);
      } else {
        const dv=document.createElement('div');
        dv.className='detail';
        // v54：內文第一行若跟標題一樣就不重複顯示（只影響顯示，資料不動）
        let _body=t.text||'';
        const _ls=_body.split('\n');
        if (_ls.length>1 && _ls[0].trim()===(t.title||'').trim()) _body=_ls.slice(1).join('\n').replace(/^\n+/,'');
        renderRich(dv, _body);
        card.appendChild(dv);
        // v54：長內文先收成 6 行＋漸層，按鈕展開全文（不再用內層捲軸）
        const isFull=fullDetail.has(t.id);
        if (!isFull) dv.classList.add('clamp');
        const mb=document.createElement('button'); mb.className='detailToggle';
        mb.textContent=isFull?'▴ 收成 6 行':'▾ 展開全文';
        mb.onclick=()=>{ isFull?fullDetail.delete(t.id):fullDetail.add(t.id); render(); };
        card.appendChild(mb);
        if (!isFull) requestAnimationFrame(()=>{ if (dv.scrollHeight<=dv.clientHeight+6){ dv.classList.remove('clamp'); mb.style.display='none'; } });
        const eb=document.createElement('button'); eb.className='detailToggle';
        eb.textContent='✏️ 編輯內文';
        eb.onclick=()=>{ editingText.add(t.id); render(); };
        card.appendChild(eb);
      }
    }
  }

  if (t.status==='waiting'){
    const w=document.createElement('div');
    const f=fromISO(t.followUp);
    if (f){
      const n=daysUntil(f);
      w.className='waitInfo'+(n<=0?' due':'');
      w.textContent = n<0 ? `⏰ 追蹤日已過 ${-n} 天（${fmtDate(f)}）—— 該催了喵！`
                   : n===0 ? `⏰ 今天是追蹤日 —— 該催了喵！`
                   : `⏳ 追蹤日：${fmtDate(f)}（${n} 天後）`;
    } else { w.className='waitInfo'; w.textContent='⏳ 等回覆中（未設追蹤日）'; }
    card.appendChild(w);
  }

  // 子項目勾選清單（分別追蹤多間學校/多個對象）
  if (t.subs && t.subs.length){
    const box=document.createElement('div');
    box.className='subList';
    t.subs.forEach((s,si2)=>{
      const row=document.createElement('label');
      row.className='subItem'+(s.done?' subDone':'');
      const cb=document.createElement('input');
      cb.type='checkbox'; cb.checked=!!s.done;
      cb.onchange=()=>{
        s.done=cb.checked;
        s.doneAt=cb.checked?toISO(new Date()):null;
        save();
        if (t.subs.every(x=>x.done)) catSay('全部回傳了！可以按 ✔ 完成喵～',2800,'happy');
        render();
      };
      // 名字可以直接點著改（Enter/點別處＝儲存、Esc＝取消、清空＝移除這格）
      if (editingSubKey===t.id+':'+si2){
        const ni2=document.createElement('input'); ni2.className='miniInput';
        ni2.style.cssText='width:130px;font-size:13.5px;'; ni2.value=s.name;
        const commit=()=>{
          if (editingSubKey!==t.id+':'+si2) return;
          editingSubKey=null;
          const v=ni2.value.trim();
          if (!v) t.subs.splice(si2,1);        // 清空＝刪掉這一格
          else s.name=v;
          save(); render();
        };
        ni2.onkeydown=e=>{
          if (e.key==='Enter') commit();
          if (e.key==='Escape'){ editingSubKey=null; render(); }
        };
        ni2.onblur=commit;
        ni2.onclick=e=>e.preventDefault();
        row.append(cb,ni2);
        setTimeout(()=>{ ni2.focus(); ni2.select(); },0);
      } else {
        const nm=document.createElement('span');
        nm.className='subName';
        const _sq=cmtQuotes(t);
        if (_sq.length) markQuotes(nm, s.name, _sq); else nm.textContent=s.name;
        // 點名字不再直接進編輯（太容易誤觸）——文字可以反黑選取加註解；要改名按旁邊的 ✎
        nm.title='可以反黑選取文字加註解；要改名按 ✎';
        nm.onclick=e=>e.preventDefault();   // 擋掉 label 預設的勾選切換，讓反黑選字可用
        const eb=document.createElement('button');
        eb.className='subEdit'; eb.textContent='✎';
        eb.title='改名（清空＝刪除這格）';
        eb.onclick=e=>{ e.preventDefault(); editingSubKey=t.id+':'+si2; render(); };
        row.append(cb,nm,eb);
      }
      if (s.done&&s.doneAt){
        const dt=document.createElement('span');
        dt.className='subDate';
        dt.textContent='✓ '+fmtDate(fromISO(s.doneAt))+' 回傳';
        row.appendChild(dt);
      }
      box.appendChild(row);
    });
    // ＋直接加一項（不用再點 ☑ 重打整串名單）——完成的任務不用加
    if (t.status!=='done'){
      const ar=document.createElement('div'); ar.className='subAddRow';
      const ai=document.createElement('input'); ai.type='text';
      ai.placeholder='＋ 加一項…（Enter 新增）';
      ai.dataset.subadd=t.id;
      ai.value=subAddDraft[t.id]||'';
      ai.oninput=()=>{ subAddDraft[t.id]=ai.value; };
      const commitAdd=()=>{
        const v=ai.value.trim(); if(!v) return;
        t.subs.push({name:v, done:false, doneAt:null});
        delete subAddDraft[t.id]; save(); render();
        // 重繪後把游標放回輸入框，方便連續加好幾項
        setTimeout(()=>{ const el=document.querySelector('input[data-subadd="'+t.id+'"]'); if(el) el.focus(); },0);
      };
      ai.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); commitAdd(); } };
      const ab=document.createElement('button'); ab.textContent='＋'; ab.title='新增這一項';
      ab.onclick=commitAdd;
      ar.append(ai,ab);
      box.appendChild(ar);
    }
    card.appendChild(box);
  }

  const meta=document.createElement('div');
  meta.className='meta';
  if (inAllView()){
    const sc=document.createElement('span'); sc.className='chip type';
    sc.textContent=spaceIcon(t.space);
    sc.title=(t.space||'work')==='life'?'私人空間':'工作空間';
    meta.appendChild(sc);
  }
  if (catInfo(t.cat).vis!=='hideTag'){
    const catChip=document.createElement('span');
    catChip.className='chip clickable '+colorClass(t.cat);
    catChip.textContent='📂 '+t.cat;
    catChip.title='點擊選擇專案';
    catChip.onclick=()=>{ openCatPick.has(t.id)?openCatPick.delete(t.id):openCatPick.add(t.id); render(); };
    meta.appendChild(catChip);
  }
  const typeChip=document.createElement('span');
  typeChip.className='chip type clickable'; typeChip.textContent=t.type;
  typeChip.title='點擊切換類型';
  if (t.type==='🛠 其他') typeChip.style.opacity='.4';   // 預設類型＝沒資訊量，淡化降噪
  typeChip.onclick=()=>{ t.type=TYPES[(TYPES.indexOf(t.type)+1)%TYPES.length]; save(); render(); };
  meta.appendChild(typeChip);
  if (t.repeat){
    const rc=document.createElement('span');
    rc.className='chip clickable type';
    rc.textContent = t.repeat==='weekly' ? '🔁 每週' : '🔁 每月';
    rc.title='例行任務：完成後自動排下一次（點擊循環：每週 → 每月 → 取消）';
    rc.onclick=()=>{ t.repeat = t.repeat==='weekly' ? 'monthly' : null; save(); render(); };
    meta.appendChild(rc);
  }
  if (t.subs && t.subs.length){
    const done=t.subs.filter(s=>s.done).length;
    const pc=document.createElement('span');
    pc.className='chip subProg clickable';
    pc.innerHTML=riIcon('checkbox')+' '+done+'/'+t.subs.length;
    pc.title='點擊編輯勾選清單（加人/減人/改名字）';
    pc.onclick=()=>{ openSubs.has(t.id)?openSubs.delete(t.id):openSubs.add(t.id); render(); };
    meta.appendChild(pc);
  }
  // 💬 註解 bubble：掛在卡片右上角、常駐顯示（不受「+N」標籤收合影響——
  // 之前收在標籤列裡，標籤一多就被藏進 +N，重整後看起來像註解不見了）
  if (t.comments && t.comments.length){
    const undone=t.comments.filter(c=>!c.done).length;
    const cc2=document.createElement('span');
    cc2.className='cmtBubble'+(undone?'':' allDone');
    cc2.textContent = undone ? '💬'+undone : '💬✓';
    cc2.title = undone ? '未處理註解 '+undone+' 條（滑過偷看、點一下展開）'
                       : '註解都處理完了（點一下展開回顧）';
    // 滑鼠移上去＝浮出預覽泡泡（不用點就看得到內容）
    cc2.onmouseenter=()=>showCmtPeek(cc2, t);
    cc2.onmouseleave=hideCmtPeek;
    cc2.onclick=()=>{
      hideCmtPeek();
      const opening=!openComments.has(t.id);
      if (opening) openComments.add(t.id); else openComments.delete(t.id);
      render();
      if (opening) setTimeout(()=>{   // 展開後捲到定位＋亮一下框，保證看得到
        const el=document.querySelector('.task[data-tid="'+t.id+'"] .cmtBox');
        if (el){
          el.scrollIntoView({behavior:'smooth', block:'nearest'});
          el.style.outline='2px solid var(--accent)';
          setTimeout(()=>{ el.style.outline=''; },1600);
        }
      },0);
    };
    card.appendChild(cc2);
  }
  if (t.who){
    const wc=document.createElement('span');
    wc.className='chip clickable who';
    wc.innerHTML=riIcon('user')+' '+esc(t.who);
    wc.title='點擊編輯對象';
    wc.onclick=()=>{ openPicker.add(t.id); render(); };
    meta.appendChild(wc);
  }
  t.tags.forEach(tag=>{
    const el=document.createElement('span');
    el.className='chip clickable tag tag-'+tag;
    el.textContent=TAG_EMOJI[tag]+' '+tag;
    el.title='點擊移除標籤';
    el.onclick=()=>{ t.tags=t.tags.filter(x=>x!==tag); save(); render(); };
    meta.appendChild(el);
  });
  if (t.status!=='done'){
    const urgChip=document.createElement('span');
    urgChip.className='chip clickable urg-'+u.level;
    urgChip.textContent=u.label+((t.due&&t.time)?('　⏰'+t.time):'');
    urgChip.title='點擊修改期限／時間';
    urgChip.onclick=()=>{ openDue.has(t.id)?openDue.delete(t.id):openDue.add(t.id); render(); };
    meta.appendChild(urgChip);
    if (t.start && t.due){
      const pc=document.createElement('span');
      pc.className='chip clickable type';
      pc.textContent=(t.icon||'📌')+' '+fmtDate(fromISO(t.start))+'→'+fmtDate(fromISO(t.due));
      pc.title='期間任務：日曆上整段期間以小圖示顯示（點擊編輯）';
      pc.onclick=()=>{ openDue.has(t.id)?openDue.delete(t.id):openDue.add(t.id); render(); };
      meta.appendChild(pc);
    }
  }
  const sp=document.createElement('span'); sp.className='spacer'; meta.appendChild(sp);

  const actions=document.createElement('div');
  actions.className='actions';
  const mkBtn=(label,cls,fn,tip)=>{ const b=document.createElement('button');
    if (label.includes('<svg')) b.innerHTML=label; else b.textContent=label;   // v38：動作鈕改 RI SVG（跨裝置長相一致）
    if(cls)b.className=cls; if(tip)b.title=tip; b.onclick=fn; actions.appendChild(b); };

  if (t.status==='todo'){
    mkBtn('✔ 完成','primary',()=>{ completeTask(t); render(); });
    mkBtn(riIcon('hourglass')+' 等回覆','',()=>{
      t.status='waiting';
      t.followUp=toISO(addDays(new Date(),3));
      openWait.add(t.id);
      save(); catSay('已移到下方「⏳ 等對方回覆」區，'+fmtDate(fromISO(t.followUp))+' 提醒你催（卡片上可改日期）喵',4200); render();
    },'我寄出了、等對方回覆（會排催辦提醒）');
  } else if (t.status==='waiting'){
    mkBtn('✔ 對方回了','primary',()=>{ t.status='todo'; t.followUp=null; openWait.delete(t.id); save(); render(); });
    mkBtn('📅 改追蹤日','',()=>{ openWait.has(t.id)?openWait.delete(t.id):openWait.add(t.id); render(); });
    mkBtn('✔ 完成','primary',()=>{ openWait.delete(t.id); completeTask(t); render(); });
  } else {
    mkBtn('↩ 還原','',()=>{ t.status='todo'; t.doneAt=null; save(); render(); });
    mkBtn(riIcon('archive'),'',()=>{
      t.archived=true; save(); render();
      catSay('收進「'+(t.cat||'其他')+'」的封存資料夾了喵',2200);
    },'封存（收進 🗄️ 封存頁的專案資料夾）');
  }
  // ☑ 子任務常駐入口（還沒有清單時才顯示；有清單就點上面的 ☑ N/N 標籤編輯）
  if (t.status!=='done' && !(t.subs&&t.subs.length) && !openActions.has(t.id)){
    mkBtn(riIcon('checkbox')+'＋','',()=>{ openSubs.add(t.id); render(); },'新增子任務清單（把這件事拆成好幾格勾選）');
  }
  // 次要動作收進「⋯」——每張卡常駐的按鈕從 6 顆減到 3 顆
  if (openActions.has(t.id) || pendingDelete===t.id){
    mkBtn(riIcon('checkbox'),'',()=>{ openSubs.has(t.id)?openSubs.delete(t.id):openSubs.add(t.id); render(); },'子項目（分別追蹤多個對象）');
    mkBtn('💬','',()=>{ openComments.has(t.id)?openComments.delete(t.id):openComments.add(t.id); render(); },'註解（附日期的小筆記，可劃掉）');
    mkBtn(riIcon('tag'),'',()=>{ openPicker.has(t.id)?openPicker.delete(t.id):openPicker.add(t.id); render(); },'標籤與對象');
    mkBtn(riIcon('pencil'),'',()=>{ editingTitle.add(t.id); render(); },'改標題');
    if (pendingDelete===t.id){
      mkBtn('確定刪除？','confirmDel',()=>{
        tasks=tasks.filter(x=>x.id!==t.id);
        pendingDelete=null; clearTimeout(pendingDeleteTimer);
        save(); render();
      });
    } else {
      mkBtn(riIcon('trash'),'danger',()=>{
        pendingDelete=t.id;
        clearTimeout(pendingDeleteTimer);
        pendingDeleteTimer=setTimeout(()=>{ pendingDelete=null; render(); },3000);
        render();
      },'刪除（再點一次確認）');
    }
    mkBtn('‹','',()=>{ openActions.delete(t.id); render(); },'收合');
  } else {
    mkBtn('⋯','',()=>{ openActions.add(t.id); render(); },'更多：子項目／標籤／改標題／刪除');
  }

  // 標籤太多時收斂：最多 4 顆＋急切度常駐，其餘收進「+N」
  const chipEls=[...meta.children].filter(el=>el.classList&&el.classList.contains('chip'));
  const hideable=chipEls.filter(el=>![...el.classList].some(c=>c.indexOf('urg-')===0));
  if (hideable.length>4 && !openChips.has(t.id)){
    hideable.slice(4).forEach(el=>el.style.display='none');
    const more=document.createElement('span'); more.className='chip clickable type';
    more.textContent='+'+(hideable.length-4); more.title='顯示全部標籤';
    more.onclick=()=>{ openChips.add(t.id); render(); };
    meta.appendChild(more);
  } else if (hideable.length>4){
    const less=document.createElement('span'); less.className='chip clickable type';
    less.textContent='‹'; less.title='收合標籤';
    less.onclick=()=>{ openChips.delete(t.id); render(); };
    meta.appendChild(less);
  }
  meta.appendChild(actions);
  card.appendChild(meta);

  // 📂 專案選單（點卡片上的專案標籤展開）
  if (openCatPick.has(t.id)){
    const row=document.createElement('div'); row.className='pickerRow';
    const lb=document.createElement('span'); lb.className='plabel'; lb.textContent='📂 掛到專案：';
    row.appendChild(lb);
    cycleCats().forEach(cn=>{
      const b=document.createElement('span');
      b.className='memberTag '+(t.cat===cn?'on ':'')+colorClass(cn);
      b.textContent=cn;
      b.onclick=()=>{
        t.cat=cn; openCatPick.delete(t.id); save(); render();
        catSay('「'+t.title.slice(0,12)+'」掛到 📂 '+cn+' 了喵！',2200,'happy');
      };
      row.appendChild(b);
    });
    card.appendChild(row);
  }

  // 💬 註解（Google 文件式）：每條＝日期在上、內文在下的小區塊，動作鈕滑過才浮現
  if (openComments.has(t.id)){
    const box=document.createElement('div'); box.className='pickerRow cmtBox';
    box.style.cssText+='flex-direction:column;align-items:stretch;gap:0;';
    const bt=document.createElement('div');
    bt.style.cssText='font-size:12.5px;font-weight:700;color:var(--sub);letter-spacing:.5px;';
    bt.textContent='💬 註解';
    box.appendChild(bt);
    (t.comments||[]).forEach((cm,ci2)=>{
      const row=document.createElement('div'); row.className='cmtRow';
      if (ci2>0) row.style.borderTop='1px solid var(--line)';
      const head=document.createElement('div');
      head.style.cssText='display:flex;align-items:center;gap:6px;';
      const dt2=document.createElement('span'); dt2.className='cmtDate';
      dt2.textContent=(cm.date||'').slice(5).replace('-','/');
      const spc=document.createElement('span'); spc.style.flex='1';
      const ok2=document.createElement('button'); ok2.className='qbtn cmtAct';
      ok2.textContent=cm.done?'↩':'✓'; ok2.title=cm.done?'恢復':'完成（劃掉）';
      ok2.onclick=()=>{ cm.done=!cm.done; save(); render(); };
      const del2=document.createElement('button'); del2.className='qbtn cmtAct';
      if (commentDel===cm.id){
        del2.textContent='確定刪除？'; del2.style.cssText='background:var(--red);color:var(--on-red,#fff);opacity:1;';
        del2.onclick=()=>{
          t.comments=t.comments.filter(x=>x.id!==cm.id);
          if (!t.comments.length) openComments.delete(t.id);   // 刪到一條不剩＝整個註解框收掉
          commentDel=null; save(); render();
        };
      } else {
        del2.textContent='✕'; del2.title='刪除（再點一次確認）';
        del2.onclick=()=>{ commentDel=cm.id; clearTimeout(commentDelTimer);
          commentDelTimer=setTimeout(()=>{ commentDel=null; render(); },3000); render(); };
      }
      head.append(dt2,spc,ok2,del2);
      const tx=document.createElement('div');
      tx.style.cssText='font-size:13.5px;line-height:1.6;margin-top:2px;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;'
        +(cm.done?'color:var(--sub);text-decoration:line-through;':'color:var(--ink);');
      renderRich(tx, cm.text);   // 支援連結；Markdown 效果照常
      row.append(head,tx);
      box.appendChild(row);
    });
    const ar2=document.createElement('div'); ar2.style.cssText='display:flex;gap:6px;margin-top:8px;align-items:flex-end;';
    const ci=document.createElement('textarea'); ci.rows=1;
    ci.style.cssText='flex:1;min-width:0;';
    ci.placeholder= enterMode()==='send'
      ? '加一條註解…（Enter 送出、Shift+Enter 換行）'
      : '加一條註解…（Enter 換行、Ctrl+Enter 或 ＋ 送出）';
    ci.value=commentDraft[t.id]||'';
    const fitC=()=>{ ci.style.height='auto'; ci.style.height=(ci.scrollHeight+2)+'px'; };
    ci.oninput=()=>{ commentDraft[t.id]=ci.value; fitC(); };
    const commitC=()=>{
      const v=ci.value.trim(); if(!v) return;
      if (!t.comments) t.comments=[];
      t.comments.push({id:uid(), text:v, date:toISO(new Date()), done:false});
      delete commentDraft[t.id]; save(); render();
    };
    bindCtrlSave(ci, commitC);   // 註解可以換行了：Enter＝換行、Ctrl+Enter＝送出（「都送出」模式下 Enter 直接送）
    const ab2=document.createElement('button'); ab2.className='qbtn'; ab2.textContent='＋';
    ab2.title='送出註解';
    ab2.onclick=commitC;
    ar2.append(ci,ab2);
    box.appendChild(ar2);
    card.appendChild(box);
    setTimeout(fitC,0);
  }

  // 期限快選列
  // 子項目編輯列
  if (openSubs.has(t.id)){
    const row=document.createElement('div');
    row.className='pickerRow';
    const lb=document.createElement('span'); lb.className='plabel'; lb.innerHTML=riIcon('checkbox')+' 子項目：';
    row.appendChild(lb);
    const si=document.createElement('input');
    si.className='whoInput'; si.type='text'; si.style.width='240px';
    si.placeholder='用空格或逗號分隔，例：小橘 小黑 小虎';
    si.value = t.subs.length ? t.subs.map(s=>s.name).join('、') : detectSubs(t.title+' '+t.text).join('、');
    const commitSubs=()=>{
      const names=si.value.split(/[、,，\/\s]+/).map(s=>s.trim()).filter(Boolean);
      const old=new Map(t.subs.map(s=>[s.name,s]));
      t.subs=names.map(n=> old.get(n) || {name:n, done:false, doneAt:null});
      openSubs.delete(t.id); save(); render();
    };
    si.onkeydown=e=>{ if(e.key==='Enter') commitSubs(); };
    const ok=document.createElement('button');
    ok.className='qbtn'; ok.textContent='✔ 建立清單';
    ok.onclick=commitSubs;
    const clr=document.createElement('button');
    clr.className='qbtn'; clr.textContent='移除清單';
    clr.onclick=()=>{ t.subs=[]; openSubs.delete(t.id); save(); render(); };
    row.append(si,ok,clr);
    card.appendChild(row);
  }

  if (openDue.has(t.id) && t.status!=='done'){
    const row=document.createElement('div');
    row.className='pickerRow';
    const lb=document.createElement('span'); lb.className='plabel'; lb.textContent='期限：';
    row.appendChild(lb);
    row.appendChild(buildDuePicker(t.due, iso=>{ t.due=iso; save(); render(); }));
    // 時間（每個任務自己選填，留空＝不用時間）
    const tt2=document.createElement('span'); tt2.className='qbtn'; tt2.title='時間（選填，清空＝不顯示時間）';
    const tin=document.createElement('input'); tin.type='time'; tin.value=t.time||'';
    tin.style.cssText='border:none;background:transparent;font:inherit;font-size:12.5px;color:inherit;width:80px;cursor:pointer;';
    tin.onchange=()=>{ t.time=tin.value||null; save(); render(); };
    tt2.append('⏰',tin);
    row.appendChild(tt2);
    // 期間任務：設開始日＋圖示，日曆整段只顯示小圖示
    const br=document.createElement('span'); br.style.cssText='flex-basis:100%;height:0;';
    row.appendChild(br);

        b.onclick=()=>{ t.icon=ic; save(); render(); };
        row.appendChild(b);
      });

  if (openWait.has(t.id) && t.status==='waiting'){

    [['明天',1],['3天後',3],['1週後',7],['2週後',14]].forEach(([label,n])=>{

    });
    const pick=document.createElement('span'); pick.className='qbtn';
    const di=document.createElement('input');
    di.type='date'; di.value=t.followUp||'';
    di.onchange=()=>{ if(di.value){ t.followUp=di.value; openWait.delete(t.id); save(); render(); } };
    pick.append('📅',di);
    row.appendChild(pick);

  // 標籤＋對象列
  if (openPicker.has(t.id)){
    const p=document.createElement('div');
    p.className='pickerRow';
    const lb=document.createElement('span'); lb.className='plabel'; lb.textContent='標籤：';
    p.appendChild(lb);
    TAGS.forEach(tag=>{
      const on=t.tags.includes(tag);
      const el=document.createElement('span');
      el.className='chip clickable tag '+(on?('tag-'+tag):'tag off');
      el.textContent=TAG_EMOJI[tag]+' '+tag;
      el.onclick=()=>{
        if (on) t.tags=t.tags.filter(x=>x!==tag);
        else {
          t.tags=t.tags.filter(x=> !( (tag==='急'&&x==='不急') || (tag==='不急'&&x==='急') ));
          t.tags.push(tag);
        }
        save(); render();
      };
      p.appendChild(el);
    });
    const wlb=document.createElement('span'); wlb.className='plabel'; wlb.innerHTML='　'+riIcon('user')+' 對象：';
    p.appendChild(wlb);
    const wi=document.createElement('input');
    wi.className='whoInput'; wi.type='text'; wi.placeholder='輸入名字';
    wi.value=t.who||'';
    wi.onchange=()=>{
      t.who=wi.value.trim()||null;

      save(); render();
    };
    attachWhoSuggest(wi, n=>{ t.who=n; learnContact(n); save(); render(); });
    p.appendChild(wi);
    card.appendChild(p);
  }
  return card;
}

/* 📋 本週完成清單 → 剪貼簿（週一起算到今天；含任務、子項目回傳、點名回傳） */
function copyWeekDone(){
  const today=new Date(); today.setHours(0,0,0,0);
  const mon=new Date(today); mon.setDate(mon.getDate()-((mon.getDay()+6)%7));
  const inWeek=iso=>{ const d=fromISO(iso); return d && d>=mon && d<=today; };
  const byDay={};
  const push=(iso,txt)=>{ (byDay[iso]=byDay[iso]||[]).push(txt); };
  spaceTasks().concat(tasks.filter(t=>spaceMatch(t.space)&&t.archived)).forEach(t=>{
    if (t.status==='done' && inWeek(t.doneAt)) push(t.doneAt,'完成：'+t.title);
    (t.subs||[]).forEach(s=>{ if(s.done && inWeek(s.doneAt)) push(s.doneAt,'收到：'+s.name+'（'+t.title+'）'); });
  });
  trackers.filter(k=>spaceMatch(k.space)).forEach(trk=>trk.rows.forEach(r=>{
    if (r.done && inWeek(r.doneAt)) push(r.doneAt,'收到：'+r.name+'（'+trk.title+'）');
  }));
  const days=Object.keys(byDay).sort();
  const fmt=iso=>{ const d=fromISO(iso); return (d.getMonth()+1)+'/'+d.getDate()+'（週'+WD[d.getDay()]+'）'; };
  let out='本週完成（'+(mon.getMonth()+1)+'/'+mon.getDate()+'–'+(today.getMonth()+1)+'/'+today.getDate()+'）\n';
  if (!days.length) out+='（本週還沒有完成紀錄）';
  else days.forEach(iso=>{ out+=fmt(iso)+'\n'; byDay[iso].forEach(l=>out+='・'+l+'\n'); });
  const ta=document.createElement('textarea'); ta.value=out.trim();
  document.body.appendChild(ta); ta.select();
  let ok=false; try{ ok=document.execCommand('copy'); }catch(e){}
  ta.remove();
  catSay(ok?'本週成果複製好了！貼到週報吧喵～':'複製失敗喵…',2600, ok?'happy':'alarmed');
}
/* 📱 手機日曆範圍切換：整月/本週/今天（桌機不顯示、不過濾） */
let mobCalRange='month';
let mobBigLay=false;      // 📱 總月曆圖層列：手機預設收合
let mobDiaryTools=false;  // 📱 日誌工具列（日期選擇/搜尋/複製/14天條）：手機預設收合
function mobRangeKeep(iso){
  if (!isMobileShell() || mobCalRange==='month' || mobCalRange==='grid') return true;
  const t=new Date(); t.setHours(0,0,0,0);
  if (mobCalRange==='day') return iso===toISO(t);
  const ws=addDays(t,-t.getDay());
  return iso>=toISO(ws) && iso<=toISO(addDays(ws,6));
}
function mkMobRange(rerender){
  // 📱 一顆下拉選檢視（使用者回饋：按鈕太多）：格狀月曆／整月列表／本週／今天

/* 📱 手勢通用：水平滑動（垂直位移過大視為捲動、不觸發）。桌機無 touch 事件，天然不生效 */
function bindSwipeX(el, onLeft, onRight){
  let sx=0, sy=0, on=false;
  el.addEventListener('touchstart', e=>{
    if (e.touches.length!==1) return;
    sx=e.touches[0].clientX; sy=e.touches[0].clientY; on=true;
  }, {passive:true});
  el.addEventListener('touchend', e=>{
    if (!on) return; on=false;
    const t=e.changedTouches[0], dx=t.clientX-sx, dy=Math.abs(t.clientY-sy);
    if (Math.abs(dx)>64 && dy<44){ (dx<0?onLeft:onRight)(); }
  }, {passive:true});
}
function renderCalendar(){
  const wrap=document.getElementById('calendar');
  if (calY===undefined){ const n=new Date(); calY=n.getFullYear(); calM=n.getMonth(); }
  wrap.innerHTML='';
  const card=document.createElement('div');
  card.className='calCard';

  const head=document.createElement('div');
  head.className='calHead';
  const prev=document.createElement('button'); prev.textContent='‹';
  prev.onclick=()=>{ calM--; if(calM<0){calM=11;calY--;} renderCalendar(); };
  const title=document.createElement('span'); title.className='mTitle';
  title.textContent=`${calY}年 ${calM+1}月`;
  const next=document.createElement('button'); next.textContent='›';
  next.onclick=()=>{ calM++; if(calM>11){calM=0;calY++;} renderCalendar(); };
  const tb=document.createElement('button'); tb.className='todayBtn'; tb.textContent='回今天';
  tb.onclick=()=>{ const n=new Date(); calY=n.getFullYear(); calM=n.getMonth(); calSel=toISO(n); calRollOff=0; renderCalendar(); };
  if (calRoll){   // 接下來模式：‹ › 一次移一週、標題顯示範圍
    const rs=new Date(); rs.setHours(0,0,0,0); rs.setDate(rs.getDate()-rs.getDay()+calRollOff*7);
    prev.onclick=()=>{ calRollOff--; renderCalendar(); };
    next.onclick=()=>{ calRollOff++; renderCalendar(); };
    title.textContent=fmtDate(rs)+' – '+fmtDate(addDays(rs,34));
  }
  head.append(prev,title,next,tb);
  card.appendChild(head);

  // 兩個視角：預定（到期日）vs 完成（實際完成日）＋「接下來」排版切換
  const modes=document.createElement('div'); modes.className='calModes';
  [['plan','📅 預定'],['done','✅ 完成']].forEach(([m,label])=>{
    const b=document.createElement('button');
    b.className='qbtn'+(calMode===m?' on':'');
    b.textContent=label;
    b.onclick=()=>{ calMode=m; renderCalendar(); };
    modes.appendChild(b);
  });
  const rollB=document.createElement('button'); rollB.className='qbtn'+(calRoll?' on':'');
  rollB.textContent='📆 接下來';
  rollB.title='第一排＝本週、共 5 週，一眼看到接下來一個月';
  rollB.onclick=()=>{ calRoll=!calRoll; calRollOff=0; renderCalendar(); };
  modes.appendChild(rollB);
  card.appendChild(modes);
  const legend=document.createElement('div'); legend.className='calLegend';
  legend.textContent = calMode==='plan'
    ? '這裡的日期都是「到期日」：任務的期限、等回覆的追蹤日（⏳）。不是開始日，也不是完成日。'
    : '這裡的日期都是「實際完成日」：哪天做完任務、哪天收到回傳（✓）。等於你的工作日誌。';
  card.appendChild(legend);
  if (calMode==='done'){   // 📋 週報一鍵生成
    const wr=document.createElement('div'); wr.style.cssText='text-align:center;margin-bottom:6px;';
    const wb=document.createElement('button'); wb.className='qbtn'; wb.textContent='📋 複製本週完成清單';
    wb.title='把本週（週一起）的完成紀錄整理成文字，直接貼進週報或回報信';
    wb.onclick=()=>copyWeekDone();
    wr.appendChild(wb); card.appendChild(wr);
  }

  const visible = spaceTasks().filter(t=>filterCat==='全部'||t.cat===filterCat);
  const byDate = {};
  if (calMode==='plan'){
    visible.forEach(t=>{
      if (t.status==='todo' && t.due){
        if (t.start && fromISO(t.start) && fromISO(t.start)<=fromISO(t.due)){
          eachPeriodDay(t,(iso,isEnd)=>{
            (byDate[iso]=byDate[iso]||[]).push({t, kind:'periodIcon', icon:t.icon||'📌', end:isEnd});
          });
        } else {
          (byDate[t.due]=byDate[t.due]||[]).push({t, kind:'due', label:(t.time?t.time+' ':'')+t.title, cls:colorClass(t.cat)});
        }
      }
      if (t.status==='waiting' && t.followUp)
        (byDate[t.followUp]=byDate[t.followUp]||[]).push({t, kind:'wait', label:'⏳'+t.title, cls:colorClass(t.cat)});
    });
  } else {
    visible.forEach(t=>{
      if (t.status==='done' && t.doneAt)
        (byDate[t.doneAt]=byDate[t.doneAt]||[]).push({t, kind:'doneTask', label:'✓ '+t.title, cls:'donePill'});
      (t.subs||[]).forEach(s=>{
        if (s.done && s.doneAt)
          (byDate[s.doneAt]=byDate[s.doneAt]||[]).push({t, kind:'doneSub', label:'✓ '+s.name+' 回傳・'+t.title, cls:'donePill'});
      });
    });
    trackers.forEach(trk=>trk.rows.forEach(r=>{
      if (r.done && r.doneAt)
        (byDate[r.doneAt]=byDate[r.doneAt]||[]).push({trk, row:r, kind:'doneRow', label:'✓ '+r.name+' 回傳・'+trk.title, cls:'donePill'});
    }));
  }

  const grid=document.createElement('div');
  grid.className='calGrid';
  WD.forEach(w=>{ const e=document.createElement('div'); e.className='wd'; e.textContent=w; grid.appendChild(e); });
  const todayISO=toISO(new Date());
  const mkCell=(iso, dnumText)=>{
    const c=document.createElement('div');
    c.className='calCell'+(iso===todayISO?' today':'')+(iso===calSel?' sel':'');
    const dn=document.createElement('div'); dn.className='dnum'; dn.textContent=dnumText;
    const wdT=document.createElement('span'); wdT.className='calWd';
    wdT.textContent='週'+WD[fromISO(iso).getDay()];   // 手機週列表用，桌機隱藏
    dn.appendChild(wdT);
    c.appendChild(dn);
    const items=byDate[iso]||[];
    const icons=items.filter(it=>it.kind==='periodIcon');
    if (icons.length){
      const ir=document.createElement('div'); ir.className='calIcons';
      icons.slice(0,6).forEach(it=>{
        const s=document.createElement('span');
        s.className='calIcon'+(it.end?' endDay':'');
        s.textContent=it.icon;
        s.title=it.t.title+(it.end?'（最後一天）':'')+'　點擊前往任務';
        s.onmouseenter=()=>catSay(it.icon+' '+it.t.title+(it.end?'（最後一天）':''), 2600);
        s.onclick=e=>{ e.stopPropagation(); jumpToTask(it.t); };
        ir.appendChild(s);
      });
      c.appendChild(ir);
    }
    const pills=items.filter(it=>it.kind!=='periodIcon');
    pills.slice(0,5).forEach(it=>{
      const p=document.createElement('span');
      p.className='calPill '+it.cls;
      p.textContent=it.label;
      p.title=it.label+(it.t?'\n（點擊直接前往）':'');
      p.onmouseenter=()=>catSay(it.label, 2600);   // 字被截掉？貓咪唸全名給你聽
      if (it.t) p.onclick=e=>{ e.stopPropagation(); jumpToTask(it.t); };
      c.appendChild(p);
    });
    if (pills.length>5){
      const p=document.createElement('span'); p.className='calPill more';
      p.textContent='+'+(pills.length-5); c.appendChild(p);
    }
    c.onclick=()=>{ calSel=iso; renderCalendar(); };
    return c;
  };
  if (calRoll){
    // 📆 接下來：第一排＝本週，共 5 週（跨月的日子標 M/D）
    const rs=new Date(); rs.setHours(0,0,0,0); rs.setDate(rs.getDate()-rs.getDay()+calRollOff*7);
    for (let i=0;i<35;i++){
      const dd=addDays(rs,i);
      const label=(dd.getDate()===1||i===0) ? (dd.getMonth()+1)+'/'+dd.getDate() : dd.getDate();
      grid.appendChild(mkCell(toISO(dd), label));
    }
  } else {
    const startW=new Date(calY,calM,1).getDay();
    const daysInM=new Date(calY,calM+1,0).getDate();
    const prevDays=new Date(calY,calM,0).getDate();
    for (let i=0;i<startW;i++){
      const c=document.createElement('div'); c.className='calCell dim';
      c.innerHTML=`<div class="dnum">${prevDays-startW+1+i}</div>`;
      grid.appendChild(c);
    }
    for (let d=1;d<=daysInM;d++){
      const iso=toISO(new Date(calY,calM,d));
      if (mobRangeKeep(iso)) grid.appendChild(mkCell(iso, d));   // 📱 手機可切 月/週/日 範圍
    }
  }
  if (!calRoll) card.appendChild(mkMobRange(renderCalendar));
  grid.classList.toggle('gridMode', isMobileShell() && mobCalRange==='grid' && !calRoll);   // 📱 格狀月曆模式
  bindSwipeX(grid, ()=>next.onclick(), ()=>prev.onclick());   // 📱 左滑＝下個月（接下來模式＝下一週）
  card.appendChild(grid);
  wrap.appendChild(card);

  if (calSel){
    const d=fromISO(calSel);
    const list=document.createElement('div');
    list.className='calDayList';
    const h=document.createElement('h3');
    h.textContent=`${d.getMonth()+1}/${d.getDate()}（週${WD[d.getDay()]}）`
      + (calMode==='plan' ? ' 到期／該催的' : ' 實際完成的');
    list.appendChild(h);
    const items=(byDate[calSel]||[]);
    if (!items.length){
      const e=document.createElement('div'); e.className='empty';
      e.textContent = calMode==='plan' ? '這天沒有到期的任務喵🐾' : '這天沒有完成紀錄喵🐾';
      list.appendChild(e);
    } else items.forEach(it=>{
      if (it.kind==='doneRow' || it.kind==='doneSub'){
        const d2=document.createElement('div'); d2.className='task';
        const tl=document.createElement('div'); tl.className='title';
        tl.textContent=it.label;
        d2.appendChild(tl);
        list.appendChild(d2);
      } else list.appendChild(taskCard(it.t));
    });
    wrap.appendChild(list);
  }
}

/* ───────── 回傳追蹤（獨立區域） ───────── */
const ROSTER_KEY='taskInbox.rosters';
const TRACKER_KEY='taskInbox.trackers';
let rosters=[], trackers=[];
function loadTrack(){
  try{ rosters=JSON.parse(localStorage.getItem(ROSTER_KEY))||[]; }catch(e){ rosters=[]; }
  try{ trackers=JSON.parse(localStorage.getItem(TRACKER_KEY))||[]; }catch(e){ trackers=[]; }
  rosters.forEach(r=>{
    if(!r.space) r.space='work';
    r.members.forEach(m=>{
      if(!Array.isArray(m.pbIds)) m.pbIds=[];      // v34：成員可綁電話簿聯絡人
      if(m.disabled===undefined) m.disabled=false; // v34.1：成員可停用
    });
  });
  // 舊追蹤項目補類別（從標題＋名單名稱自動判斷）、補編號與退出狀態
  trackers.forEach(t=>{
    if (!t.space) t.space='work';
    if (t.cat===undefined) t.cat='其他';
    if (t.numbered===undefined) t.numbered=false;
    if (!t.doneWord) t.doneWord='回傳';

/* 可搜尋的聯絡人選擇器（漸進揭露：一開始只給最多 2 個「跟這一列相關」的推薦，
   其他的打關鍵字才出現——選項一多人就選不下去，先猜你要誰、猜不到再讓你找）
   清單只在元件內重繪，中文輸入不會被打斷 */
function mkContactPicker(sp, excludeIds, onPick, onClose, hint){
  const box=document.createElement('div');
  box.style.cssText='display:flex;flex-direction:column;gap:6px;max-width:380px;padding:6px 0;';
  const inp=document.createElement('input'); inp.className='miniInput';
  inp.placeholder='🔍 打幾個字搜尋（姓名/學校/職稱/電話）…';
  const list=document.createElement('div');
  list.style.cssText='display:flex;gap:4px;flex-wrap:wrap;align-items:center;';
  const score=x=>{   // 跟這一列名字的相關度：0=完全相符、1=部分相符、2=無關
    if (!hint) return 2;
    if (x.name===hint || x.school===hint) return 0;
    if (hint.includes(x.name) || x.name.includes(hint)
      || (x.school && (hint.includes(x.school) || x.school.includes(hint)))) return 1;
    return 2;
  };
  const mkTag=x=>{
    const b=document.createElement('span'); b.className='memberTag';
    b.textContent=x.name+(x.school?'（'+x.school.slice(0,8)+'）':'');
    b.title=(x.role?x.role+'｜':'')+(x.phone||'')+(x.email?'｜'+x.email:'');
    b.onclick=()=>onPick(x);
    list.appendChild(b);
  };
  const mkNote=t=>{
    const e=document.createElement('span'); e.style.cssText='font-size:12.5px;color:var(--sub);';
    e.textContent=t; list.appendChild(e);
  };
  const draw=()=>{
    list.innerHTML='';
    const q=inp.value.trim();
    const all=pbook.filter(x=>(x.space||'work')===sp && !excludeIds.includes(x.id));
    if (!pbook.length){ mkNote('電話簿是空的，先去 📞 電話簿加人'); }
    else if (q){
      const cands=all.filter(x=>((x.name||'')+' '+(x.school||'')+' '+(x.role||'')+' '+(x.phone||'')+' '+(x.email||'')).includes(q));
      if (!cands.length) mkNote('沒有符合的聯絡人');
      cands.sort((a,b)=>score(a)-score(b)).slice(0,8).forEach(mkTag);
      if (cands.length>8) mkNote('…還有 '+(cands.length-8)+' 位，再多打幾個字');
    } else {
      // 未輸入＝只給推薦（跟這一列名字/學校相關的，最多 2 位），其餘用搜尋叫出來
      const sug=all.filter(x=>score(x)<2).sort((a,b)=>score(a)-score(b)).slice(0,2);
      if (sug.length){ mkNote('推薦：'); sug.forEach(mkTag); }
      const rest=all.length-sug.length;
      if (rest>0) mkNote((sug.length?'其他 ':'共 ')+rest+' 位——上面打字搜尋');
    }
    const cx=document.createElement('span'); cx.className='memberTag'; cx.textContent='✕ 關閉';
    cx.onclick=onClose;
    list.appendChild(cx);
  };
  inp.addEventListener('input', e=>{ if(!e.isComposing) draw(); });
  inp.addEventListener('compositionend', draw);
  box.append(inp,list);
  draw();
  setTimeout(()=>inp.focus(),0);
  return box;
}

function rosterFields(r){

/* 貼上名單解析：一行一個名字；含 Tab（從Excel多欄複製）時第一欄=名字、其餘=補充資訊 */
function parseRosterPaste(text, headerOn){
  const lines=text.split(/\r?\n/).map(l=>l.replace(/\s+$/,'')).filter(l=>l.trim());
  const hasTab=lines.some(l=>l.includes('\t'));
  if (hasTab){
    const rows=lines.map(l=>l.split('\t').map(c=>c.trim()));
    let headers=null, body=rows;
    if (headerOn && rows.length>1){ headers=rows[0]; body=rows.slice(1); }
    return body.map(r=>{
      const extra={};
      if (headers) headers.slice(1).forEach((h,i)=>{ if(h&&r[i+1]) extra[h]=r[i+1]; });
      else r.slice(1).forEach((c,i)=>{ if(c) extra['資訊'+(i+1)]=c; });
      return {id:uid(), name:r[0], extra};
    }).filter(m=>m.name);
  }
  return lines.map(l=>({id:uid(), name:l.trim(), extra:{}}));
}
/* 📥 名單也能像電話簿一樣用檔案匯入：第一列=標題列（第一欄是名字），一列一位成員 */
function rosterImportFile(f){
  const r=new FileReader();
  r.onload=()=>{
    const d=decodeUpload(r.result);
    if (d.xlsx){ catSay('這是 .xlsx 檔喵！請在 Excel 另存成「CSV」再上傳',3800,'alarmed'); return; }
    if (d.bad>3){ catSay('這個檔的編碼讀出來是亂碼喵…另存「CSV UTF-8」再試一次',3800,'alarmed'); return; }
    const rows = d.text.includes('\t')
      ? d.text.split(/\r?\n/).filter(l=>l.trim()).map(l=>l.split('\t').map(c=>c.trim()))
      : parseCSV(d.text);
    if (rows.length<2){ catSay('讀不到成員喵…第一列要是標題列（第一欄=名字），下面每列一位',4000,'alarmed'); return; }
    const headers=rows[0];
    const members=rows.slice(1).filter(r2=>r2[0]&&String(r2[0]).trim()).map(r2=>{
      const extra={};
      headers.slice(1).forEach((h,i)=>{ if(h&&r2[i+1]) extra[String(h).trim()]=r2[i+1]; });
      return {id:uid(), name:String(r2[0]).trim(), extra, pbIds:[], disabled:false};
    });
    if (!members.length){ catSay('讀不到成員喵…檢查一下第一欄有沒有名字',3600,'alarmed'); return; }
    const base=f.name.replace(/\.(csv|tsv|txt)$/i,'');
    let name=base, k=2;
    while (rosters.some(x=>x.name===name)) name=base+'('+(k++)+')';
    const fields=[...new Set(members.flatMap(m=>Object.keys(m.extra)))];
    rosters.unshift({id:uid(), name, members, fields, space:settings.space});
    uiTrk.tab='roster'; uiTrk.openRoster=rosters[0].id;
    saveTrack(); renderTracker();
    catSay('名單「'+name+'」匯入 '+members.length+' 位喵！要改名點名單籤旁的表格直接改',3600,'happy');
  };
  r.readAsArrayBuffer(f);
}
