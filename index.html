      const tr=document.createElement('tr');
      const tdN=document.createElement('td');
      const nIn=document.createElement('input'); nIn.className='cellInput'; nIn.value=m.name;
      nIn.onchange=()=>{
        const nv=nIn.value.trim();
        if (!nv){ nIn.value=m.name; return; }
        m.name=nv;
        trackers.forEach(trk=>trk.rows.forEach(row=>{ if(row.memberId===m.id) row.name=nv; }));
        saveTrack(); renderTracker();
      };
      tdN.appendChild(nIn); tr.appendChild(tdN);
      fields.forEach(f=>{
        const td=document.createElement('td');
        const ci=document.createElement('input'); ci.className='cellInput';
        ci.value=(m.extra||{})[f]||''; ci.placeholder='…';
        ci.onchange=()=>{
          m.extra=m.extra||{};
          const v=ci.value.trim();
          if (v) m.extra[f]=v; else delete m.extra[f];
          saveTrack();
        };
        td.appendChild(ci); tr.appendChild(td);
      });
      // 📞 成員綁聯絡人（追蹤項目的預設來源）
      const tdP=document.createElement('td'); tdP.style.whiteSpace='normal';
      tdP.appendChild(mkPbLinksBox(m, openR.space||'work', m.name, 'rm:'+m.id, null));
      tr.appendChild(tdP);
      const op=document.createElement('td'); op.style.whiteSpace='nowrap';
      const vw=document.createElement('button'); vw.className='qbtn'; vw.textContent='🔍';
      vw.title='看這位成員在所有追蹤裡的狀況';
      if (uiTrk.viewMember===m.id){ vw.style.background='var(--accent)'; vw.style.color='#fff'; }
      vw.onclick=()=>{ uiTrk.viewMember = uiTrk.viewMember===m.id?null:m.id; renderTracker(); };
      vw.title='看這位成員在所有追蹤裡的狀況（直接展開在下面）';
      op.appendChild(vw);
      // 🚫 停用：留在名單但變灰，建追蹤時預設不帶入（成員版的「退出計畫」）
      const dis=document.createElement('button'); dis.className='qbtn';
      if (m.disabled){
        dis.textContent='↩ 啟用'; dis.title='恢復這位成員（建追蹤時會列入）';
      } else {
        dis.textContent='🚫'; dis.title='停用：留在名單但變灰，建追蹤時預設不帶入（可隨時恢復）';
      }
      dis.onclick=()=>{
        m.disabled=!m.disabled; saveTrack(); renderTracker();
        catSay(m.disabled?'「'+m.name+'」停用了——還在名單裡，建追蹤不會帶到喵':'「'+m.name+'」恢復了喵！',2600);
      };
      op.appendChild(dis);
      const rm=document.createElement('button'); rm.className='qbtn';
      if (uiTrk.delPending==='mem:'+m.id){
        rm.textContent='確定移除？'; rm.style.cssText='background:var(--red);color:var(--on-red,#fff);';
        rm.onclick=()=>{ openR.members=openR.members.filter(x=>x.id!==m.id); uiTrk.delPending=null; saveTrack(); renderTracker(); };
      } else {
        rm.textContent='🗑'; rm.title='移除成員（再點一次確認）';
        rm.onclick=()=>{
          uiTrk.delPending='mem:'+m.id; clearTimeout(uiTrk.delTimer);
          uiTrk.delTimer=setTimeout(()=>{uiTrk.delPending=null; renderTracker();},3000);
          renderTracker();
        };
      }
      op.appendChild(rm);
      tr.appendChild(op);
      if (m.disabled) tr.className='rSkip';   // 停用＝整列灰
      body.appendChild(tr);
      // 🔍 總覽直接展開在這一列下面（看得到變化）
      if (uiTrk.viewMember===m.id){
        const tr2=document.createElement('tr');
        const td2=document.createElement('td'); td2.colSpan=fields.length+3;
        td2.appendChild(buildMemberOverview(m));
        tr2.appendChild(td2);
        body.appendChild(tr2);
      }
    });
    tb.appendChild(body);
    tw.appendChild(tb);
    rc.appendChild(tw);

    // 🔍 成員追蹤狀況總覽（v34.1 起直接展開在該成員列下方，不再掉到大表最底看不到）
    function buildMemberOverview(vm){
      const sum=document.createElement('div');
      sum.className='pickerRow';
      sum.style.cssText+='flex-direction:column;align-items:stretch;gap:4px;margin:0;';
      const rel=trackers.filter(trk=>trk.rows.some(r=>r.memberId===vm.id));
      const pend=rel.filter(trk=>{
        const r=trk.rows.find(x=>x.memberId===vm.id);
        return !r.done && !r.skipped;
      }).length;
      const h=document.createElement('div');
      h.style.cssText='font-weight:700;font-size:13.5px;';
      h.textContent='🔍 '+vm.name+' 的追蹤狀況'+(rel.length?`（${pend} 件未回傳／共 ${rel.length} 件）`:'');
      sum.appendChild(h);
      if (!rel.length){
        const e=document.createElement('div'); e.className='empty';
        e.textContent='目前沒有任何追蹤項目包含這位成員喵';
        sum.appendChild(e);
      }
      rel.forEach(trk=>{
        const w2=trk.doneWord||'回傳';
        const row=trk.rows.find(r=>r.memberId===vm.id);
        const line=document.createElement('div');
        line.style.cssText='font-size:13.5px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;';
        if (row.skipped){
          line.innerHTML='<span style="color:var(--gray)">🚫</span> <span style="color:var(--sub);text-decoration:line-through">'+esc(trk.title)+'</span>'
            +'<span style="font-size:12.5px;color:var(--sub)">已退出追蹤</span>';
          sum.appendChild(line);
          return;
        }
        if (row.done){
          line.innerHTML='<span style="color:var(--green)">✓</span> '+esc(trk.title)
            +'<span style="color:var(--green);font-size:12.5px">已'+esc(w2)+' '+(row.doneAt?fmtDate(fromISO(row.doneAt)):'')+'</span>';
        } else {
          const ed=effDue(trk,row);
          const n=ed?daysUntil(fromISO(ed)):null;
          const over=n!==null&&n<0;
          line.innerHTML='<span style="color:var(--orange)">⏳</span> '+esc(trk.title)
            +'<span style="font-size:12.5px;color:'+(over?'var(--red)':'var(--sub)')+';'+(over?'font-weight:700;':'')+'">'
            +(ed ? (over?'已逾期 '+(-n)+' 天（'+fmtDate(fromISO(ed))+'）':'期限 '+fmtDate(fromISO(ed))+'（剩 '+n+' 天）') : '無期限')
            +(row.due?'・個別期限':'')+'</span>'
            +(row.note?'<span style="font-size:12.5px;color:var(--sub)">📝 '+esc(row.note)+'</span>':'');
        }
        sum.appendChild(line);
      });
      return sum;
    }

    // 📦 這份名單參與的追蹤（點了直接跳到那張追蹤卡）
    const usedBy=trackers.filter(t=>t.rosterId===openR.id && !t.archived);
    if (usedBy.length){
      const ub=document.createElement('div');
      ub.style.cssText='display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:10px;font-size:12.5px;';
      const lb=document.createElement('span'); lb.style.color='var(--sub)'; lb.textContent='📦 參與的追蹤：';
      ub.appendChild(lb);
      usedBy.forEach(trk=>{
        const act=trk.rows.filter(r=>!r.skipped);
        const done=act.filter(r=>r.done).length;
        const c=document.createElement('span');
        c.className='memberTag '+colorClass(trk.cat||'其他');
        c.textContent=trk.title+'（'+done+'/'+act.length+'）';
        c.title='點擊跳到這張追蹤卡';
        c.onclick=()=>{
          uiTrk.tab='trk'; uiTrk.collapsed.delete(trk.id); renderTracker();
          setTimeout(()=>{ const el=document.getElementById('trk_'+trk.id);
            if (el){ el.scrollIntoView({behavior:'smooth', block:'start'}); el.style.outline='2px solid var(--accent)';
              setTimeout(()=>{ el.style.outline=''; },1800); } },0);
        };
        ub.appendChild(c);
      });
      rc.appendChild(ub);
    }
    const foot=document.createElement('div');
    foot.style.cssText='display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:10px;';
    const ai=document.createElement('input'); ai.className='miniInput'; ai.style.width='210px';
    ai.placeholder='加新成員：輸入名字按 Enter';
    ai.onkeydown=e=>{ if(e.key==='Enter'&&ai.value.trim()){ openR.members.push({id:uid(),name:ai.value.trim(),extra:{}}); saveTrack(); renderTracker(); } };
    foot.appendChild(ai);
    const qc=document.createElement('button'); qc.className='qbtn'; qc.textContent='📦 用這份名單建追蹤';
    qc.onclick=()=>{
      uiTrk.tab='trk';   // 建追蹤＝作業，切到追蹤分頁
      uiTrk.newTracker=true;
      uiTrk.ntRoster=openR.id;
      uiTrk.ntSel=new Set(openR.members.filter(m=>!m.disabled).map(m=>m.id));
      uiTrk.ntCat=defaultTrkCat(openR);
      renderTracker();
    };
    foot.appendChild(qc);
    const sp2=document.createElement('span'); sp2.style.flex='1'; foot.appendChild(sp2);
    const dr=document.createElement('button'); dr.className='qbtn';
    if (uiTrk.delPending==='roster:'+openR.id){
      dr.textContent='確定刪除名單？'; dr.style.cssText='background:var(--red);color:var(--on-red,#fff);';
      dr.onclick=()=>{ rosters=rosters.filter(x=>x.id!==openR.id); uiTrk.openRoster=null; uiTrk.delPending=null; saveTrack(); renderTracker(); };
    } else {
      dr.textContent='🗑 刪除名單';
      dr.onclick=()=>{ uiTrk.delPending='roster:'+openR.id; clearTimeout(uiTrk.delTimer);
        uiTrk.delTimer=setTimeout(()=>{uiTrk.delPending=null; renderTracker();},3000); renderTracker(); };
    }
    foot.appendChild(dr);
    rc.appendChild(foot);
  }
  wrap.appendChild(rc);
  return;   // 📇 名單分頁到此為止（追蹤列表在另一個分頁）
  }

  /* ── 追蹤項目 ── */
  const th=document.createElement('div'); th.className='trkHead'; th.style.margin='16px 2px 8px';
  th.innerHTML='<span class="tTitle">📦 追蹤項目</span><span class="spacer"></span>';
  const addT=document.createElement('button'); addT.className='ghostBtn';
  addT.textContent= uiTrk.newTracker ? '收起' : '＋ 新增追蹤';
  addT.onclick=()=>{
    uiTrk.newTracker=!uiTrk.newTracker;
    const vr=rosters.filter(r=>spaceMatch(r.space));
    if (uiTrk.newTracker && vr.length && !vr.find(r=>r.id===uiTrk.ntRoster)){
      uiTrk.ntRoster=vr[0].id;
      uiTrk.ntSel=new Set(vr[0].members.filter(m=>!m.disabled).map(m=>m.id));
      uiTrk.ntCat=defaultTrkCat(vr[0]);
    }
    renderTracker();
  };
  th.appendChild(addT);
  wrap.appendChild(th);
  // 💡 概念說明只在需要時出現（沒有追蹤、或正在新增）——老手每天看同一行字很吵
  if (!visTrackers.length || uiTrk.newTracker){
    const lg=document.createElement('div');
    lg.className='calLegend'; lg.style.cssText+='text-align:left;margin:0 2px 8px;';
    lg.textContent='💡 名單＝可重複使用的清單；追蹤項目＝用名單建立的勾選任務。名單建好後要按「＋ 新增追蹤」（或名單下方的「用這份名單建追蹤」）才會出現在下面。';
    wrap.appendChild(lg);
  }

  if (uiTrk.newTracker){
    const f=document.createElement('div'); f.className='trkCard';
    if (!visRosters.length){
      f.innerHTML='<div class="empty">要先有名單才能建追蹤喵，先到上面「＋ 新增名單」</div>';
    } else {
      // 標題/完成用詞存進 uiTrk——表單重繪（換名單/類別/對象）時才不會被清空
      const fld=(lab,el)=>{ const d=document.createElement('span'); d.className='fField';
        const l=document.createElement('span'); l.className='fLab'; l.textContent=lab; d.append(l,el); return d; };
      const ti=document.createElement('input'); ti.className='miniInput'; ti.style.width='260px';
      ti.placeholder='例：回條收齊、費用繳交';
      ti.value=uiTrk.ntTitle;
      ti.oninput=()=>{ uiTrk.ntTitle=ti.value; };
      const dwI=document.createElement('input'); dwI.className='miniInput'; dwI.style.width='150px';
      dwI.placeholder='預設：回傳';
      dwI.title='勾選完成時顯示的動詞，例：回傳／繳交／發布／完成';
      dwI.value=uiTrk.ntDW;
      dwI.oninput=()=>{ uiTrk.ntDW=dwI.value; };
      const tRow=document.createElement('div'); tRow.className='fRow';
      tRow.append(fld('追蹤什麼＊',ti), fld('完成用詞',dwI));
      f.appendChild(tRow);
      const rrow=document.createElement('div');
      rrow.style.cssText='display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px;';
      rrow.appendChild(mkLbl('名單：'));
      visRosters.forEach(r=>{
        const c=document.createElement('span'); c.className='memberTag'+(uiTrk.ntRoster===r.id?' on':'');
        c.textContent=(inAllView()?spaceIcon(r.space)+' ':'')+r.name;
        c.onclick=()=>{
          uiTrk.ntRoster=r.id;
          uiTrk.ntSel=new Set(r.members.filter(m=>!m.disabled).map(m=>m.id));
          uiTrk.ntCat=defaultTrkCat(r);
          renderTracker();
        };
        rrow.appendChild(c);
      });
      f.appendChild(rrow);
      const roSel=visRosters.find(r=>r.id===uiTrk.ntRoster);
      // 類別（依名單所屬空間，自動判斷、可點選改）
      const crow=document.createElement('div');
      crow.style.cssText='display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px;';
      crow.appendChild(mkLbl('類別：'));
      catsForSpace(roSel?roSel.space:'work').map(c=>c.name).forEach(cn=>{
        const cc=document.createElement('span');
        cc.className='memberTag'+(uiTrk.ntCat===cn?' on':'');
        cc.textContent=cn;
        cc.onclick=()=>{ uiTrk.ntCat=cn; renderTracker(); };
        crow.appendChild(cc);
      });
      f.appendChild(crow);
      const ro=roSel;
      if (ro){
        const mrow=document.createElement('div');
        mrow.style.cssText='display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px;';
        mrow.appendChild(mkLbl('對象：'));
        const active=ro.members.filter(m=>!m.disabled);
        const all=document.createElement('span');
        all.className='memberTag'+(uiTrk.ntSel.size===active.length && active.length>0 ?' on':'');
        all.textContent='✓ 全選';
        all.title='全選（🚫 停用中的成員不會被選進來）';
        all.onclick=()=>{
          uiTrk.ntSel = uiTrk.ntSel.size===active.length ? new Set() : new Set(active.map(m=>m.id));
          renderTracker();
        };
        mrow.appendChild(all);
        ro.members.forEach(m=>{
          const c=document.createElement('span'); c.className='memberTag'+(uiTrk.ntSel.has(m.id)?' on':'');
          c.textContent=(m.disabled?'🚫 ':'')+m.name;
          if (m.disabled){ c.style.opacity='.5'; c.title='這位在名單中已停用（仍可手動勾選帶入）'; }
          c.onclick=()=>{ uiTrk.ntSel.has(m.id)?uiTrk.ntSel.delete(m.id):uiTrk.ntSel.add(m.id); renderTracker(); };
          mrow.appendChild(c);
        });
        f.appendChild(mrow);
      }
      const drow=document.createElement('div');
      drow.style.cssText='display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px;';
      drow.appendChild(mkLbl('統一期限：'));
      drow.appendChild(buildDuePicker(uiTrk.ntDue, iso=>{ uiTrk.ntDue=iso; renderTracker(); }));
      f.appendChild(drow);
      const hint=document.createElement('div'); hint.className='empty';
      hint.textContent='建立後可以在表格裡對個別對象另外設期限';
      f.appendChild(hint);
      const ok=document.createElement('button'); ok.className='btnAdd'; ok.style.marginTop='6px'; ok.textContent='建立追蹤';
      ok.onclick=()=>{
        const title=ti.value.trim(); if(!title||!ro||!uiTrk.ntSel.size) return;
        const rows=ro.members.filter(m=>uiTrk.ntSel.has(m.id))
          .map((m,i)=>({memberId:m.id, name:m.name, due:null, done:false, doneAt:null, note:'', num:i+1, skipped:false,
            pbIds:(m.pbIds||[]).map(l=>({id:l.id, tag:l.tag||null}))}));   // 聯絡人預設從名單帶入（之後可改，不反寫）
        const cat=uiTrk.ntCat||defaultTrkCat(ro);
        trackers.unshift({id:uid(), title, cat, rosterId:ro.id, due:uiTrk.ntDue, note:'',
          doneWord:dwI.value.trim()||'回傳',
          space:ro.space||'work', numbered:false, rows, created:toISO(new Date())});
        uiTrk.newTracker=false; uiTrk.ntDue=null; uiTrk.ntTitle=''; uiTrk.ntDW='';
        saveTrack(); renderTracker();
        catSay('追蹤建好了！'+rows.length+' 個對象，回傳了就打勾喵',2600,'happy');
      };
      f.appendChild(ok);
    }
    wrap.appendChild(f);
  }

  if (!visTrackers.length && !uiTrk.newTracker){
    const e=document.createElement('div'); e.className='empty';
    e.textContent='還沒有追蹤項目喵🐾 建好名單後按「＋ 新增追蹤」';
    wrap.appendChild(e);
  }
  // 類別篩選列
  if (visTrackers.length){
    const fr=document.createElement('div');
    fr.style.cssText='display:flex;gap:6px;flex-wrap:wrap;margin:0 2px 10px;';
    const catsInUse=[...new Set(visTrackers.map(t=>t.cat||'其他'))];
    if (uiTrk.trkFilter!=='全部' && !catsInUse.includes(uiTrk.trkFilter)) uiTrk.trkFilter='全部';
    ['全部',...catsInUse].forEach(c=>{
      const b=document.createElement('span');
      b.className='memberTag'+(uiTrk.trkFilter===c?' on':'');
      const n=c==='全部'?visTrackers.length:visTrackers.filter(t=>(t.cat||'其他')===c).length;
      b.textContent=c+'（'+n+'）';
      b.onclick=()=>{ uiTrk.trkFilter=c; renderTracker(); };
      fr.appendChild(b);
    });
    wrap.appendChild(fr);
  }
  if (visTrackers.length){
    const bar=document.createElement('div'); bar.style.cssText='margin:0 2px 10px;';
    bar.appendChild(mkSearchBox('trkSearch','🔍 搜尋追蹤／對象名字…',()=>uiTrk.q,v=>uiTrk.q=v,renderTracker));
    wrap.appendChild(bar);
  }
  const tq=uiTrk.q.trim();
  visTrackers
    .filter(t=>uiTrk.trkFilter==='全部'||(t.cat||'其他')===uiTrk.trkFilter)
    .filter(t=>!tq || ((t.title||'')+' '+(t.cat||'')+' '+(t.note||'')).includes(tq)
      || t.rows.some(r=>r.name.includes(tq)))
    .forEach(trk=>wrap.appendChild(trackerCard(trk)));
}

function trackerCard(trk){
  const dw=trk.doneWord||'回傳';
  const card=document.createElement('div'); card.className='trkCard';
  card.id='trk_'+trk.id;   // 名單卡的「參與的追蹤」跳轉用
  const activeRows=trk.rows.filter(r=>!r.skipped);
  const done=activeRows.filter(r=>r.done).length, total=activeRows.length;
  const skippedCount=trk.rows.length-activeRows.length;
  const collapsed=uiTrk.collapsed.has(trk.id);
  const roster=rosters.find(r=>r.id===trk.rosterId);

  const head=document.createElement('div'); head.className='trkHead';
  if (uiTrk.editTitle===trk.id){
    const ti=document.createElement('input'); ti.className='miniInput';
    ti.style.width='220px'; ti.value=trk.title;
    const commit=()=>{
      const v=ti.value.trim();
      if (v) trk.title=v;
      uiTrk.editTitle=null; saveTrack(); renderTracker();
      if (v) catSay('標題改好了喵！',1800,'happy');
    };
    ti.onkeydown=e=>{ if(e.key==='Enter') commit(); if(e.key==='Escape'){ uiTrk.editTitle=null; renderTracker(); } };
    ti.onblur=commit;
    head.appendChild(ti);
    setTimeout(()=>{ ti.focus(); ti.select(); },0);
  } else {
    const tt=document.createElement('span'); tt.className='tTitle'; tt.style.cursor='pointer';
    tt.textContent=(collapsed?'▸ ':'▾ ')+trk.title;
    tt.title='點擊收合/展開';
    tt.onclick=()=>{ collapsed?uiTrk.collapsed.delete(trk.id):uiTrk.collapsed.add(trk.id); renderTracker(); };
    head.appendChild(tt);
    const edT=document.createElement('button'); edT.className='qbtn subtleBtn'; edT.innerHTML=riIcon('pencil');
    edT.title='編輯標題';
    edT.onclick=()=>{ uiTrk.editTitle=trk.id; renderTracker(); };
    head.appendChild(edT);
  }
  if (inAllView()){
    const sc=document.createElement('span'); sc.className='chip type';
    sc.textContent=spaceIcon(trk.space);
    sc.title=(trk.space||'work')==='life'?'私人空間':'工作空間';
    head.appendChild(sc);
  }
  // 專案分類標籤：點擊展開選單（原本的循環切換不直觀）
  const cchip=document.createElement('span');
  cchip.className='chip clickable '+colorClass(trk.cat||'其他');
  cchip.textContent='📂 '+(trk.cat||'其他');
  cchip.title='點擊選擇所屬專案';
  cchip.onclick=()=>{ uiTrk.catPick = uiTrk.catPick===trk.id ? null : trk.id; renderTracker(); };
  head.appendChild(cchip);
  if (roster){
    const rchip=document.createElement('span'); rchip.className='chip type';
    rchip.textContent='📋 '+roster.name; head.appendChild(rchip);
  }
  const overdueCnt=trk.rows.filter(r=>!r.done&&!r.skipped&&effDue(trk,r)&&daysUntil(fromISO(effDue(trk,r)))<0).length;
  const dchip=document.createElement('span');
  dchip.className='chip clickable '+(trk.due ? (daysUntil(fromISO(trk.due))<0&&done<total?'urg-red':'urg-orange') : 'urg-gray');
  dchip.textContent= trk.due ? '📅 統一期限 '+fmtDate(fromISO(trk.due)) : '📅 無統一期限';
  dchip.title='點擊修改統一期限';
  dchip.onclick=()=>{ uiTrk.trkDueOpen = uiTrk.trkDueOpen===trk.id?null:trk.id; renderTracker(); };
  head.appendChild(dchip);
  if (overdueCnt&&done<total){
    const oc=document.createElement('span'); oc.className='chip urg-red';
    oc.textContent='⏰ '+overdueCnt+' 個逾期未'+dw; head.appendChild(oc);
  }
  if (done===total&&total>0){
    const okc=document.createElement('span'); okc.className='chip subProg';
    okc.textContent='🎉 全部'+dw; head.appendChild(okc);
  }
  const hs=document.createElement('span'); hs.className='spacer'; head.appendChild(hs);
  // ⚙ 表格設定：編號欄／聯絡欄／匯總欄位收進同一個抽屜——標題列從 5 顆功能鈕減到 3 顆
  const cfgB=document.createElement('button'); cfgB.className='qbtn subtleBtn';
  const cfgOn=trk.numbered||trk.contactCol;
  cfgB.textContent='⚙'+(cfgOn?'•':'');
  cfgB.title='表格設定：編號欄／聯絡欄／匯總欄位'+(cfgOn?'（有開啟中的功能）':'');
  if (uiTrk.cfgOpen===trk.id){ cfgB.classList.remove('subtleBtn'); cfgB.style.background='var(--accent)'; cfgB.style.color='#fff'; }
  cfgB.onclick=()=>{ uiTrk.cfgOpen = uiTrk.cfgOpen===trk.id?null:trk.id; renderTracker(); };
  head.appendChild(cfgB);
  const arcBtn=document.createElement('button'); arcBtn.className='qbtn subtleBtn';
  arcBtn.innerHTML=riIcon('archive'); arcBtn.title='封存這張追蹤表（收進 🗄️ 封存頁的專案資料夾）';
  arcBtn.onclick=()=>{
    trk.archived=true; saveTrack(); renderTracker();
    catSay('「'+trk.title+'」收進封存資料夾了喵',2200);
  };
  head.appendChild(arcBtn);
  const numBtn=document.createElement('button'); numBtn.className='qbtn';
  numBtn.textContent = trk.numbered ? '🔢 編號欄：開' : '🔢 編號欄';
  numBtn.title='顯示/隱藏編號欄（開了之後可輸入數字或按住 ⠿ 拖曳調整順序）';
  if (trk.numbered){ numBtn.style.background='var(--accent)'; numBtn.style.color='#fff'; }
  numBtn.onclick=()=>{ trk.numbered=!trk.numbered; saveTrack(); renderTracker(); };
  // 📞 聯絡欄：把每一列連到電話簿的人（開啟時自動把名字/學校相符的連起來）
  const pbBtn=document.createElement('button'); pbBtn.className='qbtn';
  pbBtn.textContent= trk.contactCol ? '📞 聯絡欄：開' : '📞 聯絡欄';
  pbBtn.title='多一欄「聯絡人」：每列連到電話簿——直接看電話、一鍵複製、點名字跳到電話簿';
  if (trk.contactCol){ pbBtn.style.background='var(--accent)'; pbBtn.style.color='#fff'; }
  pbBtn.onclick=()=>{
    trk.contactCol=!trk.contactCol;
    if (trk.contactCol){
      let n=0;
      const ro2=rosters.find(x=>x.id===trk.rosterId);
      trk.rows.forEach(r=>{
        if (r.pbIds && r.pbIds.length) return;
        // 1️⃣ 名單成員有綁聯絡人 → 直接帶入預設
        const mem=ro2 && ro2.members.find(m2=>m2.id===r.memberId);
        if (mem && (mem.pbIds||[]).length){
          r.pbIds=mem.pbIds.map(l=>({id:l.id, tag:l.tag||null})); n++; return;
        }
        // 2️⃣ 沒綁的再用名字/學校相符猜（唯一相符才連）
        const cands=pbook.filter(p=>(p.space||'work')===(trk.space||'work')
          && (p.name===r.name || (p.school && p.school===r.name)));
        if (cands.length===1){ r.pbIds=[{id:cands[0].id}]; n++; }
      });
      catSay(n ? '聯絡欄開好了，名字對得上的自動連上 '+n+' 位喵！可以按 ＋ 再加人、⚙ 加匯總欄位'
               : '聯絡欄開好了！每列按「＋選聯絡人」挑電話簿裡的人喵', 3800, 'happy');
    }
    saveTrack(); renderTracker();
  };
  const del=document.createElement('button'); del.className='qbtn';
  if (!(uiTrk.delPending==='trk:'+trk.id)) del.classList.add('subtleBtn');
  if (uiTrk.delPending==='trk:'+trk.id){
    del.textContent='確定刪除？'; del.style.cssText='background:var(--red);color:var(--on-red,#fff);';
    del.onclick=()=>{ trackers=trackers.filter(x=>x.id!==trk.id); uiTrk.delPending=null; saveTrack(); renderTracker(); };
  } else {
    del.innerHTML=riIcon('trash'); del.title='刪除（再點一次確認）';
    del.onclick=()=>{ uiTrk.delPending='trk:'+trk.id; clearTimeout(uiTrk.delTimer);
      uiTrk.delTimer=setTimeout(()=>{uiTrk.delPending=null; renderTracker();},3000); renderTracker(); };
  }
  head.appendChild(del);
  card.appendChild(head);

  const pw=document.createElement('div'); pw.className='progressWrap';
  pw.innerHTML='<div class="progressBar"><div class="progressFill" style="width:'
    +(total?Math.round(done/total*100):0)+'%"></div></div><span class="progressText">'
    +done+'/'+total+' 已'+dw+'</span>';
  card.appendChild(pw);

  // ⚙ 表格設定抽屜：編號欄／聯絡欄／匯總欄位（功能照舊，只是收納起來）
  if (uiTrk.cfgOpen===trk.id){
    const row=document.createElement('div'); row.className='pickerRow';
    row.appendChild(mkLbl('⚙ 表格設定：'));
    row.appendChild(numBtn);
    row.appendChild(pbBtn);
    if (trk.contactCol){
      const colB=document.createElement('button'); colB.className='qbtn';
      colB.textContent='📊 匯總欄位'+(trk.pbCols.length?'（'+trk.pbCols.length+'）':'');
      colB.title='幫聯絡欄加子欄位：欄名自己取（例：地址），內容連到電話簿的電話/Email/備註/單位/職稱——電話簿改了這裡自動跟著變';
      if (uiTrk.pbColAdd===trk.id){ colB.style.background='var(--accent)'; colB.style.color='#fff'; }
      colB.onclick=()=>{ uiTrk.pbColAdd = uiTrk.pbColAdd===trk.id?null:trk.id; renderTracker(); };
      row.appendChild(colB);
    }
    card.appendChild(row);
  }

  if (uiTrk.trkDueOpen===trk.id){
    const row=document.createElement('div'); row.className='pickerRow';
    row.appendChild(mkLbl('統一期限：'));
    row.appendChild(buildDuePicker(trk.due, iso=>{ trk.due=iso; uiTrk.trkDueOpen=null; saveTrack(); renderTracker(); }));
    card.appendChild(row);
  }

  if (uiTrk.catPick===trk.id){
    const row=document.createElement('div'); row.className='pickerRow';
    row.appendChild(mkLbl('所屬專案：'));
    catsForSpace(trk.space).filter(c=>c.vis!=='hideAll').forEach(c=>{
      const b=document.createElement('span');
      b.className='memberTag '+((trk.cat||'其他')===c.name?'on ':'')+colorClass(c.name);
      b.textContent=c.name;
      b.onclick=()=>{
        trk.cat=c.name; uiTrk.catPick=null; saveTrack(); renderTracker();
        catSay('「'+trk.title.slice(0,12)+'」掛到 📂 '+c.name+' 了喵！',2400,'happy');
      };
      row.appendChild(b);
    });
    card.appendChild(row);
  }

  // ⚙ 匯總欄位管理：現有欄（點✕移除）＋新增（欄名自取、連到電話簿哪個欄）
  if (uiTrk.pbColAdd===trk.id && trk.contactCol){
    const row=document.createElement('div'); row.className='pickerRow';
    row.appendChild(mkLbl('📞 匯總欄位——內容從電話簿即時帶入，電話簿改了這裡跟著變：'));
    trk.pbCols.forEach((c2,i2)=>{
      const b=document.createElement('span'); b.className='memberTag on';
      b.textContent=c2.label+'（連到'+PB_FIELDS[c2.field]+'）✕';
      b.title='點擊移除這個欄位（電話簿資料不受影響）';
      b.onclick=()=>{ trk.pbCols.splice(i2,1); saveTrack(); renderTracker(); };
      row.appendChild(b);
    });
    const nameI=document.createElement('input'); nameI.className='miniInput'; nameI.style.width='120px';
    nameI.placeholder='欄名（例：地址）';
    const fSel=document.createElement('select'); fSel.className='miniSelect';
    Object.entries(PB_FIELDS).forEach(([v,l])=>{
      const o=document.createElement('option'); o.value=v; o.textContent='連到：'+l;
      fSel.appendChild(o);
    });
    const addB=document.createElement('button'); addB.className='qbtn'; addB.textContent='＋加欄位';
    addB.style.cssText='background:var(--accent);color:var(--on-accent,#fff);';
    const commitCol=()=>{
      const label=nameI.value.trim()||PB_FIELDS[fSel.value];
      trk.pbCols.push({id:uid(), label, field:fSel.value});
      nameI.value='';
      saveTrack(); renderTracker();
      catSay('「'+label+'」欄加好了！內容直接從電話簿帶過來喵',3000,'happy');
    };
    addB.onclick=commitCol;
    nameI.onkeydown=e=>{ if(e.key==='Enter') commitCol(); };
    row.append(nameI,fSel,addB);
    card.appendChild(row);
  }

  if (!collapsed){
    const tw=document.createElement('div'); tw.className='tblWrap';
    const tb=document.createElement('table');
    tb.className='trkTable trkMain'+(trk.numbered?' hasNum':'');   // 手機凍結欄：主表凍 勾選＋名字（有編號欄只凍第一欄）
    tb.innerHTML='<thead><tr>'+(trk.numbered?'<th>#</th>':'')+'<th>'+esc(dw)+'</th><th>名字</th>'
      +(trk.contactCol ? '<th>📞 聯絡人</th>'+trk.pbCols.map(c=>'<th>'+esc(c.label)+'</th>').join('') : '')
      +'<th>期限</th><th>'+esc(dw)+'日</th><th>備註</th><th></th></tr></thead>';
    const body=document.createElement('tbody');
    let dragKey=null;
    const rowsSorted=[...trk.rows].sort((a,b)=>(a.num||0)-(b.num||0));
    rowsSorted.forEach(row=>{
      const tr=document.createElement('tr');
      const ed=effDue(trk,row);
      const over=!row.done&&!row.skipped&&ed&&daysUntil(fromISO(ed))<0;
      if (row.skipped) tr.className='rSkip';
      else if (row.done) tr.className='rDone';
      else if (over) tr.className='rOver';
      // 編號欄（拖曳把手＋可輸入）
      if (trk.numbered){
        const cN=document.createElement('td'); cN.style.whiteSpace='nowrap';
        const hd=document.createElement('span'); hd.textContent='⠿'; hd.className='trkDragHd';
        hd.title='按住拖曳調整順序';
        hd.style.cssText='cursor:grab;color:var(--sub);margin-right:2px;user-select:none;';
        hd.onmousedown=()=>{ tr.draggable=true; };
        const nin=document.createElement('input'); nin.type='number'; nin.className='cellInput numIn'; nin.value=row.num;
        nin.onchange=()=>{
          const v=parseInt(nin.value);
          if (!isNaN(v)){ row.num=v; saveTrack(); renderTracker(); }
          else nin.value=row.num;
        };
        cN.append(hd,nin); tr.appendChild(cN);
        tr.ondragstart=e=>{ dragKey=row.memberId; e.dataTransfer.effectAllowed='move'; };
        tr.ondragend=()=>{ tr.draggable=false; };
        tr.ondragover=e=>e.preventDefault();
        tr.ondrop=e=>{
          e.preventDefault();
          if (dragKey===null||dragKey===row.memberId) return;
          const arr=[...trk.rows].sort((a,b)=>(a.num||0)-(b.num||0));
          const from=arr.findIndex(r=>r.memberId===dragKey);
          const to=arr.findIndex(r=>r.memberId===row.memberId);
          const [mv]=arr.splice(from,1);
          arr.splice(to,0,mv);
          arr.forEach((r,i)=>r.num=i+1);   // 拖曳後整份重新編 1..n
          dragKey=null; saveTrack(); renderTracker();
        };
      }
      const c1=document.createElement('td');
      const cb=document.createElement('input'); cb.type='checkbox'; cb.checked=!!row.done;
      cb.disabled=!!row.skipped;
      cb.onchange=()=>{
        row.done=cb.checked; row.doneAt=cb.checked?toISO(new Date()):null;
        saveTrack();
        const act=trk.rows.filter(x=>!x.skipped);
        if (act.length && act.every(x=>x.done)) catSay('「'+trk.title+'」全部'+dw+'了喵！🎉',2800,'happy');
        renderTracker();
      };
      c1.appendChild(cb); tr.appendChild(c1);
      const c2=document.createElement('td');
      const ns=document.createElement('span'); ns.className='rName'; ns.textContent=row.name;
      const mem=roster&&roster.members.find(m=>m.id===row.memberId);
      if (mem&&Object.keys(mem.extra||{}).length){
        ns.title=Object.entries(mem.extra).map(([k,v])=>k+'：'+v).join('\n');
        ns.style.cssText+='border-bottom:1px dotted var(--sub);cursor:help;';
      }
      c2.appendChild(ns); tr.appendChild(c2);
      // 📞 聯絡人欄（Notion 匯總式）：預設從名單帶入；此列自行改的人會標藍色（不反寫回名單）
      if (trk.contactCol){
        const cp=document.createElement('td'); cp.style.whiteSpace='normal';
        const pbKey=trk.id+':'+row.memberId;
        const memDef=roster && roster.members.find(m2=>m2.id===row.memberId);
        cp.appendChild(mkPbLinksBox(row, trk.space||'work', row.name, pbKey, memDef?(memDef.pbIds||[]):null));
        tr.appendChild(cp);
        // 匯總子欄位：每位聯絡人在電話簿的指定欄位（多位時掛名字前綴；電話簿改了這裡跟著變）
        trk.pbCols.forEach(col=>{
          const td2=document.createElement('td');
          td2.style.cssText='font-size:12.5px;';
          const ps=(row.pbIds||[]).map(l=>pbook.find(x=>x.id===l.id)).filter(Boolean);
          ps.forEach(p=>{
            const v=p[col.field];
            if (!v) return;
            const line=document.createElement('div');
            line.style.cssText='display:flex;align-items:center;gap:3px;white-space:nowrap;line-height:1.8;';
            line.appendChild(document.createTextNode((ps.length>1?p.name.slice(0,5)+'：':'')+v));
            if (col.field==='phone'||col.field==='email'){
              const cb4=document.createElement('button'); cb4.className='qbtn';
              cb4.style.cssText='padding:1px 5px;min-height:0;';
              cb4.innerHTML=riIcon('copy'); cb4.title='複製';
              cb4.onclick=()=>copyText(v,(col.field==='phone'?'電話':'Email')+'複製好了！');
              line.appendChild(cb4);
            }
            td2.appendChild(line);
          });
          if (!td2.childNodes.length){ td2.textContent='—'; td2.style.color='var(--faint)'; }
          tr.appendChild(td2);
        });
      }
      const c3=document.createElement('td'); c3.className='rDue';
      c3.style.cursor='pointer'; c3.title='點擊設定這一位的個別期限';
      const key=trk.id+':'+row.memberId;
      if (row.due){
        c3.textContent=fmtDate(fromISO(row.due))+'（個別）';
        if (!over){ c3.style.color='var(--accent)'; c3.style.fontWeight='600'; }
      } else if (trk.due){
        c3.textContent=fmtDate(fromISO(trk.due))+'（統一）';
      } else {
        c3.textContent='—（點我設定）';
      }
      c3.onclick=()=>{ uiTrk.rowDueOpen = uiTrk.rowDueOpen===key?null:key; renderTracker(); };
      tr.appendChild(c3);
      const c4=document.createElement('td'); c4.className='rDate';
      if (row.done){
        // 回傳日可修改（補打昨天的勾就把日期改回去）
        c4.append('✓ ');
        const dEdit=document.createElement('input');
        dEdit.type='date'; dEdit.className='cellInput';
        dEdit.style.cssText='width:118px;min-width:0;font-size:12.5px;color:var(--green);';
        dEdit.title='回傳日期（可修改，例如今天補勾昨天收到的）';
        dEdit.value=row.doneAt||'';
        dEdit.onchange=()=>{ if(dEdit.value){ row.doneAt=dEdit.value; saveTrack(); renderTracker(); } };
        c4.appendChild(dEdit);
      }
      tr.appendChild(c4);
      const c5=document.createElement('td');
      const ni=document.createElement('input'); ni.className='miniInput'; ni.style.width='150px';
      ni.placeholder='…'; ni.value=row.note||'';
      ni.onchange=()=>{ row.note=ni.value; saveTrack(); };
      c5.appendChild(ni); tr.appendChild(c5);
      // 🚫 退出計畫（保留編號，不再列入追蹤）
      const c6=document.createElement('td'); c6.style.whiteSpace='nowrap';
      const sk=document.createElement('button'); sk.className='qbtn';
      if (row.skipped){
        sk.textContent='↩ 恢復'; sk.title='恢復追蹤這一位';
        sk.onclick=()=>{ row.skipped=false; saveTrack(); renderTracker(); };
      } else {
        sk.textContent='🚫'; sk.title='退出計畫：保留編號，但不再列入追蹤與催繳';
        sk.onclick=()=>{ row.skipped=true; saveTrack(); renderTracker(); };
      }
      c6.appendChild(sk); tr.appendChild(c6);
      body.appendChild(tr);
      if (uiTrk.rowDueOpen===key){
        const tr2=document.createElement('tr');
        const td=document.createElement('td'); td.colSpan=6+(trk.numbered?1:0)+(trk.contactCol?1+trk.pbCols.length:0);
        const prow=document.createElement('div'); prow.className='pickerRow';
        prow.appendChild(mkLbl(row.name+' 的個別期限（選「無期限」＝回到統一期限）：'));
        prow.appendChild(buildDuePicker(row.due, iso=>{ row.due=iso; uiTrk.rowDueOpen=null; saveTrack(); renderTracker(); }));
        td.appendChild(prow); tr2.appendChild(td); body.appendChild(tr2);
      }
    });
    tb.appendChild(body); tw.appendChild(tb); card.appendChild(tw);

    // 底部總計
    const ft=document.createElement('div');
    ft.style.cssText='font-size:12.5px;color:var(--sub);margin-top:8px;';
    ft.textContent='共 '+trk.rows.length+' 個項目｜✅ 已'+dw+' '+done+'｜⏳ 追蹤中 '+(total-done)
      +(skippedCount?('｜🚫 已退出 '+skippedCount+'（編號保留）'):'');
    card.appendChild(ft);

    if (roster){
      const missing=roster.members.filter(m=>!trk.rows.some(r=>r.memberId===m.id));
      if (missing.length){
        const ad=document.createElement('div');
        ad.style.cssText='display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px;';
        ad.appendChild(mkLbl('＋補進追蹤：'));
        missing.forEach(m=>{
          const c=document.createElement('span'); c.className='memberTag'; c.textContent=m.name;
          c.onclick=()=>{
            const nextNum=trk.rows.length?Math.max(...trk.rows.map(r=>r.num||0))+1:1;
            trk.rows.push({memberId:m.id,name:m.name,due:null,done:false,doneAt:null,note:'',num:nextNum,skipped:false});
            saveTrack(); renderTracker();
          };
          ad.appendChild(c);
        });
        card.appendChild(ad);
      }
    }
    const note=document.createElement('textarea'); note.className='trkNote';
    note.placeholder='這個追蹤的備註…（自動儲存）'; note.value=trk.note||'';
    note.onchange=()=>{ trk.note=note.value; saveTrack(); };
    card.appendChild(note);
  }
  return card;
}

/* ───────── 總日曆（任務＋回傳追蹤，圖層可開關） ───────── */
let bcY, bcM, bcSel=null;
const BIGCAL_LAYERS=[
  ['taskDue','📋 任務期限'],
  ['wait','⏳ 等回覆追蹤日'],
  ['trkDue','📦 回傳追蹤期限'],
  ['done','✅ 已完成/已回傳'],
];
/* 📊 時間軸（甘特）：每列一個任務，橫條可拖曳（移動）或抓邊緣（改起訖日） */
function renderGantt(card){
  const items=spaceTasks().filter(t=>t.status!=='done' && t.due)
    .sort((a,b)=>(a.start||a.due).localeCompare(b.start||b.due));
  const g=document.createElement('div'); g.className='ganttWrap';
  const W=G_DAYS*G_COL, todayISO=toISO(new Date());
  const gh=document.createElement('div'); gh.className='gHead'; gh.style.width=(150+W)+'px';
  gh.innerHTML='<div class="gPad"></div>';
  for (let i=0;i<G_DAYS;i++){
    const d=addDays(gStart,i);
    const c=document.createElement('div'); c.className='gDay';
    c.textContent=(d.getDay()===1||i===0)?(d.getMonth()+1)+'/'+d.getDate():d.getDate();
    if (toISO(d)===todayISO) c.style.cssText='color:var(--red);font-weight:700;';
    gh.appendChild(c);
  }
  g.appendChild(gh);
  if (!items.length){
    const e=document.createElement('div'); e.className='empty';
    e.textContent='目前空間沒有帶期限的進行中任務喵🐾（時間軸只顯示有設期限的任務）';
    g.appendChild(e);
  }
  const todayIdx=Math.round((fromISO(todayISO)-gStart)/86400000);
  items.forEach(t=>{
    const row=document.createElement('div'); row.className='gRow'; row.style.width=(150+W)+'px';
    const lb=document.createElement('div'); lb.className='gLabel';
    lb.textContent=(t.status==='waiting'?'⏳ ':'')+t.title; lb.title=t.title;
    row.appendChild(lb);
    const tr=document.createElement('div'); tr.className='gTrack'; tr.style.width=W+'px';
    if (todayIdx>=0 && todayIdx<G_DAYS){
      const tl=document.createElement('div'); tl.className='gToday'; tl.style.left=(todayIdx*G_COL+G_COL/2)+'px';
      tr.appendChild(tl);
    }
    const sD=fromISO(t.start||t.due), eD=fromISO(t.due);
    const si=Math.round((sD-gStart)/86400000), ei=Math.round((eD-gStart)/86400000);
    if (ei>=0 && si<G_DAYS){
      const csi=Math.max(si,0), cei=Math.min(ei,G_DAYS-1);
      const bar=document.createElement('div');
      bar.className='gBar '+colorClass(t.cat);
      bar.style.left=(csi*G_COL)+'px';
      bar.style.width=((cei-csi+1)*G_COL-4)+'px';
      bar.textContent=(t.icon||(t.start?'📌':'📅'))+' '+t.title;
      bar.title=t.title+'　'+(t.start?fmtDate(sD)+' → ':'')+fmtDate(eD)
        +(inAllView()?'':'\n整條拖曳＝平移；抓左右邊緣＝改開始日/期限');
      if (!inAllView()){
        let drag=null;
        bar.onpointerdown=ev=>{
          const r=bar.getBoundingClientRect();
          const edge=Math.max(10, Math.min(16, r.width/3));   // 邊緣判定區：夠寬好抓，窄條不搶走整條拖曳
          const mode= ev.clientX-r.left<edge ? 'l' : r.right-ev.clientX<edge ? 'r' : 'm';
          drag={x0:ev.clientX, mode, left0:parseFloat(bar.style.left), w0:parseFloat(bar.style.width)};
          bar.setPointerCapture(ev.pointerId); bar.classList.add('dragging');
        };
        bar.onpointermove=ev=>{
          if (!drag) return;
          const dd=Math.round((ev.clientX-drag.x0)/G_COL);
          if (drag.mode==='m') bar.style.left=(drag.left0+dd*G_COL)+'px';
          else if (drag.mode==='r') bar.style.width=Math.max(G_COL-4, drag.w0+dd*G_COL)+'px';
          else { bar.style.left=(drag.left0+dd*G_COL)+'px'; bar.style.width=Math.max(G_COL-4, drag.w0-dd*G_COL)+'px'; }
        };
        bar.onpointercancel=()=>{ drag=null; renderBigCal(); };
        bar.onpointerup=ev=>{
          if (!drag) return;
          const dd=Math.round((ev.clientX-drag.x0)/G_COL);
          const mode=drag.mode; drag=null; bar.classList.remove('dragging');
          if (!dd){ renderBigCal(); return; }
          if (mode==='m'){
            t.due=toISO(addDays(fromISO(t.due),dd));
            if (t.start) t.start=toISO(addDays(fromISO(t.start),dd));
          } else if (mode==='r'){
            let nd=addDays(fromISO(t.due),dd);
            const st=fromISO(t.start||t.due);
            if (nd<st) nd=st;
            t.due=toISO(nd);
          } else {
            let ns=addDays(fromISO(t.start||t.due),dd);
            const en=fromISO(t.due);
            if (ns>en) ns=en;
            t.start = toISO(ns)===t.due ? null : toISO(ns);
          }
          if (t.start && !t.icon) t.icon='📌';
          save(); renderBigCal();
          catSay('「'+t.title.slice(0,12)+'」改成 '+(t.start?fmtDate(fromISO(t.start))+' → ':'')+fmtDate(fromISO(t.due))+' 了喵！',3000,'happy');
        };
      }
      tr.appendChild(bar);
    }
    row.appendChild(tr);
    g.appendChild(row);
  });
  card.appendChild(g);
}
let bigView='cal';           // 'cal' 月曆 | 'roll' 接下來（本週起 5 週） | 'gantt' 時間軸
let bcRollOff=0;             // 「接下來」視圖位移（一次一週，0=本週）
let gStart=null;             // 時間軸視窗起點（週一）
const G_DAYS=42, G_COL=26;   // 6 週視窗、每天 26px
function ganttMonday(d){ const x=new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate()-((x.getDay()+6)%7)); return x; }
function renderBigCal(){
  const wrap=document.getElementById('bigcalPane');

  if (!gStart) gStart=ganttMonday(new Date());

  title.textContent=`${bcY}年 ${bcM+1}月`;
  const next=document.createElement('button'); next.textContent='›';
  next.onclick=()=>{ bcM++; if(bcM>11){bcM=0;bcY++;} renderBigCal(); };
  const tb=document.createElement('button'); tb.className='todayBtn'; tb.textContent='回今天';
  tb.onclick=()=>{ const n=new Date(); bcY=n.getFullYear(); bcM=n.getMonth(); bcSel=toISO(n); renderBigCal(); };
  if (bigView==='gantt'){   // 時間軸模式：‹ › 改成一次移一週
    prev.onclick=()=>{ gStart=addDays(gStart,-7); renderBigCal(); };
    next.onclick=()=>{ gStart=addDays(gStart,7); renderBigCal(); };
    tb.onclick=()=>{ gStart=ganttMonday(new Date()); renderBigCal(); };
    title.textContent=fmtDate(gStart)+' – '+fmtDate(addDays(gStart,G_DAYS-1));
  }
  if (bigView==='roll'){    // 接下來模式：本週當第一排、共 5 週；‹ › 一次移一週
    const rs=new Date(); rs.setHours(0,0,0,0); rs.setDate(rs.getDate()-rs.getDay()+bcRollOff*7);
    prev.onclick=()=>{ bcRollOff--; renderBigCal(); };
    next.onclick=()=>{ bcRollOff++; renderBigCal(); };
    tb.onclick=()=>{ bcRollOff=0; bcSel=toISO(new Date()); renderBigCal(); };
    title.textContent=fmtDate(rs)+' – '+fmtDate(addDays(rs,34));

  if (L.trkDue){
    trackers.filter(t=>spaceMatch(t.space) && !t.archived).forEach(trk=>{

      pending.filter(r=>r.due).forEach(r=>

    trackers.filter(t=>spaceMatch(t.space) && !t.archived).forEach(trk=>trk.rows.forEach(r=>{

  // 月曆格（月檢視與「接下來」共用同一個格子產生器）

  const todayISO=toISO(new Date());

    wdT.textContent='週'+WD[fromISO(iso).getDay()];   // 手機週列表用，桌機隱藏
    dn.appendChild(wdT);
    c.appendChild(dn);
    const items=byDate[iso]||[];
    // 點項目直接跳到本尊（任務→捲動亮框、追蹤→展開亮框）；點空白處＝選這天看清單
    const jumpTo=it=>{
      if (it.t){ jumpToTask(it.t); return; }
      if (it.trk){ uiTrk.tab='trk'; uiTrk.collapsed.delete(it.trk.id); module='track'; render();

    }
    c.onclick=()=>{ bcSel=iso; renderBigCal(); };

  };
  if (bigView==='roll'){
    // 📆 接下來：第一排＝本週，往後共 5 週（跨月的日子標 M/D）

  } else {

    const daysInM=new Date(bcY,bcM+1,0).getDate();

    for (let i=0;i<startW;i++){
      const c=document.createElement('div'); c.className='calCell dim';

  grid.classList.toggle('gridMode', isMobileShell() && mobCalRange==='grid' && bigView==='cal');   // 📱 格狀月曆模式
  bindSwipeX(grid, ()=>next.onclick(), ()=>prev.onclick());   // 📱 左滑＝下個月（接下來模式＝下一週）

  // 選中日期的內容

      const d2=document.createElement('div'); d2.className='task';

      if (it.kind==='trkDue'){

        dt.textContent='未'+(it.trk.doneWord||'回傳')+'（'+pendNames.length+'）：'+pendNames.join('、');
        d2.appendChild(dt);
      } else if (it.kind==='rowDue'){
        tl.textContent='📦 '+it.trk.title+'：'+it.row.name+'（個別期限）';
        d2.appendChild(tl);
      } else {
        tl.textContent=it.label;
        d2.appendChild(tl);
      }
      list.appendChild(d2);
    });
    wrap.appendChild(list);
  }
}

const NOTE_COLORS=['n-yellow','n-pink','n-blue','n-green','n-purple'];

/* 便利貼 → 正式任務（自動分類/抓日期/括號變勾選清單） */
function noteToTask(n){
  if (inAllView()){ catSay('總覽模式不能立案喵～先切到工作或私人空間',3000); return; }
  const c=classify(n.text);
  const nt={
    id:uid(), text:n.text, title:extractTitle(n.text), cat:c.cat, type:c.type,
    due:c.due?toISO(c.due):null, tags:[...c.tags], who:c.who||null,
    subs:detectSubs(n.text).map(x=>({name:x, done:false, doneAt:null})),

    status:'todo', followUp:null, created:toISO(new Date()), doneAt:null
  };
  tasks.unshift(nt);
  save();
  n.link={type:'task', title:extractTitle(n.text)};
  saveNotes(); renderNotes();
  toast('✅ 便利貼已轉成任務「'+nt.title.slice(0,16)+'」','前往任務',()=>jumpToTask(nt));
}
function loadNotes(){
  try{ notes=JSON.parse(localStorage.getItem(NOTES_KEY))||[]; }catch(e){ notes=[]; }
  notes.forEach(n=>{ if(!n.space) n.space='work'; if(n.archived===undefined) n.archived=false;
    if(n.trashed===undefined) n.trashed=false; if(!n.size) n.size='s'; });
  // 垃圾桶自動清理：settings.noteTrashDays 天（0＝永不清）。settings 比 notes 先載入
  const keep=(settings && settings.noteTrashDays!==undefined) ? settings.noteTrashDays : 30;
  if (keep>0) notes=notes.filter(n=>!(n.trashed && n.trashedAt && daysUntil(fromISO(n.trashedAt))<-keep));
}
function saveNotes(){ localStorage.setItem(NOTES_KEY, JSON.stringify(notes)); }
/* 迷你 Markdown（Notion 式標準）——設定可開關（預設開）
   標題：# ## ###（#後面有沒有空格都可以）｜**粗體**｜*斜體*｜~~刪除線~~｜`程式碼`
   ``` 程式碼區塊｜- 清單｜1. 數字清單｜- [ ] / - [x] 勾選格｜> 引用｜--- 分隔線
   表格：| 欄A | 欄B | 一行一列，|---|---| 分隔線那行可寫可不寫 */
function mdInline(el, s){
  const re=/(`[^`]+`|\*\*[^*]+?\*\*|~~[^~]+?~~|\*[^*\s][^*]*?\*)/g;
  let last=0, m;
  while((m=re.exec(s))){
    if (m.index>last) linkify(el, s.slice(last, m.index));
    const tok=m[0];
    let node;
    if (tok.startsWith('`')){ node=document.createElement('code'); node.textContent=tok.slice(1,-1); }
    else if (tok.startsWith('**')){ node=document.createElement('b'); node.textContent=tok.slice(2,-2); mdInlineNest(node); }
    else if (tok.startsWith('~~')){ node=document.createElement('s'); node.textContent=tok.slice(2,-2); }
    else { node=document.createElement('i'); node.textContent=tok.slice(1,-1); }
    el.appendChild(node);
    last=m.index+tok.length;
  }
  if (last<s.length) linkify(el, s.slice(last));
}
/* 粗體裡面還能再包斜體/程式碼（例：**重點 *補充***） */
function mdInlineNest(node){
  const inner=node.textContent;
  if (/(`[^`]+`|\*[^*\s][^*]*?\*)/.test(inner)){ node.textContent=''; mdInline(node, inner); }
}
function mdIsTableRow(line){ const t=line.trim(); return t.startsWith('|') && t.length>1; }
function mdSplitRow(line){
  let t=line.trim();
  if (t.startsWith('|')) t=t.slice(1);
  if (t.endsWith('|')) t=t.slice(0,-1);
  return t.split('|').map(c=>c.trim());
}
function mdRender(el, text){
  const lines=String(text).split('\n');
  let inCode=false, pre=null;
  for (let li=0; li<lines.length; li++){
    const line=lines[li];
    if (line.trim().startsWith('```')){
      if (inCode){ inCode=false; pre=null; }
      else { inCode=true; pre=document.createElement('pre'); pre.className='mdPre'; el.appendChild(pre); }
      continue;
    }
    if (inCode){ pre.textContent+=line+'\n'; continue; }
    // 表格：連續的 | 開頭行收成一張表
    if (mdIsTableRow(line)){
      const rows=[];
      while (li<lines.length && mdIsTableRow(lines[li])){ rows.push(mdSplitRow(lines[li])); li++; }
      li--;   // for 迴圈還會 ++
      const hasSep = rows.length>1 && rows[1].every(c=>/^:?-{2,}:?$/.test(c||'-'));
      const wrapT=document.createElement('div'); wrapT.className='mdTableWrap';
      const tb=document.createElement('table'); tb.className='mdTable';
      rows.forEach((cells,ri)=>{
        if (hasSep && ri===1) return;                    // |---|---| 那行只是分隔線
        const tr=document.createElement('tr');
        cells.forEach(c=>{
          const td=document.createElement(ri===0?'th':'td');
          mdInline(td, c);
          tr.appendChild(td);
        });
        tb.appendChild(tr);
      });
      wrapT.appendChild(tb); el.appendChild(wrapT);
      continue;
    }
    // 分隔線
    if (/^\s*(---+|\*\*\*+|＿＿＿+)\s*$/.test(line)){ const hr=document.createElement('hr'); hr.className='mdHr'; el.appendChild(hr); continue; }
    const d=document.createElement('div');
    let s=line, mm;
    if ((mm=s.match(/^(#{1,3})\s*(.+)$/))){           // 標題：# ## ###（跟 Notion 一樣分三級；#後空格可省略）
      d.className='mdH'+mm[1].length; s=mm[2];
    }
    else if ((mm=s.match(/^>\s?(.*)$/))){ d.className='mdQuote'; s=mm[1]; }   // 引用
    else if ((mm=s.match(/^[-*]\s\[( |x|X)\]\s?(.*)$/))){                      // 勾選格（顯示用）
      s=(mm[1]===' '?'☐ ':'☑ ')+mm[2]; d.className='mdCheck';
      if (mm[1]!==' ') d.style.cssText='color:var(--sub);';
    }
    else if (/^[-*] /.test(s)){ s='• '+s.slice(2); }                           // 清單
    else if ((mm=s.match(/^(\d+)[.、]\s?(.*)$/)) && mm[2]){ s=mm[1]+'. '+mm[2]; }  // 數字清單（保留編號）
    if (!line.trim()){ d.innerHTML='&nbsp;'; }
    else mdInline(d, s);
    el.appendChild(d);
  }
}
function renderRich(el, text){ if (settings.md) mdRender(el, text); else linkify(el, text); }

/* 通用複製（成功/失敗都有明顯回饋）：先走新版剪貼簿 API，不行再退回舊招 */
function copyText(t, okMsg){
  const done=ok=>catSay(ok ? (okMsg||'複製好了！') : '複製失敗了…請手動選取', 2400, ok?'happy':'alarmed');
  const fallback=()=>{
    const ta=document.createElement('textarea'); ta.value=t;
    ta.style.cssText='position:fixed;left:-9999px;top:0;';
    document.body.appendChild(ta); ta.focus(); ta.select();
    let ok=false; try{ ok=document.execCommand('copy'); }catch(e){}
    ta.remove(); return ok;
  };
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(()=>done(true)).catch(()=>done(fallback()));
  } else done(fallback());
}
/* ⌨️ Enter 行為（⚙️ 設定 → 🧷 預設行為 可選，照個人習慣）：
   smart（預設）＝「丟進去」的框 Enter 送出、「寫內容」的編輯區 Enter 換行
   send  ＝所有框 Enter 都送出（Shift+Enter 換行）
   newline＝所有框 Enter 都換行（送出靠 Ctrl+Enter 或按鈕）
   每個框下都有看得見的提示，不用背 */
function enterMode(){ return (settings && settings.enterMode) || 'smart'; }
function bindEnterSave(el, fn){   // 丟入框（新增任務/貼便利貼）
  el.addEventListener('keydown', e=>{
    if (e.key!=='Enter') return;
    if (e.ctrlKey||e.metaKey){ e.preventDefault(); fn(); return; }   // Ctrl+Enter 永遠可送
    if (e.shiftKey) return;
    if (e.isComposing || e.keyCode===229) return;   // 輸入法組字中
    if (enterMode()==='newline') return;            // 換行派：Enter 就是換行
    e.preventDefault(); fn();
  });
}
function bindCtrlSave(el, fn){    // 編輯區（說明書/內文/手札/註解）
  el.addEventListener('keydown', e=>{
    if (e.key!=='Enter') return;
    if (e.ctrlKey||e.metaKey){ e.preventDefault(); fn(); return; }
    if (enterMode()==='send' && !e.shiftKey && !e.isComposing && e.keyCode!==229){
      e.preventDefault(); fn();   // 送出派：編輯區的 Enter 也直接存
    }
  });
}

}

/* 通用搜尋欄（重繪後自動保住游標；中文組字中不重繪，字才打得出來） */
function mkSearchBox(id, ph, getV, setV, rerender){
  const q=document.createElement('input'); q.className='miniInput'; q.id=id;
  q.style.width='170px'; q.placeholder=ph; q.value=getV();
  let t=null;
  const apply=()=>{
    const el=document.getElementById(id)||q;
    setV(el.value); rerender();
    const n=document.getElementById(id);
    if (n){ n.focus(); n.setSelectionRange(n.value.length, n.value.length); }
  };
  q.addEventListener('compositionend', ()=>{ clearTimeout(t); t=setTimeout(apply,60); });
  q.addEventListener('input', e=>{
    if (e.isComposing) return;   // 注音/拼音選字中先不動畫面
    clearTimeout(t); t=setTimeout(apply,120);
  });
  return q;
}

/* 文字裡的網址自動變成可點擊連結 */
function linkify(el, text){
  const re=/(https?:\/\/[^\s]+)/g;
  let last=0, m;
  while ((m=re.exec(text))){
    if (m.index>last) el.appendChild(document.createTextNode(text.slice(last,m.index)));
    const a=document.createElement('a');
    a.href=m[0]; a.textContent=m[0]; a.target='_blank'; a.rel='noopener';
    a.style.cssText='color:var(--blue);word-break:break-all;';
    el.appendChild(a);
    last=m.index+m[0].length;
  }
  el.appendChild(document.createTextNode(text.slice(last)));
}
function renderNotes(){
  const wrap=document.getElementById('notesPane');
  wrap.innerHTML='';
  if (inAllView()){
    const hint=document.createElement('div'); hint.className='calLegend';
    hint.style.cssText+='text-align:left;margin-bottom:10px;';
    hint.textContent='🌍 總覽模式：顯示工作＋私人的全部便利貼（🏢/🏠 標示來源）。要新增或轉任務，請先用左下按鈕切到其中一個空間。';
    wrap.appendChild(hint);
    renderNotesGrid(wrap);
    return;
  }
  const ic=document.createElement('div'); ic.className='inputCard';
  const ta=document.createElement('textarea');
  ta.style.cssText='width:100%;min-height:56px;border:none;outline:none;resize:vertical;font:inherit;font-size:15px;color:var(--ink);background:transparent;';
  ta.placeholder='隨手記點什麼…（Enter 直接貼上、Shift+Enter 換行；貼網址會自動變連結）';
  ta.value=notesDraft;                       // 切換頁面回來，打到一半的字還在
  ta.oninput=()=>{ notesDraft=ta.value; };
  const act=document.createElement('div'); act.className='inputActions';
  const tip=document.createElement('span'); tip.className='tip'; tip.textContent='臨時的事丟這裡，之後要變正式任務再搬去任務區喵';
  const add=document.createElement('button'); add.className='btnAdd'; add.textContent='貼上便利貼 📒';
  const addNote=()=>{
    const v=ta.value.trim(); if(!v) return;
    notes.unshift({id:uid(), text:v, color:NOTE_COLORS[notes.length%NOTE_COLORS.length],
      created:toISO(new Date()), space:settings.space, cat:null, size:'s', trashed:false});
    saveNotes(); ta.value=''; notesDraft='';
    catSay('記下來了喵～',1600); renderNotes();
  };
  add.onclick=addNote;
  ta.onkeydown=e=>{ if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)) addNote(); };
  bindEnterSave(ta, addNote);
  act.append(tip,add);
  ic.append(ta,act);
  wrap.appendChild(ic);

  renderNotesGrid(wrap);
}
function renderNotesGrid(wrap){
  let list=notes.filter(n=>spaceMatch(n.space) && !n.archived && !n.trashed);
  const allCount=list.length;
  if (allCount>0){
    const bar=document.createElement('div');
    bar.style.cssText='margin-bottom:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;';
    bar.appendChild(mkSearchBox('noteSearch','🔍 搜尋便利貼…',()=>notesQ,v=>notesQ=v,renderNotes));
    // 📂 專案篩選（有便利貼掛專案時才出現）
    const catsUsed=[...new Set(list.map(n=>n.cat).filter(Boolean))];
    if (catsUsed.length){
      ['全部',...catsUsed].forEach(cn=>{
        const c=document.createElement('span');
        c.className='memberTag'+(notesFilter===cn?' on':'')+(cn!=='全部'?' '+colorClass(cn):'');
        c.textContent=cn;
        c.onclick=()=>{ notesFilter=cn; renderNotes(); };
        bar.appendChild(c);
      });
      if (!catsUsed.includes(notesFilter) && notesFilter!=='全部') notesFilter='全部';
    }
    wrap.appendChild(bar);
  }
  if (notesFilter!=='全部') list=list.filter(n=>n.cat===notesFilter);
  if (notesQ.trim()) list=list.filter(n=>(n.text+' '+(n.cat||'')).includes(notesQ.trim()));
  if (!list.length && allCount>0){
    const e=document.createElement('div'); e.className='empty'; e.textContent='沒有符合的便利貼喵';
    wrap.appendChild(e); notesTrashSection(wrap); return;
  }
  if (!list.length){
    const e=document.createElement('div'); e.className='empty';
    e.textContent='還沒有便利貼喵🐾 想到什麼就丟上來';
    wrap.appendChild(e);
    notesTrashSection(wrap);
    return;
  }
  const stickies=list.filter(n=>n.mode!=='journal');
  const journals=list.filter(n=>n.mode==='journal');
  const grid=document.createElement('div'); grid.className='noteGrid';
  const buildCard=n=>{
    const journal = n.mode==='journal';
    const card=document.createElement('div');
    if (journal){
      card.className='journalCard';
    } else {
      card.className='stickyNote '+(n.color||'n-yellow')+(n.size==='m'?' szM':n.size==='l'?' szL':'');
      // 手動拉過的尺寸優先於 ⤢ 的三段預設
      if (n.w) card.style.width=n.w+'px';
      if (n.h) card.style.height=n.h+'px';
      // 抓右下角拉完＝記住新尺寸（只在右下角落下手才算，避免一般點擊誤存）
      card.addEventListener('pointerdown',e=>{
        const r=card.getBoundingClientRect();
        if (!(r.right-e.clientX<22 && r.bottom-e.clientY<22)) return;
        const up=()=>{
          window.removeEventListener('pointerup',up);
          window.removeEventListener('mouseup',up);
          setTimeout(()=>{
            const w=Math.round(card.offsetWidth), h=Math.round(card.offsetHeight);
            if (w>=170 && h>=84 && (n.w!==w || n.h!==h)){ n.w=w; n.h=h; saveNotes(); }
          },0);
        };
        window.addEventListener('pointerup',up);
        window.addEventListener('mouseup',up);
      });
    }
    card.dataset.nid=n.id;   // 反黑加註解用
    if (editingNote===n.id){
      const ed=document.createElement('textarea'); ed.value=n.text;
      // 編輯框跟著內容長高（不然長文只剩一小格，看起來像字縮水）
      const fit=()=>{ ed.style.height='auto'; ed.style.height=(ed.scrollHeight+4)+'px'; };
      ed.oninput=fit;
      const commit=()=>{
        if (editingNote!==n.id) return;
        editingNote=null;
        const v=ed.value.trim();
        if (v && v!==n.text){ n.text=v; n.updated=toISO(new Date()); }
        saveNotes(); renderNotes();
      };
      ed.onblur=commit;
      ed.onkeydown=e=>{
        if (e.key==='Enter'&&(e.ctrlKey||e.metaKey)) commit();
        if (e.key==='Escape'){ editingNote=null; renderNotes(); }
      };
      card.appendChild(ed);
      card.appendChild(editHint());   // 寫內容的編輯區：Enter=換行（規則直接顯示在框下）
      setTimeout(()=>{ ed.focus(); fit(); },0);
    } else {
      const tx=document.createElement('div'); tx.className='nText';
      tx.title='點擊文字直接編輯';
      if (journal && n.text){
        // 手札：第一行當標題粗顯，其餘走 Markdown
        const nl=n.text.indexOf('\n');
        const head=nl<0?n.text:n.text.slice(0,nl);
        const rest=nl<0?'':n.text.slice(nl+1);
        const ht=document.createElement('div'); ht.className='jTitle';
        ht.style.cssText='font-weight:700;font-size:16px;margin-bottom:4px;';
        ht.textContent=head.replace(/^#{1,3}\s*/,'');
        tx.appendChild(ht);
        if (rest.trim()) renderRich(tx, rest);
      } else {
        renderRich(tx, n.text);
      }
      tx.onclick=e=>{ if(e.target.tagName!=='A'){ editingNote=n.id; renderNotes(); } };
      card.appendChild(tx);
    }
    // 已轉任務／已貼到任務的標記
    if (n.link){
      const bd=document.createElement('div'); bd.className='nBadge';
      bd.textContent = n.link.type==='task' ? '✓ 已轉任務：'+n.link.title : '📎 已貼到：'+n.link.title;
      card.appendChild(bd);
    }
    // 「貼到任務」的任務選擇器
    if (attachingNote===n.id){
      const ap=document.createElement('div'); ap.className='nAttach';
      const cands=spaceTasks().filter(t=>t.status!=='done').slice(0,12);
      if (!cands.length){
        const e2=document.createElement('span'); e2.style.color='rgba(0,0,0,.4)';
        e2.textContent='目前空間沒有進行中的任務喵'; ap.appendChild(e2);
      }
      cands.forEach(t=>{
        const c=document.createElement('span'); c.className='memberTag'; c.textContent=t.title.slice(0,14);
        c.title=t.title;
        c.onclick=()=>{
          t.text=(t.text||'')+'\n\n📎 便利貼補充（'+fmtDate(new Date())+'）：\n'+n.text;
          save();
          n.link={type:'attached', title:t.title};
          attachingNote=null; saveNotes(); renderNotes();
          toast('✅ 已貼進「'+t.title.slice(0,14)+'」的內文','前往該任務',()=>jumpToTask(t));
        };

/* 共用：上傳檔案解碼（xlsx 偵測＋UTF-8/Big5/UTF-16 自動判斷，挑亂碼最少的） */
function decodeUpload(arrbuf){
  const bytes=new Uint8Array(arrbuf);
  if (bytes[0]===0x50 && bytes[1]===0x4B) return {xlsx:true, text:'', bad:0};   // PK = .xlsx（zip）
  const dec=enc=>{ try{ return new TextDecoder(enc).decode(arrbuf); }catch(e){ return null; } };
  const badN=s=> s===null ? Infinity : (s.match(/�/g)||[]).length;
  let text='';
  if (bytes[0]===0xFF && bytes[1]===0xFE) text=dec('utf-16le')||'';
  else if (bytes[0]===0xFE && bytes[1]===0xFF) text=dec('utf-16be')||'';
  else {
    const u8=dec('utf-8'), b5=dec('big5');
    text = (badN(u8)<=badN(b5) ? u8 : b5) || '';
  }
  text=text.replace(/^﻿/,'');
  return {xlsx:false, text, bad:(text.match(/�/g)||[]).length};
}
/* 匯入檔案（CSV/TSV；偵測 xlsx 並提示；結果顯示在畫面上） */
function pbImportFile(f){
  const r=new FileReader();
  r.onload=()=>{
    const d=decodeUpload(r.result);
    if (d.xlsx){
      uiPB.status={ok:false, msg:'「'+f.name+'」是 Excel 的 .xlsx 檔。請在 Excel 按「另存新檔」→ 存檔類型選「CSV (逗號分隔)」，再上傳那個 .csv 檔'};
      catSay('這是 .xlsx 檔喵！要先另存成 CSV 才能讀',3600,'alarmed');
      renderPhonebook(); return;
    }
    const text=d.text;
    if (d.bad > 3){
      uiPB.status={ok:false, msg:'「'+f.name+'」的文字編碼讀出來是亂碼，先不匯入（免得存進一堆火星文）。請在 Excel 另存新檔時選「CSV UTF-8 (逗號分隔)」再上傳一次'};
      catSay('這個檔的編碼讀不懂喵…換存成 CSV UTF-8 再來一次',3600,'alarmed');
      renderPhonebook(); return;
    }
    const rows = text.includes('\t')
      ? text.split(/\r?\n/).filter(l=>l.trim()).map(l=>l.split('\t').map(c=>c.trim()))
      : parseCSV(text);
    const ps=pbFromRows(rows);
    if (!ps.length){
      uiPB.status={ok:false, msg:'「'+f.name+'」裡讀不到聯絡人。請用範本格式：第一列是標題列、至少要有「姓名」欄'};
      catSay('檔案裡讀不到聯絡人喵…',3000,'alarmed');
    } else {
      const sp = inAllView() ? 'work' : settings.space;
      ps.forEach(p=>p.space=sp);
      pbook.push(...ps); savePB();
      uiPB.status={ok:true, msg:'成功匯入 '+ps.length+' 位聯絡人'};
      catSay('批量匯入 '+ps.length+' 位聯絡人喵！🎉',2800,'happy');
    }
    renderPhonebook();
  };
  r.onerror=()=>{ uiPB.status={ok:false, msg:'檔案讀取失敗，請再試一次'}; renderPhonebook(); };
  r.readAsArrayBuffer(f);
}

/* 簡易 CSV 解析（支援引號欄位） */
function parseCSV(text){
  const rows=[]; let row=[], cur='', inQ=false;
  for (let i=0;i<text.length;i++){
    const ch=text[i];
    if (inQ){
      if (ch==='"'){ if (text[i+1]==='"'){ cur+='"'; i++; } else inQ=false; }
      else cur+=ch;
    } else {
      if (ch==='"') inQ=true;
      else if (ch===','){ row.push(cur.trim()); cur=''; }
      else if (ch==='\n'||ch==='\r'){
        if (ch==='\r'&&text[i+1]==='\n') i++;
        row.push(cur.trim()); rows.push(row); row=[]; cur='';
      }
      else cur+=ch;
    }
  }
  if (cur!==''||row.length){ row.push(cur.trim()); rows.push(row); }
  return rows.filter(r=>r.some(c=>c));
}
function parsePBPaste(text){
  const lines=text.split(/\r?\n/).filter(l=>l.trim());
  if (!lines.length) return [];
  if (!lines[0].includes('\t'))
    return lines.map(l=>({id:uid(), name:l.trim(), school:'', phone:'', email:'', programs:[], note:''}));
  return pbFromRows(lines.map(l=>l.split('\t').map(c=>c.trim())));
}
function pbFromRows(rows){
  if (!rows.length) return [];
  const headers=rows[0]; const idx={extra:[]};
  headers.forEach((h,i)=>{
    if (idx.name===undefined && (/姓名|名字|窗口|承辦|聯絡人/.test(h) || /^(full ?name|name)$/i.test(h.trim()))) idx.name=i;
    else if (idx.role===undefined && (/職稱|職位|職務/.test(h) || /^(job ?title|title|position)$/i.test(h.trim()))) idx.role=i;
    else if (idx.school===undefined && (/學校|單位|機構|公司/.test(h) || /^(company|organi[sz]ation|org|department|dept)$/i.test(h.trim()))) idx.school=i;
    else if (idx.phone===undefined && (/電話|手機|分機/.test(h) || /^(phone|tel|telephone|mobile|cell)/i.test(h.trim()))) idx.phone=i;
    else if (idx.email===undefined && /mail|信箱/i.test(h)) idx.email=i;
    else if (idx.prog===undefined && /計畫|業務/.test(h)) idx.prog=i;
    else if (idx.note===undefined && /備註|note|memo/i.test(h)) idx.note=i;
    else idx.extra.push(i);
  });
  if (idx.name===undefined) idx.name=0;
  return rows.slice(1).map(r=>{
    const extraTxt=idx.extra.map(i=>r[i]?headers[i]+'：'+r[i]:'').filter(Boolean).join('；');
    return {
      id:uid(), name:r[idx.name]||'',
      role: idx.role!==undefined ? (r[idx.role]||'') : '',
      school: idx.school!==undefined ? (r[idx.school]||'') : '',
      phone: idx.phone!==undefined ? (r[idx.phone]||'') : '',
      email: idx.email!==undefined ? (r[idx.email]||'') : '',
      programs: (idx.prog!==undefined && r[idx.prog]) ? r[idx.prog].split(/[、,，\/\s]+/).filter(Boolean) : [],
      note: [idx.note!==undefined?(r[idx.note]||''):'', extraTxt].filter(Boolean).join('；')
    };
  }).filter(p=>p.name);
}
