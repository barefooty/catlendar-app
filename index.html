  if (!inAllView()) h.append(tplB,upB,upIn,pasteB,addB);
  top.appendChild(h);
  if (inAllView()){
    const hint=document.createElement('div'); hint.className='calLegend';
    hint.style.cssText+='text-align:left;margin-top:6px;';
    hint.textContent='🌍 總覽模式：顯示工作＋私人全部聯絡人（🏢/🏠 標示）。要新增或匯入請先切換空間。';
    top.appendChild(hint);
  }

  const bar=document.createElement('div');
  bar.style.cssText='display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px;';
  const q=mkSearchBox('pbSearch','🔍 搜尋姓名/學校/職稱/電話/Email…',()=>uiPB.q,v=>uiPB.q=v,renderPhonebook);
  q.style.width='210px';
  bar.appendChild(q);
  // 分組圖示切換（學校/公司/一般群組）
  const icBtn=document.createElement('span'); icBtn.className='memberTag';
  icBtn.textContent=(settings.pbIcon||'🏫')+' 圖示';
  icBtn.title='切換分組圖示：🏫 學校 → 🏢 公司 → 👥 群組';
  icBtn.onclick=()=>{
    const seq=['🏫','🏢','👥'];
    settings.pbIcon=seq[(seq.indexOf(settings.pbIcon||'🏫')+1)%seq.length];
    saveSettings(); renderPhonebook();
  };
  icBtn.classList.add('mobHide');   // 📱 手機只留搜尋：圖示切換/分類篩選/批量管理都收起（用搜尋更快）
  bar.appendChild(icBtn);
  ['全部',...new Set(curCats().map(c=>c.name))].forEach(cn=>{
    const c=document.createElement('span');
    c.className='memberTag mobHide'+(uiPB.filter===cn?' on':'');
    c.textContent=cn;
    c.onclick=()=>{ uiPB.filter=cn; renderPhonebook(); };
    bar.appendChild(c);
  });
  if (!inAllView()){
    const bm=document.createElement('span'); bm.className='memberTag mobHide'+(uiPB.batch?' on':'');
    bm.textContent='☑ 批量管理';
    bm.title='勾選多位聯絡人一次刪除（匯錯了整批清掉）';
    bm.onclick=()=>{ uiPB.batch=!uiPB.batch; uiPB.sel.clear(); if(uiPB.delPending==='batch')uiPB.delPending=null; renderPhonebook(); };
    bar.appendChild(bm);
  }
  top.appendChild(bar);

  // 匯入結果狀態列（成功綠色／失敗紅色，直接顯示原因）
  if (uiPB.status){
    const st=document.createElement('div');
    st.style.cssText='margin-top:8px;font-size:13.5px;font-weight:600;line-height:1.6;color:'
      +(uiPB.status.ok?'var(--green)':'var(--red)')+';';
    st.textContent=(uiPB.status.ok?'✅ ':'⚠️ ')+uiPB.status.msg;
    top.appendChild(st);
  }

  if (uiPB.pasteOpen){
    const ta=document.createElement('textarea'); ta.className='trkNote pasteArea';
    ta.placeholder='從 Excel 連標題列整塊複製貼上。認得的欄位：姓名/窗口/承辦、單位/學校、電話/分機、Email/信箱、計畫、備註（其他欄位會自動併進備註）';
    ta.addEventListener('click',()=>ta.classList.add('big'));
    ta.addEventListener('focus',()=>ta.classList.add('big'));
    const ok=document.createElement('button'); ok.className='btnAdd'; ok.style.marginTop='8px'; ok.textContent='匯入';
    ok.onclick=()=>{
      const ps=parsePBPaste(ta.value);
      if (!ps.length) return;
      pbook.push(...ps);
      uiPB.pasteOpen=false; savePB(); renderPhonebook();
      catSay('匯入 '+ps.length+' 位聯絡人喵！',2400,'happy');
    };
    top.append(ta,ok);
  }
  if (uiPB.newOpen){
    top.appendChild(pbForm({}, d=>{
      pbook.unshift({id:uid(), space:settings.space, ...d});
      uiPB.newOpen=false; savePB(); renderPhonebook();
      catSay('聯絡人存好了喵～',2000);
    }));
  }
  wrap.appendChild(top);

  const visPB=pbook.filter(p=>spaceMatch(p.space));
  let list=visPB.filter(p=> uiPB.filter==='全部' || (p.programs||[]).includes(uiPB.filter));
  const qq=uiPB.q.trim();
  if (qq) list=list.filter(p=>((p.name||'')+' '+(p.school||'')+' '+(p.role||'')+' '+(p.phone||'')+' '+(p.email||'')+' '+(p.note||'')+' '+(p.programs||[]).join(' ')).includes(qq));

  if (!visPB.length){
    const e=document.createElement('div'); e.className='empty';
    e.textContent='電話簿是空的喵🐾 按「＋新增聯絡人」，或把窗口清單從 Excel 整塊貼上匯入';
    wrap.appendChild(e); return;
  }
  if (!list.length){
    const e=document.createElement('div'); e.className='empty'; e.textContent='沒有符合的聯絡人喵';
    wrap.appendChild(e); return;
  }
  // ☑ 批量管理列：全選／刪除選取（兩段確認）
  if (uiPB.batch && !inAllView()){
    const bb=document.createElement('div'); bb.className='trkCard';
    bb.style.cssText+='border-color:var(--accent);';
    const r1=document.createElement('div');
    r1.style.cssText='display:flex;gap:8px;flex-wrap:wrap;align-items:center;';
    const info=document.createElement('span'); info.style.cssText='font-size:13.5px;font-weight:700;';
    info.textContent='☑ 已選 '+uiPB.sel.size+' 位';
    const selAll=document.createElement('button'); selAll.className='qbtn';
    selAll.textContent='全選列出的 '+list.length+' 位';
    selAll.onclick=()=>{ list.forEach(p=>uiPB.sel.add(p.id)); renderPhonebook(); };
    const clr=document.createElement('button'); clr.className='qbtn'; clr.textContent='取消全選';
    clr.onclick=()=>{ uiPB.sel.clear(); renderPhonebook(); };
    const del=document.createElement('button'); del.className='qbtn';
    if (uiPB.delPending==='batch'){
      del.textContent='確定刪除這 '+uiPB.sel.size+' 位？'; del.style.cssText='background:var(--red);color:var(--on-red,#fff);';
      del.onclick=()=>{
        const n=uiPB.sel.size;
        pbook=pbook.filter(x=>!uiPB.sel.has(x.id));
        uiPB.sel.clear(); uiPB.delPending=null; savePB(); renderPhonebook();
        catSay('刪掉 '+n+' 位了！清乾淨了喵～',3000,'happy');
      };
    } else {
      del.textContent='🗑 刪除選取';
      del.onclick=()=>{
        if (!uiPB.sel.size){ catSay('先勾選要刪的聯絡人喵',2200,'alarmed'); return; }
        uiPB.delPending='batch'; clearTimeout(uiPB.delTimer);
        uiPB.delTimer=setTimeout(()=>{ if(uiPB.delPending==='batch'){ uiPB.delPending=null; renderPhonebook(); } },4000);
        renderPhonebook();
      };
    }
    const done=document.createElement('button'); done.className='qbtn'; done.textContent='✕ 結束批量';
    done.onclick=()=>{ uiPB.batch=false; uiPB.sel.clear(); renderPhonebook(); };
    r1.append(info,selAll,clr,del,done);
    bb.appendChild(r1);
    wrap.appendChild(bb);
  }
  const groups={};
  list.forEach(p=>{ const k=p.school||'未分類'; (groups[k]=groups[k]||[]).push(p); });
  Object.keys(groups).sort((a,b)=>a.localeCompare(b,'zh-Hant')).forEach(sch=>{
    const g=document.createElement('div'); g.className='trkCard';
    const gh=document.createElement('div'); gh.className='pbGroupHead';
    const collapsed=uiPB.collapsed.has(sch);
    gh.innerHTML=(collapsed?'▸':'▾')+' '+(settings.pbIcon||'🏫')+' '+esc(sch)+' <span class="pbCount">'+groups[sch].length+' 人</span>';
    gh.onclick=()=>{ collapsed?uiPB.collapsed.delete(sch):uiPB.collapsed.add(sch); renderPhonebook(); };
    g.appendChild(gh);
    if (!collapsed) groups[sch].forEach(p=>{
      if (uiPB.editing===p.id){
        g.appendChild(pbForm(p, d=>{ Object.assign(p,d); uiPB.editing=null; savePB(); renderPhonebook(); }));
        return;
      }
      const row=document.createElement('div'); row.className='pbRow';
      row.dataset.pid=p.id;   // 反黑加註解用
      if (uiPB.batch && !inAllView()){
        const cb=document.createElement('input'); cb.type='checkbox';
        cb.style.cssText='width:17px;height:17px;accent-color:var(--red);cursor:pointer;margin:0;';
        cb.checked=uiPB.sel.has(p.id);
        cb.onchange=()=>{ cb.checked?uiPB.sel.add(p.id):uiPB.sel.delete(p.id); renderPhonebook(); };
        row.appendChild(cb);
      }
      if (inAllView()){
        const si=document.createElement('span'); si.className='pbInfo';
        si.textContent=spaceIcon(p.space);
        si.title=(p.space||'work')==='life'?'私人':'工作';
        row.appendChild(si);
      }
      const nm=document.createElement('span'); nm.className='pbName'; nm.textContent=p.name;
      row.appendChild(nm);
      if (p.role){
        const rl=document.createElement('span'); rl.className='pbInfo'; rl.textContent=p.role;
        row.appendChild(rl);
      }
      (p.programs||[]).forEach(pr=>{
        const c=document.createElement('span'); c.className='chip mobHide '+colorClass(pr); c.textContent=pr;
        row.appendChild(c);
      });
      // 📦 這個人負責的追蹤項目（點了直接跳過去；用 📞 欄連結或名字相符都算）
      const inTrks=trackers.filter(t=>spaceMatch(t.space) && !t.archived
        && t.rows.some(r=>!r.skipped && ((r.pbIds||[]).some(l=>l.id===p.id) || r.name===p.name)));
      inTrks.slice(0,3).forEach(trk=>{
        const c=document.createElement('span'); c.className='chip type clickable mobHide';
        c.textContent='📦 '+trk.title.slice(0,10);
        c.title='負責的追蹤項目：'+trk.title+'（點擊前往）';
        c.onclick=()=>{
          uiTrk.tab='trk'; uiTrk.collapsed.delete(trk.id); module='track'; render();
          setTimeout(()=>{ const el=document.getElementById('trk_'+trk.id);
            if (el){ el.scrollIntoView({behavior:'smooth',block:'start'}); el.style.outline='2px solid var(--accent)';
              setTimeout(()=>{ el.style.outline=''; },1800); } },0);
        };
        row.appendChild(c);
      });
      if (inTrks.length>3){
        const c=document.createElement('span'); c.className='chip type mobHide';
        c.textContent='📦 +'+(inTrks.length-3);
        c.title=inTrks.slice(3).map(t=>t.title).join('、');
        row.appendChild(c);
      }
      // 電話/Email 不做超連結（點了會跳撥號/寄信很干擾）——改成純文字＋📋 一鍵複製
      if (p.phone){
        const s=document.createElement('span'); s.className='pbInfo';
        s.appendChild(document.createTextNode('📞 '+p.phone));
        const cb2=document.createElement('button'); cb2.className='qbtn'; cb2.innerHTML=riIcon('copy');
        cb2.title='複製電話';
        cb2.onclick=()=>copyText(p.phone,'電話複製好了！');
        s.appendChild(cb2); row.appendChild(s);
      }
      if (p.email){
        const s=document.createElement('span'); s.className='pbInfo';
        s.appendChild(document.createTextNode('✉️ '+p.email));
        const cb2=document.createElement('button'); cb2.className='qbtn'; cb2.innerHTML=riIcon('copy');
        cb2.title='複製 Email（貼到信箱收件人）';
        cb2.onclick=()=>copyText(p.email,'Email 複製好了，直接貼到收件人吧！');
        s.appendChild(cb2); row.appendChild(s);
      }
      const sp=document.createElement('span'); sp.style.flex='1'; row.appendChild(sp);
      // 📮 一鍵建追蹤任務（業務催客戶、行政催窗口都用得上）
      const fu=document.createElement('button'); fu.className='qbtn mobHide'; fu.textContent='＋追蹤任務';
      fu.title='在 🏡 任務小窩建立一件「聯絡'+p.name+'」的追蹤任務（要催對方的時候用）';
      fu.onclick=()=>{
        const nt={id:uid(), text:'聯絡 '+p.name+(p.phone?'（📞 '+p.phone+'）':''), title:'聯絡 '+p.name,
          cat:(p.programs&&p.programs[0])||fallbackCat(), type:'👀 追蹤', due:null, start:null, time:null,
          icon:null, tags:[], who:p.name, subs:[], space:p.space||'work',
          status:'todo', followUp:null, created:toISO(new Date()), doneAt:null};
        tasks.unshift(nt);
        learnContact(p.name); save();
        toast('✅ 已在任務小窩建立「聯絡 '+p.name+'」（寄出後記得按 ⏳ 等回覆）','前往任務',()=>jumpToTask(nt));
      };
      row.appendChild(fu);
      const eb=document.createElement('button'); eb.className='qbtn'; eb.innerHTML=riIcon('pencil'); eb.title='編輯';
      eb.onclick=()=>{ uiPB.editing=p.id; renderPhonebook(); };
      row.appendChild(eb);
      const del=document.createElement('button'); del.className='qbtn mobHide';
      if (uiPB.delPending===p.id){
        del.textContent='確定刪除？'; del.style.cssText='background:var(--red);color:var(--on-red,#fff);';
        del.onclick=()=>{ pbook=pbook.filter(x=>x.id!==p.id); uiPB.delPending=null; savePB(); renderPhonebook(); };
      } else {
        del.innerHTML=riIcon('trash'); del.title='刪除（再點一次確認）';
        del.onclick=()=>{
          uiPB.delPending=p.id; clearTimeout(uiPB.delTimer);
          uiPB.delTimer=setTimeout(()=>{uiPB.delPending=null; renderPhonebook();},3000);
          renderPhonebook();
        };
      }
      row.appendChild(del);
      // 備註：直接點著打，自動儲存
      const ntWrap=document.createElement('span'); ntWrap.className='pbNote mobHide';   // 📱 手機只留 名字/職稱/電話/Email/✎
      const nt=document.createElement('input'); nt.className='cellInput';
      nt.style.cssText='width:100%;font-size:12.5px;';
      nt.placeholder='📝 備註…（點我直接打，自動儲存）';
      nt.value=p.note||'';
      nt.onchange=()=>{ p.note=nt.value.trim(); savePB(); };
      ntWrap.appendChild(nt);
      // 🕐 備註插入日期戳（聯絡歷程輕量版：7/26 打過電話；7/28 已回…）
      const ts=document.createElement('button'); ts.className='qbtn'; ts.textContent='🕐';
      ts.title='在備註插入今天日期（記錄聯絡歷程）';
      ts.onclick=()=>{
        const now=new Date(); const stamp=(now.getMonth()+1)+'/'+now.getDate()+' ';
        nt.value=(nt.value.trim()? nt.value.trim()+'；':'')+stamp;
        p.note=nt.value; savePB();
        nt.focus(); nt.setSelectionRange(nt.value.length, nt.value.length);
      };
      ntWrap.appendChild(ts);
      row.appendChild(ntWrap);
      g.appendChild(row);
    });
    wrap.appendChild(g);
  });
}

/* ───────── 網站收藏 ───────── */
const SITES_KEY='taskInbox.sites';
let sites=[];
function loadSites(){
  try{ sites=JSON.parse(localStorage.getItem(SITES_KEY))||[]; }catch(e){ sites=[]; }
  sites.forEach(s=>{ if(!s.space) s.space='work'; if(s.archived===undefined) s.archived=false;
    if(!Array.isArray(s.accounts)) s.accounts=[]; });
}
function saveSites(){ localStorage.setItem(SITES_KEY, JSON.stringify(sites)); }
const uiSites={ newOpen:false, editing:null, delPending:null, delTimer:null, q:'', filter:'全部',
  accOpen:null, showPw:new Set(), accDel:null, accDelTimer:null };
function normUrl(u){
  u=(u||'').trim();
  if (!u) return '';
  if (!/^https?:\/\//i.test(u)) u='https://'+u;
  return u;
}
function siteForm(s, onDone){
  const isNew=!s.id;
  if (!uiSites.draft) uiSites.draft={t:'',u:'',n:''};
  const f=document.createElement('div'); f.className='pickerRow fRow';
  const fld=(lab,el)=>{ const d=document.createElement('span'); d.className='fField';
    const l=document.createElement('span'); l.className='fLab'; l.textContent=lab; d.append(l,el); return d; };
  const mk=(ph,val,w)=>{ const i=document.createElement('input'); i.className='miniInput'; i.placeholder=ph; i.value=val||''; i.style.width=w; return i; };
  const nameI=mk('例：報帳系統', isNew?uiSites.draft.t:s.title, '150px');
  const urlI=mk('可省略 https://', isNew?uiSites.draft.u:s.url, '240px');
  const noteI=mk('它是幹嘛的、帳號提示…', isNew?uiSites.draft.n:s.note, '200px');
  if (isNew){   // 新增時保留打到一半的草稿（切頁面回來還在）
    nameI.oninput=()=>{ uiSites.draft.t=nameI.value; };
    urlI.oninput=()=>{ uiSites.draft.u=urlI.value; };
    noteI.oninput=()=>{ uiSites.draft.n=noteI.value; };
  }
  const catSel=document.createElement('select'); catSel.className='miniSelect';
  const spX=s.space||(inAllView()?'work':settings.space);
  ['',...catsForSpace(spX).map(c=>c.name)].forEach(cn=>{
    const o=document.createElement('option'); o.value=cn; o.textContent=cn||'（不指定專案）';
    if ((s.cat||'')===cn) o.selected=true;
    catSel.appendChild(o);
  });
  const ok=document.createElement('button'); ok.className='qbtn'; ok.textContent='✔ 儲存';
  ok.style.cssText='background:var(--accent);color:var(--on-accent,#fff);';
  ok.onclick=()=>{
    const t=nameI.value.trim(), u=normUrl(urlI.value);
    if (!t||!u) return;
    if (isNew) uiSites.draft={t:'',u:'',n:''};
    onDone({title:t, url:u, note:noteI.value.trim(), cat:catSel.value||null});
  };
  f.append(fld('網站名稱＊',nameI), fld('網址＊',urlI), fld('說明備註',noteI), fld('掛到專案',catSel), ok);
  return f;
}
function renderSites(){
  const wrap=document.getElementById('sitesPane');
  wrap.innerHTML='';
  const top=document.createElement('div'); top.className='trkCard';
  const h=document.createElement('div'); h.className='trkHead';
  h.innerHTML='<span class="tTitle">🔖 網站收藏</span><span class="spacer"></span>';
  if (!inAllView()){
    const addB=document.createElement('button'); addB.className='ghostBtn';
    addB.textContent=uiSites.newOpen?'收起':'＋ 收藏網站';
    addB.onclick=()=>{ uiSites.newOpen=!uiSites.newOpen; renderSites(); };
    h.appendChild(addB);
  }
  top.appendChild(h);
  if (inAllView()){
    const hint=document.createElement('div'); hint.className='calLegend';
    hint.style.cssText+='text-align:left;margin-top:6px;';
    hint.textContent='🌍 總覽模式：顯示工作＋私人全部收藏（🏢/🏠 標示）。要新增請先切換空間。';
    top.appendChild(hint);
  }
  if (uiSites.newOpen && !inAllView()){
    top.appendChild(siteForm({}, d=>{
      sites.unshift({id:uid(), space:settings.space, created:toISO(new Date()), ...d});
      uiSites.newOpen=false; saveSites(); renderSites();
      catSay('收藏好了喵！以後點名字直接開網站～',2200,'happy');
    }));
  }
  wrap.appendChild(top);
  let vis=sites.filter(s=>spaceMatch(s.space) && !s.archived);
  const allS=vis.length;
  if (allS>0){
    const bar=document.createElement('div');
    bar.style.cssText='margin-bottom:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;';
    bar.appendChild(mkSearchBox('siteSearch','🔍 搜尋收藏…',()=>uiSites.q,v=>uiSites.q=v,renderSites));
    // 📂 專案篩選（有收藏掛專案時才出現）
    const catsUsed=[...new Set(vis.map(s=>s.cat).filter(Boolean))];
    if (catsUsed.length){
      ['全部',...catsUsed].forEach(cn=>{
        const c=document.createElement('span');
        c.className='memberTag'+(uiSites.filter===cn?' on':'')+(cn!=='全部'?' '+colorClass(cn):'');
        c.textContent=cn;
        c.onclick=()=>{ uiSites.filter=cn; renderSites(); };
        bar.appendChild(c);
      });
      if (!catsUsed.includes(uiSites.filter) && uiSites.filter!=='全部') uiSites.filter='全部';
    }
    wrap.appendChild(bar);
  }
  if (uiSites.filter!=='全部') vis=vis.filter(s=>s.cat===uiSites.filter);
  const sq=uiSites.q.trim();
  if (sq) vis=vis.filter(s=>((s.title||'')+' '+(s.url||'')+' '+(s.note||'')+' '+(s.cat||'')).includes(sq));
  if (!vis.length && allS>0){
    const e=document.createElement('div'); e.className='empty'; e.textContent='沒有符合的收藏喵';
    wrap.appendChild(e); return;
  }
  if (!vis.length){
    const e=document.createElement('div'); e.className='empty';
    e.textContent='還沒有收藏喵🔖 把常用網站加進來，附上說明就不會忘記它是幹嘛的';
    wrap.appendChild(e); return;
  }
  const g=document.createElement('div'); g.className='trkCard';
  vis.forEach(s=>{
    if (uiSites.editing===s.id){
      g.appendChild(siteForm(s, d=>{ Object.assign(s,d); uiSites.editing=null; saveSites(); renderSites(); }));
      return;
    }
    const row=document.createElement('div'); row.className='pbRow';
    row.dataset.sid=s.id;   // 反黑加註解用
    if (inAllView()){
      const si=document.createElement('span'); si.className='pbInfo';
      si.textContent=spaceIcon(s.space);
      si.title=(s.space||'work')==='life'?'私人':'工作';
      row.appendChild(si);
    }
    const fav=document.createElement('img');
    try{ fav.src='https://www.google.com/s2/favicons?sz=32&domain='+new URL(s.url).hostname; }catch(e){}
    fav.style.cssText='width:16px;height:16px;border-radius:4px;';
    fav.onerror=()=>{ fav.style.display='none'; };
    row.appendChild(fav);

/* ───────── 📖 說明書（SOP／使用方法收納） ───────── */
const MAN_KEY='taskInbox.manuals';
let manuals=[];
function loadManuals(){
  try{ manuals=JSON.parse(localStorage.getItem(MAN_KEY))||[]; }catch(e){ manuals=[]; }
  manuals.forEach(m=>{ if(!m.space) m.space='work'; });
}
function saveManuals(){ localStorage.setItem(MAN_KEY, JSON.stringify(manuals)); }
const uiMan={ q:'', open:null, editing:null, newOpen:false, delPending:null, delTimer:null, dT:'', dX:'' };
function manCopy(m){
  copyText(m.title+'\n\n'+m.text, '整份複製好了，直接貼到信裡吧！');
}
function manForm(box, m){   // 新增/編輯共用表單（行內，不用彈窗）
  const isNew=!m;
  const f=document.createElement('div');
  f.style.cssText='margin-top:10px;display:flex;flex-direction:column;gap:8px;';
  const ti=document.createElement('input'); ti.className='miniInput';
  ti.placeholder='標題，例：報帳流程、每學期開學 SOP、系統帳號申請方法';
  ti.value=m?m.title:uiMan.dT;                        // 新增時保留打到一半的草稿
  if (isNew) ti.oninput=()=>{ uiMan.dT=ti.value; };
  const ta=document.createElement('textarea'); ta.className='miniInput';
  ta.style.cssText='min-height:140px;resize:vertical;line-height:1.6;';
  ta.placeholder='步驟寫在這裡，一行一步最好懂。\n1. 打開○○系統\n2. 點△△\n3. …\n（貼網址會自動變連結；設定開 Markdown 可用 **粗體**、清單）';
  ta.value=m?m.text:uiMan.dX;
  if (isNew) ta.oninput=()=>{ uiMan.dX=ta.value; };
  const row=document.createElement('div'); row.style.cssText='display:flex;gap:8px;align-items:center;flex-wrap:wrap;';
  const catSel=document.createElement('select'); catSel.className='miniInput';
  const noneOpt=document.createElement('option'); noneOpt.value=''; noneOpt.textContent='📂 不掛專案';
  catSel.appendChild(noneOpt);
  curCats().filter(c=>c.vis==='show').forEach(c=>{
    const o=document.createElement('option'); o.value=c.name; o.textContent='📂 '+c.name;
    if (m&&m.cat===c.name) o.selected=true;
    catSel.appendChild(o);
  });
  const ok=document.createElement('button'); ok.className='btnAdd'; ok.textContent=isNew?'加入 🐾':'儲存';
  ok.onclick=()=>{
    const title=ti.value.trim();
    if (!title){ catSay('至少要有標題喵！',2000,'alarmed'); ti.focus(); return; }
    if (isNew){
      manuals.unshift({id:uid(), title, text:ta.value, cat:catSel.value||null, pinned:false,
        space:settings.space, created:toISO(new Date()), updated:toISO(new Date())});
      uiMan.newOpen=false; uiMan.open=manuals[0].id; uiMan.dT=''; uiMan.dX='';
    } else {
      m.title=title; m.text=ta.value; m.cat=catSel.value||null; m.updated=toISO(new Date());
      uiMan.editing=null;
    }
    saveManuals(); renderManual();
    catSay(isNew?'收進說明書了！之後忘記就來翻喵📖':'改好存好了喵！',2400,'happy');
  };
  const cancel=document.createElement('button'); cancel.className='ghostBtn'; cancel.textContent='取消';
  cancel.onclick=()=>{ if(isNew) uiMan.newOpen=false; else uiMan.editing=null; renderManual(); };
  bindEnterSave(ti, ()=>ok.click());          // 標題＝單行框：Enter 直接存
  bindCtrlSave(ta, ()=>ok.click());           // 內容＝寫長文的編輯區：Enter 換行
  row.appendChild(catSel); row.appendChild(ok); row.appendChild(cancel);
  f.appendChild(ti); f.appendChild(ta); f.appendChild(editHint()); f.appendChild(row);
  box.appendChild(f);
  setTimeout(()=>ti.focus(),0);
}
function renderManual(){
  const wrap=document.getElementById('manualPane');
  wrap.innerHTML='';
  const head=document.createElement('div'); head.className='trkCard';
  const hh=document.createElement('div'); hh.className='trkHead';
  hh.innerHTML='<span class="tTitle">📖 說明書</span><span class="spacer"></span>';
  hh.appendChild(mkSearchBox('manSearch','🔍 搜尋標題/內容…',()=>uiMan.q,v=>uiMan.q=v,renderManual));
  if (!inAllView()){
    const add=document.createElement('button'); add.className='ghostBtn';
    add.textContent= uiMan.newOpen ? '收起' : '＋ 新增說明書';
    add.onclick=()=>{ uiMan.newOpen=!uiMan.newOpen; renderManual(); };
    hh.appendChild(add);
  }
  head.appendChild(hh);
  const note=document.createElement('div'); note.className='setNote';
  note.textContent='常忘記的操作步驟、SOP、申請流程都收在這裡——要用的時候搜標題就找到。點標題展開，📌 釘選常用的。';
  head.appendChild(note);
  if (uiMan.newOpen) manForm(head, null);
  wrap.appendChild(head);

  let vis=manuals.filter(m=>spaceMatch(m.space));
  const q=uiMan.q.trim();
  if (q) vis=vis.filter(m=>((m.title||'')+' '+(m.text||'')+' '+(m.cat||'')).includes(q));
  vis.sort((a,b)=>{
    if (!!b.pinned-!!a.pinned) return (!!b.pinned)-(!!a.pinned);
    return (b.updated||'').localeCompare(a.updated||'');
  });
  if (!vis.length){
    const e=document.createElement('div'); e.className='empty';
    e.textContent= q ? '沒有符合的說明書喵🔍' : '還沒有說明書📖 把「每次都要重想一遍」的流程寫下來，下次 10 秒查到';
    wrap.appendChild(e);
    return;
  }
  vis.forEach(m=>{
    const c=document.createElement('div'); c.className='trkCard';
    c.dataset.mid=m.id;   // 反黑加註解用
    if (uiMan.editing===m.id){
      c.innerHTML='<div class="trkHead"><span class="tTitle">✏️ 編輯說明書</span></div>';
      manForm(c, m); wrap.appendChild(c); return;
    }
    const h=document.createElement('div'); h.className='trkHead';
    const pin=document.createElement('button'); pin.className='qbtn';
    pin.textContent= m.pinned?'📌':'📍'; pin.title= m.pinned?'取消釘選':'釘選到最上面';
    pin.style.opacity= m.pinned?'1':'.45';
    pin.onclick=()=>{ m.pinned=!m.pinned; saveManuals(); renderManual(); };
    const t=document.createElement('span'); t.className='tTitle';
    t.style.cursor='pointer'; t.textContent=(uiMan.open===m.id?'▾ ':'▸ ')+m.title;
    t.title='點擊展開/收合';
    t.onclick=()=>{ uiMan.open = uiMan.open===m.id ? null : m.id; renderManual(); };
    h.appendChild(pin); h.appendChild(t);
    if (m.cat){
      const chip=document.createElement('span'); chip.className='memberTag '+colorClass(m.cat);
      chip.textContent='📂 '+m.cat; h.appendChild(chip);
    }
    if (inAllView()){
      const sp=document.createElement('span'); sp.textContent=spaceIcon(m.space); h.appendChild(sp);
    }
    const spacer=document.createElement('span'); spacer.className='spacer'; h.appendChild(spacer);
    if (!inAllView()){
      const cp=document.createElement('button'); cp.className='qbtn'; cp.innerHTML=riIcon('copy');
      cp.title='複製整份（標題＋內容），貼到信件或交接文件'; cp.onclick=()=>manCopy(m);
      const ed=document.createElement('button'); ed.className='qbtn'; ed.innerHTML=riIcon('pencil'); ed.title='編輯';
      ed.onclick=()=>{ uiMan.editing=m.id; uiMan.newOpen=false; renderManual(); };
      const del=document.createElement('button'); del.className='qbtn';
      if (uiMan.delPending===m.id){
        del.textContent='確定刪除？'; del.style.cssText='color:var(--on-red,#fff);background:var(--red);border-color:var(--red);';
        del.onclick=()=>{ manuals=manuals.filter(x=>x.id!==m.id); uiMan.delPending=null; saveManuals(); renderManual(); catSay('刪掉了喵',1800); };
      } else {
        del.innerHTML=riIcon('trash'); del.title='刪除（要點兩次）';
        del.onclick=()=>{ uiMan.delPending=m.id; renderManual();
          clearTimeout(uiMan.delTimer);
          uiMan.delTimer=setTimeout(()=>{ if(uiMan.delPending===m.id){ uiMan.delPending=null; renderManual(); } },3000); };
      }
      h.appendChild(cp); h.appendChild(ed); h.appendChild(del);
    }
    c.appendChild(h);
    if (uiMan.open===m.id){
      const body=document.createElement('div');
      body.style.cssText='margin-top:10px;font-size:13.5px;line-height:1.7;white-space:pre-wrap;word-break:break-word;';
      renderRich(body, m.text||'（還沒寫內容，按 ✎ 補上）');
      c.appendChild(body);
      const meta=document.createElement('div');
      meta.style.cssText='margin-top:8px;font-size:12.5px;color:var(--sub);';
      meta.textContent='更新：'+(m.updated||m.created||'—');
      c.appendChild(meta);
    }
    wrap.appendChild(c);
  });
}

/* ───────── 專案（類別的說明＋跨模組總覽） ───────── */
const uiProj={ open:null, layout:false, qa:null, qaD:{} };   // qa=哪個區塊的快速新增開著、qaD=打到一半的草稿
// 專案頁可用的區塊（每個專案用 cat.blocks 陣列自訂顯示與順序）
const PROJ_BLOCKS={ tasks:'🏡 進行中任務', track:'📦 追蹤項目', phone:'📞 聯絡人',
  notes:'📒 便利貼', sites:'🔖 相關網站', manual:'📖 說明書', money:'💰 記帳' };
function projJump(target, cat, sp){
  if (inAllView()){ settings.space=sp; saveSettings(); }
  if (target==='tasks'){ module='tasks'; view='list'; filterCat=cat.name; doerFilter=null; }
  else if (target==='track'){ module='track'; uiTrk.tab='trk'; uiTrk.trkFilter=cat.name; }
  else if (target==='phone'){ module='phone'; uiPB.filter=cat.name; }
  else if (target==='sites'){ module='sites'; uiSites.filter=cat.name; }
  else if (target==='notes'){ module='notes'; notesFilter=cat.name; }
  else if (target==='manual'){ module='manual'; uiMan.q=cat.name; }
  else module=target;
  render();
}
/* 專案頁的行內快速新增（不跳頁，直接掛上該專案與空間） */
function projQuickAdd(kind, cat, sp){
  const f=document.createElement('div');
  f.style.cssText='margin-top:10px;display:flex;flex-direction:column;gap:8px;';
  const D=uiProj.qaD;
  const mkI=(ph,key,w)=>{
    const i=document.createElement('input'); i.className='miniInput'; i.placeholder=ph;
    i.value=D[key]||''; i.oninput=()=>{ D[key]=i.value; };
    if (w) i.style.width=w;
    return i;
  };
  const done=msg=>{
    uiProj.qa=null; uiProj.qaD={};
    renderProjects();
    catSay(msg,2600,'happy');
  };
  if (kind==='tasks'){
    const ti=mkI('任務內容（打日期也會自動抓，例：回信給小美 下週三前）','t');
    const b=document.createElement('button'); b.className='btnAdd'; b.textContent='加入任務 🐾';
    b.style.alignSelf='flex-start';
    const commit=()=>{
      const v=(D.t||'').trim(); if(!v) return;
      const c=classify(v);
      tasks.unshift({id:uid(), text:v, title:extractTitle(v), cat:cat.name, type:c.type,
        due:c.due?toISO(c.due):null, start:c.start?toISO(c.start):null, time:c.time||null, icon:null,
        tags:[...c.tags], who:c.who||null,
        subs:detectSubs(v).map(n=>({name:n, done:false, doneAt:null})),
        space:sp, status:'todo', followUp:null, created:toISO(new Date()), doneAt:null});
      save();
      done('任務加好了，掛在 📂 '+cat.name+' 底下喵！');
    };
    b.onclick=commit;
    ti.onkeydown=e=>{ if(e.key==='Enter') commit(); };
    f.append(ti,b);
    setTimeout(()=>ti.focus(),0);
  } else if (kind==='notes'){
    const ta=document.createElement('textarea'); ta.className='miniInput';
    ta.style.cssText='min-height:64px;resize:vertical;line-height:1.6;';
    ta.placeholder='想記的內容…（Enter 儲存、Shift+Enter 換行）';
    ta.value=D.n||''; ta.oninput=()=>{ D.n=ta.value; };
    const b=document.createElement('button'); b.className='btnAdd'; b.textContent='貼上便利貼 📒';
    b.style.alignSelf='flex-start';
    b.onclick=()=>{
      const v=(D.n||'').trim(); if(!v) return;
      notes.unshift({id:uid(), text:v, color:NOTE_COLORS[notes.length%NOTE_COLORS.length],
        created:toISO(new Date()), space:sp, cat:cat.name, size:'s', trashed:false});
      saveNotes();
      done('便利貼貼好了，掛在 📂 '+cat.name+' 喵！');
    };
    bindEnterSave(ta, ()=>b.click());
    f.append(ta,b);
    setTimeout(()=>ta.focus(),0);
  } else if (kind==='manual'){
    const ti=mkI('標題，例：報帳流程、每學期開學 SOP','mt');
    const ta=document.createElement('textarea'); ta.className='miniInput';
    ta.style.cssText='min-height:100px;resize:vertical;line-height:1.6;';
    ta.placeholder='步驟寫在這裡，一行一步最好懂（支援 Markdown：# 標題、**粗體**、| 表格 |）';
    ta.value=D.mx||''; ta.oninput=()=>{ D.mx=ta.value; };
    const b=document.createElement('button'); b.className='btnAdd'; b.textContent='收進說明書 📖';
    b.style.alignSelf='flex-start';
    b.onclick=()=>{
      const t=(D.mt||'').trim();
      if (!t){ catSay('至少要有標題喵！',2000,'alarmed'); ti.focus(); return; }
      manuals.unshift({id:uid(), title:t, text:D.mx||'', cat:cat.name, pinned:false,
        space:sp, created:toISO(new Date()), updated:toISO(new Date())});
      saveManuals();
      done('說明書收好了，掛在 📂 '+cat.name+' 喵！');
    };
    bindEnterSave(ti, ()=>b.click());   // 標題＝單行框：Enter 直接存
    bindCtrlSave(ta, ()=>b.click());    // 內容＝寫長文：Enter 換行
    f.append(ti,ta,editHint(),b);
    setTimeout(()=>ti.focus(),0);
  } else if (kind==='sites'){
    const row=document.createElement('div'); row.style.cssText='display:flex;gap:8px;flex-wrap:wrap;';
    const ti=mkI('網站名稱*','st','150px');
    const ui2=mkI('網址*（可省略 https://）','su','220px');
    const b=document.createElement('button'); b.className='qbtn'; b.textContent='✔ 收藏';
    b.style.cssText='background:var(--accent);color:var(--on-accent,#fff);';
    b.onclick=()=>{
      const t=(D.st||'').trim(), u=normUrl(D.su||'');
      if (!t||!u){ catSay('名稱跟網址都要填喵！',2000,'alarmed'); return; }
      sites.unshift({id:uid(), space:sp, created:toISO(new Date()), title:t, url:u, note:'', cat:cat.name});
      saveSites();
      done('網站收藏好了，掛在 📂 '+cat.name+' 喵！');
    };
    row.append(ti,ui2,b);
    f.appendChild(row);
    setTimeout(()=>ti.focus(),0);
  }
  return f;
}
function renderProjects(){
  const wrap=document.getElementById('projectsPane');
  wrap.innerHTML='';
  const spaces = inAllView() ? ['work','life'] : [settings.space];
  if (uiProj.open){
    let cat=null, csp=null;
    for (const sp of spaces){
      const c=settings.cats[sp].find(x=>x.name===uiProj.open);
      if (c){ cat=c; csp=sp; break; }
    }
    if (cat){ renderProjectDetail(wrap, cat, csp); return; }
    uiProj.open=null;
  }
  const legend=document.createElement('div'); legend.className='calLegend';
  legend.style.cssText+='text-align:left;margin-bottom:10px;';
  legend.textContent='專案＝貫穿所有功能的分類。點卡片寫說明、看這個專案在各功能的全貌；新增/改名/換色請到 ⚙️ 設定。';
  wrap.appendChild(legend);
  const grid=document.createElement('div');
  grid.style.cssText='display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;';
  spaces.forEach(sp=>{
    settings.cats[sp].forEach(cat=>{
      const tN=tasks.filter(t=>(t.space||'work')===sp && t.cat===cat.name && t.status!=='done').length;
      const kN=trackers.filter(t=>(t.space||'work')===sp && !t.archived && (t.cat||'其他')===cat.name).length;
      const pN=pbook.filter(p=>(p.space||'work')===sp && (p.programs||[]).includes(cat.name)).length;
      const c=document.createElement('div'); c.className='trkCard';
      c.style.cssText+='cursor:pointer;margin-bottom:0;';
      const h=document.createElement('div'); h.className='trkHead';
      const dot=document.createElement('span'); dot.className='colorDot '+dotClass(cat);
      dot.style.cursor='inherit';
      const tt=document.createElement('span'); tt.className='tTitle';
      tt.textContent=(spaces.length>1?spaceIcon(sp)+' ':'')+cat.name;
      h.append(dot,tt);
      c.appendChild(h);
      const d1=document.createElement('div');
      d1.style.cssText='font-size:12.5px;color:var(--sub);margin-top:6px;min-height:18px;';
      d1.textContent=(cat.desc||'').split('\n')[0].slice(0,26) || '（點擊進入，寫下這個專案的說明）';
      c.appendChild(d1);
      const d2=document.createElement('div');
      d2.style.cssText='font-size:12.5px;color:var(--sub);margin-top:6px;';
      d2.textContent='🏡 任務 '+tN+'｜📦 追蹤 '+kN+'｜📞 聯絡人 '+pN;
      c.appendChild(d2);
      c.onclick=()=>{ uiProj.open=cat.name; uiProj.layout=false; renderProjects(); };
      grid.appendChild(c);
    });
  });
  wrap.appendChild(grid);
}
function renderProjectDetail(wrap, cat, sp){
  const back=document.createElement('button'); back.className='ghostBtn';
  back.textContent='‹ 返回專案列表';
  back.onclick=()=>{ uiProj.open=null; uiProj.layout=false; renderProjects(); };
  wrap.appendChild(back);

  const head=document.createElement('div'); head.className='trkCard'; head.style.marginTop='10px';
  const h=document.createElement('div'); h.className='trkHead';
  const chip=document.createElement('span'); chip.className='chip '+colorClass(cat.name);
  chip.style.cssText='font-size:15px;padding:5px 14px;font-weight:700;';
  chip.textContent=cat.name;
  h.appendChild(chip);
  if (inAllView()){
    const si=document.createElement('span'); si.className='chip type'; si.textContent=spaceIcon(sp);
    h.appendChild(si);
  }
  const hs=document.createElement('span'); hs.className='spacer'; h.appendChild(hs);
  [['tasks','🏡 看任務'],['track','📦 看追蹤'],['phone','📞 看聯絡人']].forEach(([t,l])=>{
    const b=document.createElement('button'); b.className='qbtn'; b.textContent=l;
    b.onclick=()=>projJump(t,cat,sp);
    h.appendChild(b);
  });
  head.appendChild(h);
  const desc=document.createElement('textarea'); desc.className='trkNote';
  desc.placeholder='這個專案的說明…（是什麼、關鍵流程、注意事項、重要連結。自動儲存）';
  desc.style.minHeight='90px';
  desc.value=cat.desc||'';
  desc.onchange=()=>{ cat.desc=desc.value; saveSettings(); };
  head.appendChild(desc);
  wrap.appendChild(head);

  const secCard=(title, lines, jumpTarget)=>{
    const c=document.createElement('div'); c.className='trkCard';
    const hh=document.createElement('div'); hh.className='trkHead';
    hh.innerHTML='<span class="tTitle">'+title+'</span><span class="spacer"></span>';
    // ＋ 不用跳頁，在專案裡直接新增（自動掛上這個專案）
    const QA_LABEL={tasks:'任務', notes:'便利貼', manual:'說明書', sites:'網站'};
    if (jumpTarget && QA_LABEL[jumpTarget]){
      const ab=document.createElement('button'); ab.className='qbtn';
      ab.textContent= uiProj.qa===jumpTarget ? '✕ 收起' : '＋ 新增';
      ab.title='直接在這裡新增'+QA_LABEL[jumpTarget]+'（自動掛上「'+cat.name+'」）';
      ab.onclick=()=>{ uiProj.qa = uiProj.qa===jumpTarget?null:jumpTarget; renderProjects(); };
      hh.appendChild(ab);
    }
    if (jumpTarget){
      const b=document.createElement('button'); b.className='qbtn'; b.textContent='前往 ›';
      b.onclick=()=>projJump(jumpTarget,cat,sp);
      hh.appendChild(b);
    }
    c.appendChild(hh);
    if (jumpTarget && uiProj.qa===jumpTarget && QA_LABEL[jumpTarget]) c.appendChild(projQuickAdd(jumpTarget, cat, sp));
    if (!lines.length){
      const e=document.createElement('div'); e.className='empty'; e.textContent='（目前沒有）';
      c.appendChild(e);
    }
    lines.forEach(l=>{
      const d=document.createElement('div');
      d.style.cssText='font-size:13.5px;margin-top:6px;line-height:1.55;color:'+(l.c||'var(--ink)');
      d.textContent=l.t;
      if (l.go){ d.style.cursor='pointer'; d.title='點擊直接前往'; d.onclick=l.go;
        d.onmouseenter=()=>d.style.textDecoration='underline';
        d.onmouseleave=()=>d.style.textDecoration=''; }
      c.appendChild(d);
    });
    return c;
  };

  // 🧱 每個區塊一個渲染器；cat.blocks（陣列，順序＝版面順序）決定顯示哪些；每一行都可點擊直達
  const blockRenderers={
    tasks(){
      const tk=tasks.filter(t=>(t.space||'work')===sp && t.cat===cat.name && t.status!=='done' && !t.archived);
      const tl=[];
      tk.slice(0,6).forEach(t=>{
        const u=urgency(t);
        tl.push({t:(t.status==='waiting'?'⏳ ':'')+t.title.slice(0,24)+'　'+u.label, c:u.level==='red'?'var(--red)':'var(--ink)',
          go:()=>{ taskQ=t.title; const tsI=document.getElementById('taskSearch'); if(tsI) tsI.value=t.title; projJump('tasks',cat,sp); }});
      });
      if (tk.length>6) tl.push({t:'…共 '+tk.length+' 件', c:'var(--sub)'});
      return secCard('🏡 進行中任務（'+tk.length+'）', tl, 'tasks');
    },
    track(){
      const tks=trackers.filter(t=>(t.space||'work')===sp && !t.archived && (t.cat||'其他')===cat.name);
      const kl=[];
      tks.slice(0,5).forEach(trk=>{
        const act=trk.rows.filter(r=>!r.skipped);
        const done=act.filter(r=>r.done).length;
        const od=act.filter(r=>!r.done&&effDue(trk,r)&&daysUntil(fromISO(effDue(trk,r)))<0).length;
        kl.push({t:trk.title+'：'+done+'/'+act.length+' 已回'+(od?('｜⏰逾期 '+od):''), c: od?'var(--red)':'var(--ink)',
          go:()=>{ uiTrk.collapsed.delete(trk.id); projJump('track',cat,sp);
            setTimeout(()=>{ const el=document.getElementById('trk_'+trk.id);
              if (el){ el.scrollIntoView({behavior:'smooth',block:'start'}); el.style.outline='2px solid var(--accent)';
                setTimeout(()=>{ el.style.outline=''; },1800); } },0); }});
      });
      return secCard('📦 追蹤項目（'+tks.length+'）', kl, 'track');
    },
    phone(){
      const ps=pbook.filter(p=>(p.space||'work')===sp && (p.programs||[]).includes(cat.name));
      const pl=[];
      ps.slice(0,6).forEach(p=>pl.push({t:p.name+(p.school?'（'+p.school+'）':'')+(p.phone?'　📞 '+p.phone:''),
        go:()=>{ uiPB.q=p.name; projJump('phone',cat,sp); }}));
      if (ps.length>6) pl.push({t:'…共 '+ps.length+' 位', c:'var(--sub)'});
      return secCard('📞 聯絡人（'+ps.length+'）', pl, 'phone');
    },
    notes(){
      const nl=notes.filter(n=>(n.space||'work')===sp && n.cat===cat.name && !n.archived && !n.trashed);
      const lines=[];
      nl.slice(0,5).forEach(n=>lines.push({t:'・'+n.text.split('\n')[0].slice(0,26),
        go:()=>projJump('notes',cat,sp)}));
      if (nl.length>5) lines.push({t:'…共 '+nl.length+' 張', c:'var(--sub)'});
      return secCard('📒 便利貼（'+nl.length+'）', lines, 'notes');
    },
    sites(){
      const ss=sites.filter(s=>(s.space||'work')===sp && s.cat===cat.name && !s.archived);
      const sl=[];
      ss.slice(0,6).forEach(s=>sl.push({t:'🔖 '+s.title+(s.note?'　—　'+s.note.slice(0,18):''),
        go:()=>window.open(s.url,'_blank')}));
      if (ss.length>6) sl.push({t:'…共 '+ss.length+' 個', c:'var(--sub)'});
      return secCard('🔖 相關網站（'+ss.length+'）', sl, 'sites');
    },
    manual(){
      const ml=manuals.filter(m=>(m.space||'work')===sp && m.cat===cat.name);
      const lines=[];
      ml.slice(0,6).forEach(m=>lines.push({t:(m.pinned?'📌 ':'')+'📖 '+m.title+'　更新 '+(m.updated||'—'),
        go:()=>{ uiMan.open=m.id; uiMan.q=''; if (inAllView()){ settings.space=sp; saveSettings(); } module='manual'; render(); }}));
      if (ml.length>6) lines.push({t:'…共 '+ml.length+' 份', c:'var(--sub)'});
      return secCard('📖 說明書（'+ml.length+'）', lines, 'manual');
    },
    money(){
      const ms=money.filter(m=>(m.space||'work')===sp && m.cat===cat.name);
      const pend=ms.filter(m=>m.type==='claim'&&!m.claimed);
      const pendSum=pend.reduce((s,m)=>s+(m.amount||0)*(m.qty||1),0);
      const tot=ms.reduce((s,m)=>s+(m.amount||0)*(m.qty||1),0);
      return secCard('💰 記帳（'+ms.length+' 筆）', ms.length?[
        {t:'合計 '+fmtMoney(tot)+(pend.length?('｜🧾 未請款 '+pend.length+' 筆 '+fmtMoney(pendSum)):''),
         c: pend.length?'var(--orange)':'var(--ink)'}
      ]:[], 'money');
    },
  };
  // 生效的版面：自訂優先；沒自訂＝預設（網站/記帳有東西才顯示，維持原本的乾淨）
  const custom=Array.isArray(cat.blocks);
  let blocks;
  if (custom) blocks=cat.blocks.filter(k=>PROJ_BLOCKS[k]);
  else {
    blocks=['tasks','track','phone'];
    if (notes.some(n=>(n.space||'work')===sp && n.cat===cat.name && !n.archived && !n.trashed)) blocks.push('notes');
    if (sites.some(s=>(s.space||'work')===sp && s.cat===cat.name && !s.archived)) blocks.push('sites');
    if (manuals.some(m=>(m.space||'work')===sp && m.cat===cat.name)) blocks.push('manual');
    if (money.some(m=>(m.space||'work')===sp && m.cat===cat.name)) blocks.push('money');
  }

  // ＋ 快速新增列（常駐在專案說明卡上——就算這個專案還沒有半張便利貼也能加第一張）
  const qaRow=document.createElement('div');
  qaRow.style.cssText='display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:10px;';
  const ql=document.createElement('span'); ql.className='qlabel'; ql.textContent='＋ 直接新增：';
  qaRow.appendChild(ql);
  [['tasks','🏡 任務'],['notes','📒 便利貼'],['manual','📖 說明書'],['sites','🔖 網站']].forEach(([k,l])=>{
    const b=document.createElement('span'); b.className='memberTag'+(uiProj.qa===k?' on':'');
    b.textContent=l;
    b.title='直接新增，自動掛上「'+cat.name+'」';
    b.onclick=()=>{ uiProj.qa = uiProj.qa===k?null:k; renderProjects(); };
    qaRow.appendChild(b);
  });
  head.appendChild(qaRow);
  // 對應區塊沒顯示在版面上時，表單直接開在說明卡裡
  if (uiProj.qa && !blocks.includes(uiProj.qa)) head.appendChild(projQuickAdd(uiProj.qa, cat, sp));

  // 🧱 版面編輯器
  const lb=document.createElement('button'); lb.className='qbtn';
  lb.textContent= uiProj.layout ? '🧱 完成' : '🧱 版面';
  lb.title='自訂這個專案要顯示哪些區塊、調整順序';
  lb.onclick=()=>{ uiProj.layout=!uiProj.layout; renderProjects(); };
  h.appendChild(lb);
  if (uiProj.layout){
    const ed=document.createElement('div'); ed.className='trkCard';
    ed.innerHTML='<div class="trkHead"><span class="tTitle">🧱 版面編輯</span></div>'
      +'<div class="setNote">這個專案要顯示哪些區塊、什麼順序，由你決定（每個專案可以不一樣）。↑↓ 調順序、✕ 隱藏、下面點「＋」加回來。</div>';
    const ensure=()=>{ if (!Array.isArray(cat.blocks)) cat.blocks=[...blocks]; };
    blocks.forEach((k,i)=>{
      const r2=document.createElement('div');
      r2.style.cssText='display:flex;gap:6px;align-items:center;margin-top:8px;';
      const up=document.createElement('button'); up.className='qbtn'; up.textContent='↑'; up.disabled=i===0;
      up.onclick=()=>{ ensure(); [cat.blocks[i-1],cat.blocks[i]]=[cat.blocks[i],cat.blocks[i-1]]; saveSettings(); renderProjects(); };
      const dn=document.createElement('button'); dn.className='qbtn'; dn.textContent='↓'; dn.disabled=i===blocks.length-1;
      dn.onclick=()=>{ ensure(); [cat.blocks[i+1],cat.blocks[i]]=[cat.blocks[i],cat.blocks[i+1]]; saveSettings(); renderProjects(); };
      const t2=document.createElement('span'); t2.style.cssText='flex:1;font-size:13.5px;'; t2.textContent=PROJ_BLOCKS[k];
      const rm=document.createElement('button'); rm.className='qbtn'; rm.textContent='✕'; rm.title='隱藏這個區塊';
      rm.onclick=()=>{ ensure(); cat.blocks=cat.blocks.filter(x=>x!==k); saveSettings(); renderProjects(); };
      r2.append(up,dn,t2,rm);
      ed.appendChild(r2);
    });
    const hidden=Object.keys(PROJ_BLOCKS).filter(k=>!blocks.includes(k));
    if (hidden.length){
      const hr=document.createElement('div');
      hr.style.cssText='display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:10px;';
      const hl=document.createElement('span'); hl.className='qlabel'; hl.textContent='加回：';
      hr.appendChild(hl);
      hidden.forEach(k=>{
        const b2=document.createElement('span'); b2.className='memberTag';
        b2.textContent='＋ '+PROJ_BLOCKS[k];
        b2.onclick=()=>{ ensure(); cat.blocks.push(k); saveSettings(); renderProjects(); };
        hr.appendChild(b2);
      });
      ed.appendChild(hr);
    }
    if (custom){
      const rs=document.createElement('button'); rs.className='qbtn'; rs.style.marginTop='10px';
      rs.textContent='↺ 還原預設版面';
      rs.onclick=()=>{ delete cat.blocks; saveSettings(); renderProjects(); };
      ed.appendChild(rs);
    }
    wrap.appendChild(ed);
  }

  blocks.forEach(k=>wrap.appendChild(blockRenderers[k]()));
}

/* ───────── 📓 日誌（今天做了什麼、學了什麼——月曆看未來、日誌看過去） ───────── */
const DIARY_KEY='taskInbox.diary';
let diary=[];
function loadDiary(){
  try{ diary=JSON.parse(localStorage.getItem(DIARY_KEY))||[]; }catch(e){ diary=[]; }
  diary.forEach(d=>{ if(!d.space) d.space='work'; });
}
function saveDiary(){ localStorage.setItem(DIARY_KEY, JSON.stringify(diary)); }
const uiDiary={ date:null, q:'', cfgOpen:false, saveTimer:null };
const DIARY_MOODS=['😄','🙂','😐','😮‍💨','😫','🔥'];
const DIARY_SRC={ tasks:'🏡 完成的任務', track:'📦 收到的回傳', habits:'🌱 習慣打卡',
  pomo:'🍅 番茄', comments:'💬 寫下的註解', money:'💰 記的帳', notes:'📒 便利貼異動', manuals:'📖 說明書異動' };
function diaryEntry(dIso, sp, create){
  let e=diary.find(x=>x.date===dIso && (x.space||'work')===sp);
  if (!e && create){
    e={id:uid(), date:dIso, space:sp, text:'', learn:'', mood:null,
       created:toISO(new Date()), updated:toISO(new Date())};
    diary.unshift(e);
  }
  return e;
}
function diaryHasContent(e){ return !!(e && ((e.text||'').trim() || (e.learn||'').trim() || e.mood)); }
/* 這一天的自動摘要：全部即時從現有資料算，不重複存、永遠和實況一致 */
function diarySummary(dIso){
  const S=settings.diarySrc||{};
  const on=k=>S[k]!==false;
  const out=[];
  if (on('tasks')){
    const lines=tasks.filter(t=>spaceMatch(t.space)&&t.doneAt===dIso).map(t=>'✔ '+t.title);
    tasks.filter(t=>spaceMatch(t.space)).forEach(t=>(t.subs||[]).forEach(s=>{
      if (s.done&&s.doneAt===dIso) lines.push('☑ '+s.name+'（'+t.title.slice(0,14)+'）');
    }));
    if (lines.length) out.push({t:'🏡 完成（'+lines.length+'）', lines});
  }
  if (on('track')){
    const lines=[];
    trackers.filter(k=>spaceMatch(k.space)).forEach(trk=>{
      const got=trk.rows.filter(r=>r.done&&r.doneAt===dIso&&!r.skipped).map(r=>r.name);
      if (got.length) lines.push(trk.title+'：'+(trk.doneWord||'回傳')+' '+got.join('、'));
    });
    if (lines.length) out.push({t:'📦 收到回傳', lines});
  }
  if (on('habits')){
    const lines=habits.filter(h=>spaceMatch(h.space)&&(h.log||{})[dIso])
      .map(h=>(h.icon||'🌱')+' '+h.name+((h.log[dIso]>1)?' ×'+h.log[dIso]:''));
    if (lines.length) out.push({t:'🌱 習慣', lines});
  }
  if (on('pomo')){
    const n=(pomoData.log||{})[dIso];
    if (n){
      const fs=[...new Set(pomoData.hist.filter(h=>h.d===dIso&&h.f).map(h=>h.f))];
      out.push({t:'🍅 番茄', lines:['收成 '+n+' 顆'+(fs.length?'　專注：'+fs.join('、'):'')]});
    }
  }
  if (on('comments')){
    const lines=[];
    tasks.filter(t=>spaceMatch(t.space)).forEach(t=>(t.comments||[]).forEach(cm=>{
      if (cm.date===dIso) lines.push('「'+cm.text.slice(0,30)+'」（'+t.title.slice(0,12)+'）');
    }));
    if (lines.length) out.push({t:'💬 註解', lines});
  }
  if (on('money')){
    const lines=money.filter(m=>spaceMatch(m.space)&&m.date===dIso)
      .map(m=>(m.desc||'')+'　'+fmtMoney((m.amount||0)*(m.qty||1))+(m.type==='claim'?'（代墊）':''));
    if (lines.length) out.push({t:'💰 記帳', lines});
  }
  if (on('notes')){
    const lines=[];
    notes.filter(n=>spaceMatch(n.space)&&!n.trashed).forEach(n=>{
      const head=(n.mode==='journal'?'📔 ':'📒 ')+n.text.split('\n')[0].slice(0,18);
      if (n.created===dIso) lines.push('新增：'+head);
      else if (n.updated===dIso) lines.push('更新：'+head);
    });
    if (lines.length) out.push({t:'📒 便利貼/手札', lines});
  }
  if (on('manuals')){
    const lines=[];
    manuals.filter(m=>spaceMatch(m.space)).forEach(m=>{
      if (m.created===dIso) lines.push('新增：'+m.title);
      else if (m.updated===dIso) lines.push('更新：'+m.title);
    });
    if (lines.length) out.push({t:'📖 說明書', lines});
  }
  return out;
}
/* 純文字版（複製到週報用） */
function diaryText(dIso){
  const d=fromISO(dIso);
  let s='📓 '+d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate()+'（週'+WD[d.getDay()]+'）';
  const sps = inAllView() ? ['work','life'] : [settings.space];
  sps.forEach(sp=>{
    const e=diaryEntry(dIso, sp, false);
    if (e){
      if (e.mood) s+=' '+e.mood;
      if ((e.text||'').trim()) s+='\n✍️ '+e.text.trim();
      if ((e.learn||'').trim()) s+='\n📚 學到：'+e.learn.trim();
    }
  });
  const sum=diarySummary(dIso);
  sum.forEach(sec=>{ s+='\n'+sec.t; sec.lines.forEach(l=>{ s+='\n　'+l; }); });
  return s;
}

    const q=uiDiary.q.trim();
    const hits=diary.filter(e=>spaceMatch(e.space) && ((e.text||'')+' '+(e.learn||'')).includes(q))
      .sort((a,b)=>b.date.localeCompare(a.date));
    const c=document.createElement('div'); c.className='trkCard';
    c.innerHTML='<div class="trkHead"><span class="tTitle">🔍 找到 '+hits.length+' 天</span></div>';
    hits.slice(0,20).forEach(e=>{
      const row=document.createElement('div');
      row.style.cssText='font-size:13.5px;margin-top:8px;cursor:pointer;line-height:1.6;';
      row.innerHTML='<b>'+e.date.replace(/-/g,'/')+'</b>'+(e.mood?' '+e.mood:'')+(inAllView()?' '+spaceIcon(e.space):'')
        +'　<span style="color:var(--sub);">'+esc(((e.text||'')+' '+(e.learn||'')).slice(0,40))+'</span>';
      row.onclick=()=>{ uiDiary.date=e.date; uiDiary.q=''; renderDiary(); };
      c.appendChild(row);
    });
    if (!hits.length){ const e2=document.createElement('div'); e2.className='empty'; e2.textContent='沒有符合的日誌喵'; c.appendChild(e2); }
    wrap.appendChild(c);
    return;
  }

  // ── 手寫區（總覽模式唯讀） ──
  if (inAllView()){
    ['work','life'].forEach(sp=>{
      const e=diaryEntry(dIso, sp, false);
      if (!diaryHasContent(e)) return;
      const c=document.createElement('div'); c.className='trkCard';
      c.innerHTML='<div class="trkHead"><span class="tTitle">'+spaceIcon(sp)+' '+(sp==='life'?'私人':'工作')+(e.mood?'　'+e.mood:'')+'</span></div>';
      if ((e.text||'').trim()){ const b=document.createElement('div'); b.style.cssText='margin-top:8px;font-size:13.5px;line-height:1.7;white-space:pre-wrap;'; renderRich(b,'✍️ '+e.text); c.appendChild(b); }
      if ((e.learn||'').trim()){ const b=document.createElement('div'); b.style.cssText='margin-top:8px;font-size:13.5px;line-height:1.7;white-space:pre-wrap;'; renderRich(b,'📚 '+e.learn); c.appendChild(b); }
      wrap.appendChild(c);
    });
  } else {
    const sp=settings.space;
    /* v44：閱讀/編輯雙模式——有內容的日子預設顯示渲染好的閱讀版（才有「已儲存」的完成感），
       按「✏️ 編輯」才進編輯；空白的日子直接進編輯。狀態跟著日期走，換天自動重判。 */
    const cur0=diaryEntry(dIso, sp, false);
    const editing = (uiDiary.editFor===dIso) ? uiDiary.editOn : !diaryHasContent(cur0);
    const c=document.createElement('div'); c.className='trkCard';
    const ch=document.createElement('div'); ch.className='trkHead';
    ch.innerHTML='<span class="tTitle">✍️ 這一天</span><span class="spacer"></span>';
    const tg=document.createElement('button'); tg.className='qbtn';
    tg.textContent= editing ? '✔ 完成' : '✏️ 編輯';
    tg.title= editing ? '完成編輯，回到閱讀畫面' : '編輯這一天的日誌';
    tg.onclick=()=>{ uiDiary.editFor=dIso; uiDiary.editOn=!editing; renderDiary(); };
    ch.appendChild(tg);
    const stat=document.createElement('span');
    stat.style.cssText='font-size:11.5px;color:var(--green);opacity:0;transition:opacity .3s;margin-left:6px;';
    stat.textContent='✓ 已自動儲存';
    if (editing) ch.appendChild(stat);
    c.appendChild(ch);
    // 心情列
    const mr=document.createElement('div');
    mr.style.cssText='display:flex;gap:6px;align-items:center;margin-top:8px;';
    const ml=document.createElement('span'); ml.className='qlabel'; ml.textContent='今日心情：';
    mr.appendChild(ml);
    const cur=diaryEntry(dIso, sp, false);
    DIARY_MOODS.forEach(mo=>{
      const b=document.createElement('button'); b.className='qbtn';
      b.style.cssText='font-size:16px;padding:2px 8px;'+((cur&&cur.mood===mo)?'background:var(--accent-soft);outline:2px solid var(--accent);':'');
      b.textContent=mo;
      b.onclick=()=>{
        const e=diaryEntry(dIso, sp, true);
        e.mood = e.mood===mo ? null : mo;
        e.updated=toISO(new Date()); saveDiary(); renderDiary();
      };
      mr.appendChild(b);
    });
    c.appendChild(mr);
    if (!editing){
      /* 閱讀模式：Markdown 渲染好好呈現（跟總覽唯讀畫面同款） */
      const mkView=(label, val)=>{
        if (!(val||'').trim()) return;
        const lb=document.createElement('div');
        lb.style.cssText='font-size:13.5px;font-weight:700;margin-top:10px;color:var(--muted);';
        lb.textContent=label;
        const b=document.createElement('div');
        b.style.cssText='margin-top:4px;font-size:13.5px;line-height:1.75;white-space:pre-wrap;';
        /* 日誌欄位明文承諾「支援 Markdown」——閱讀模式一律渲染，不受全域 md 開關影響 */
        mdRender(b, val);
        c.appendChild(lb); c.appendChild(b);
      };
      mkView('✍️ 今天做了什麼', cur0 ? cur0.text : '');
      mkView('📚 今天學到什麼', cur0 ? cur0.learn : '');
      const eh=document.createElement('div'); eh.className='editHint';
      eh.textContent='這是閱讀畫面（Markdown 已排版）｜要修改按右上「✏️ 編輯」';
      c.appendChild(eh);
      wrap.appendChild(c);
    } else {
    // 兩欄：做了什麼＋學到什麼（邊打邊自動存，不重繪、不搶游標）
    const flash=()=>{ stat.style.opacity='1'; clearTimeout(uiDiary.statT); uiDiary.statT=setTimeout(()=>{ stat.style.opacity='0'; },1500); };
    const mkArea=(label, ph, key)=>{
      const lb=document.createElement('div');
      lb.style.cssText='font-size:13.5px;font-weight:700;margin-top:10px;color:var(--muted);';
      lb.textContent=label;
      const ta=document.createElement('textarea'); ta.className='trkNote';
      ta.style.cssText='min-height:72px;margin-top:4px;';
      /* v44：框框高度記憶——拖拉調整後存進設定，換頁回來不再跳回預設 */
      const hs=(settings.diaryH||{})[key];
      if (hs) ta.style.height=hs+'px';
      ta.addEventListener('mouseup',()=>{
        const h=ta.offsetHeight;
        if (h && h!==((settings.diaryH||{})[key]||0)){
          if (!settings.diaryH) settings.diaryH={};
          settings.diaryH[key]=h; saveSettings();
        }
      });
      ta.placeholder=ph;
      const e0=diaryEntry(dIso, sp, false);
      ta.value=e0 ? (e0[key]||'') : '';
      ta.oninput=()=>{
        clearTimeout(uiDiary.saveTimer);
        uiDiary.saveTimer=setTimeout(()=>{
          const e=diaryEntry(dIso, sp, true);
          e[key]=ta.value; e.updated=toISO(new Date());
          saveDiary(); flash();
        },600);
      };
      ta.onblur=()=>{
        const e=diaryEntry(dIso, sp, ta.value.trim()? true:false);
        if (e && e[key]!==ta.value){ e[key]=ta.value; e.updated=toISO(new Date()); saveDiary(); flash(); }
      };
      c.appendChild(lb); c.appendChild(ta);
    };
    mkArea('✍️ 今天做了什麼','流水帳也沒關係，寫下來就是紀錄。支援 Markdown（# 標題、- 清單…）','text');
    mkArea('📚 今天學到什麼','一句話也好：新學會的操作、踩過的雷、聽到的好想法…','learn');
    const eh=document.createElement('div'); eh.className='editHint';
    eh.textContent='↵ Enter 換行｜邊打邊自動儲存（右上會亮 ✓）｜寫完按「✔ 完成」看排版好的樣子';
    c.appendChild(eh);
    wrap.appendChild(c);
    }
  }

  // ── 自動摘要 ──
  const sc=document.createElement('div'); sc.className='trkCard';
  const sh=document.createElement('div'); sh.className='trkHead';
  sh.innerHTML='<span class="tTitle">🤖 系統幫你記的</span><span class="spacer"></span>';
  const cfg=document.createElement('button'); cfg.className='qbtn'; cfg.textContent='⚙';
  cfg.title='這裡要顯示哪些來源';
  cfg.onclick=()=>{ uiDiary.cfgOpen=!uiDiary.cfgOpen; renderDiary(); };
  sh.appendChild(cfg);
  sc.appendChild(sh);
  if (uiDiary.cfgOpen){
    const row=document.createElement('div');
    row.style.cssText='display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;';
    Object.entries(DIARY_SRC).forEach(([k,l])=>{
      const on=(settings.diarySrc||{})[k]!==false;
      const b=document.createElement('span'); b.className='memberTag'+(on?' on':'');
      b.textContent=l;
      b.onclick=()=>{
        if (!settings.diarySrc) settings.diarySrc={};
        settings.diarySrc[k]=!on; saveSettings(); renderDiary();
      };
      row.appendChild(b);
    });
    sc.appendChild(row);
  }
  const sum=diarySummary(dIso);
  if (!sum.length){
    const e=document.createElement('div'); e.className='empty';
    e.textContent= dIso>today ? '這天還沒到喵，先去總月曆排計畫吧' : '這天沒有留下自動紀錄';
    sc.appendChild(e);
  }
  sum.forEach(sec=>{
    const st=document.createElement('div');
    st.style.cssText='font-size:13.5px;font-weight:700;margin-top:10px;color:var(--muted);';
    st.textContent=sec.t;
    sc.appendChild(st);
    sec.lines.forEach(l=>{
      const dl=document.createElement('div');
      dl.style.cssText='font-size:13.5px;margin-top:4px;line-height:1.55;';
      dl.textContent=l;
      sc.appendChild(dl);
    });
  });
  wrap.appendChild(sc);
}

/* ───────── 首頁儀表板 ───────── */
function renderHome(){
  const wrap=document.getElementById('homePane');
  wrap.innerHTML='';

  // 🛡 v43 資料異常歸零警告（開機偵測到才出現）
  if (bootWipeSnap){
    const wc=document.createElement('div'); wc.className='trkCard';
    wc.style.cssText='border:2px solid var(--red); background:var(--red-bg);';
    wc.innerHTML='<div class="trkHead"><span class="tTitle" style="color:var(--red);">⚠️ 資料看起來被清空了</span></div>'
      +'<div style="font-size:13.5px;line-height:1.7;margin-top:6px;">這台瀏覽器的儲存空間可能被重置（不是你做錯什麼）。'
      +'快照裡還留著一份完整資料：<b>'+esc(bootWipeSnap.date)+'（'+snapCount(bootWipeSnap)+' 筆）</b>，要拿回來嗎？</div>';
    const row=document.createElement('div'); row.style.cssText='display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;';
    const rb=document.createElement('button'); rb.className='qbtn';
    rb.style.cssText='background:var(--red);color:var(--on-red,#fff);font-weight:700;';
    rb.textContent='🕒 立即還原這份快照';
    rb.onclick=()=>restoreSnapshot(bootWipeSnap);
    const dis=document.createElement('button'); dis.className='qbtn';
    dis.textContent='這本來就是空的，關閉';
    dis.onclick=()=>{ settings.ui=settings.ui||{}; settings.ui.wipeAck=toISO(new Date()); saveSettings(); bootWipeSnap=null; renderHome(); };
    row.appendChild(rb); row.appendChild(dis); wc.appendChild(row);
    wrap.appendChild(wc);
  }

  const pool=spaceTasks();
  const fire=pool.filter(t=>t.status==='todo'&&urgency(t).level==='red');
  const chase=pool.filter(t=>t.status==='waiting'&&t.followUp&&daysUntil(fromISO(t.followUp))<=0);
  const todo=pool.filter(t=>t.status==='todo');
  const wait=pool.filter(t=>t.status==='waiting');

  // 滿版：今天先看這裡
  const det=settings.homeDetail!==false;
  const hero=document.createElement('div'); hero.className='trkCard homeCard';
  hero.style.cursor='pointer'; hero.title='點擊前往任務小窩';
  hero.innerHTML='<div class="trkHead"><span class="tTitle">📌 今天先看這裡</span><span class="spacer"></span></div>';
  const eye=document.createElement('button'); eye.className='qbtn';
  eye.textContent=det?'👁 顯示內容':'🙈 只看數量';
  eye.title='切換首頁卡片：列出實際內容 / 只顯示數量';
  eye.onclick=e=>{ e.stopPropagation(); settings.homeDetail=!det; saveSettings(); renderHome(); };
  hero.querySelector('.trkHead').appendChild(eye);
  const add=(txt,color,bold)=>{
    const d=document.createElement('div');
    // 一律單行截斷（title 屬性看全文）——長標題換行是首頁看起來凌亂的主因
    d.style.cssText='font-size:13.5px;margin-top:7px;line-height:1.6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:'+color+(bold?';font-weight:700':'');
    d.textContent=txt; d.title=txt; hero.appendChild(d);
  };
  const fireStale=fire.filter(isStaleOverdue);
  const fireFresh=fire.filter(t=>!isStaleOverdue(t));
  if (!fireFresh.length && !chase.length){
    add(todo.length ? (fireStale.length?'今天沒有新的急件，從容處理就好喵':'沒有急件！從容處理 '+todo.length+' 件待辦就好喵') : '什麼都不用做，跟毛孩玩吧🐾','var(--green)',true);
  }
  if (pool.length===0){
    const cta=document.createElement('button'); cta.className='btnAdd';
    cta.style.cssText='margin-top:12px;';
    cta.textContent='＋ 加入第一個任務';
    cta.onclick=e=>{
      e.stopPropagation();
      module='tasks'; view='list'; render();
      setTimeout(()=>document.getElementById('input').focus(),0);
    };
    hero.appendChild(cta);
  }
  fireFresh.slice(0,5).forEach(t=>add('🔴 '+t.title.slice(0,26)+'　'+urgency(t).label.replace('🔴 ',''),'var(--red)'));
  if (fireFresh.length>5) add('…還有 '+(fireFresh.length-5)+' 件急件','var(--red)');
  if (fireStale.length){
    const _old=Math.max(...fireStale.map(t=>-daysUntil(fromISO(t.due))));
    add('🕰 有 '+fireStale.length+' 件擱了比較久（最久 '+_old+' 天）——點這裡去重排：改期限、改成無期限或封存都可以','var(--muted2)');
  }
  chase.slice(0,5).forEach(t=>add('⏰ 該催了：'+t.title.slice(0,26),'var(--orange)'));
  hero.onclick=()=>{ module='tasks'; view='list'; render(); };
  wrap.appendChild(hero);

  // 💾 v43 定期備份提醒：有資料、超過 7 天沒匯出（含從來沒匯出過）才出現，可暫緩 7 天
  (()=>{
    const totalData=tasks.length+trackers.length+notes.length+pbook.length+manuals.length+habits.length;
    if (!totalData || bootWipeSnap) return;
    const daysSince=iso=>{ try{ return -daysUntil(fromISO(iso)); }catch(e){ return 999; } };
    const last=settings.lastExportAt, snz=(settings.ui||{}).bkSnooze;
    if (last && daysSince(last)<7) return;
    if (snz && daysSince(snz)<7) return;
    const bc=document.createElement('div'); bc.className='trkCard';
    bc.style.cssText='border-left:4px solid var(--orange); padding:8px 14px; display:flex; align-items:center; gap:10px; flex-wrap:wrap;';
    bc.title='瀏覽器的儲存空間偶爾會被系統清掉，硬碟裡的 JSON 備份檔是最可靠的保險。';
    bc.innerHTML='<span style="font-size:13.5px;line-height:1.6;flex:1;min-width:200px;">💾 '
      +(last?'上次匯出備份是 <b>'+esc(last)+'</b>（'+daysSince(last)+' 天前）':'還<b>沒有匯出過備份</b>')
      +'，有空存一份到電腦比較安心。</span>';
    const row=document.createElement('div'); row.style.cssText='display:flex;gap:8px;flex-wrap:wrap;';
    const ex=document.createElement('button'); ex.className='qbtn';
    ex.style.cssText='background:var(--accent);color:var(--on-accent,#fff);font-weight:700;';
    ex.textContent='📤 立即匯出備份';
    ex.onclick=()=>document.getElementById('btnExport').click();
    const later=document.createElement('button'); later.className='qbtn';
    later.textContent='過幾天再提醒';
    later.onclick=()=>{ settings.ui=settings.ui||{}; settings.ui.bkSnooze=toISO(new Date()); saveSettings(); renderHome(); };
    row.appendChild(ex); row.appendChild(later); bc.appendChild(row);
    wrap.appendChild(bc);
  })();

  // 模組小卡
  const grid=document.createElement('div');
  grid.style.cssText='display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;align-items:start;';
  const mkCard=(title,lines,target)=>{
    const c=document.createElement('div'); c.className='trkCard homeCard';
    c.style.cssText+='cursor:pointer;margin-bottom:0;';
    c.title='點擊前往';
    c.innerHTML='<div class="trkHead"><span class="tTitle">'+title+'</span></div>';
    lines.forEach(l=>{
      const d=document.createElement('div');
      // 單行截斷＋title 看全文：卡片行行整齊、不再因長名單換好幾行而參差
      d.style.cssText='font-size:13.5px;margin-top:6px;line-height:1.55;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:'+(l.c||'var(--ink)');
      d.textContent=l.t; d.title=l.t; c.appendChild(d);
    });
    c.onclick=()=>{ module=target; if(target==='tasks') view='list'; render(); };
    return c;
  };
  const l1=[{t:'待辦 '+todo.length+' 件｜等回覆 '+wait.length+' 件'}];
  if (det){
    const rank={red:0,orange:1,yellow:2,gray:3};
    const sorted=[...todo].sort((a,b)=>(rank[urgency(a).level]??9)-(rank[urgency(b).level]??9));
    sorted.slice(0,4).forEach(t=>{
      const u=urgency(t);
      l1.push({t:'・'+t.title.slice(0,18)+'　'+u.label,
        c:u.level==='red'?'var(--red)':u.level==='orange'?'var(--orange)':'var(--ink)'});
    });
    if (todo.length>4) l1.push({t:'…還有 '+(todo.length-4)+' 件待辦',c:'var(--sub)'});
    wait.slice(0,2).forEach(t=>l1.push({t:'⏳ 等回覆：'+t.title.slice(0,16),c:'var(--sub)'}));
  } else {
    l1.push(fire.length?{t:'🔴 急件 '+fire.length+' 件',c:'var(--red)'}:{t:'無急件',c:'var(--sub)'});
  }
  grid.appendChild(mkCard('🏡 任務小窩', l1,'tasks'));
  // ⭐ 重要任務預覽：有標 ⭐ 的待辦才出現這張卡
  const impList=todo.filter(t=>t.tags&&t.tags.includes('重要'));
  if (impList.length){
    const li=[{t:'標了 ⭐ 的待辦 '+impList.length+' 件'}];
    if (det){
      const rank={red:0,orange:1,yellow:2,gray:3};
      [...impList].sort((a,b)=>(rank[urgency(a).level]??9)-(rank[urgency(b).level]??9))
        .slice(0,5).forEach(t=>{
          const u=urgency(t);
          li.push({t:'⭐ '+t.title.slice(0,18)+'　'+u.label,
            c:u.level==='red'?'var(--red)':u.level==='orange'?'var(--orange)':'var(--ink)'});
        });
      if (impList.length>5) li.push({t:'…還有 '+(impList.length-5)+' 件重要任務',c:'var(--sub)'});
    }
    grid.appendChild(mkCard('⭐ 重要', li,'tasks'));
  }
  if (settings.modules.track!==false){
    const vt=trackers.filter(t=>spaceMatch(t.space) && !t.archived);
    const l2=[];
    vt.slice(0,3).forEach(trk=>{
      const act=trk.rows.filter(r=>!r.skipped);
      const done=act.filter(r=>r.done).length;
      const od=act.filter(r=>!r.done&&effDue(trk,r)&&daysUntil(fromISO(effDue(trk,r)))<0).length;
      l2.push({t:trk.title.slice(0,12)+'：'+done+'/'+act.length+' 已回'+(od?('｜⏰逾期 '+od):''), c: od?'var(--red)':'var(--ink)'});
      if (det){
        const pend=act.filter(r=>!r.done).map(r=>r.name);
        if (pend.length) l2.push({t:'　待'+(trk.doneWord||'回傳')+'：'+pend.slice(0,4).join('、')+(pend.length>4?'…等 '+pend.length+' 人':''), c:'var(--sub)'});
      }
    });
    if (!vt.length) l2.push({t:'沒有進行中的追蹤',c:'var(--sub)'});
    grid.appendChild(mkCard('📦 追蹤項目', l2,'track'));
  }
  if (settings.modules.money!==false){
    const vm=money.filter(m=>spaceMatch(m.space));
    const pend=vm.filter(m=>m.type==='claim'&&!m.claimed);
    const pendSum=pend.reduce((s,m)=>s+(m.amount||0)*(m.qty||1),0);
    const l3=[ pend.length ? {t:'🧾 未請款 '+pend.length+' 筆，共 '+fmtMoney(pendSum),c:'var(--orange)'}
                           : {t: vm.length? '沒有未請款項目':'還沒開始記帳', c:'var(--sub)'} ];
    if (det){
      pend.slice(0,3).forEach(m=>l3.push({t:'・'+(m.desc||'').slice(0,12)+'　'+fmtMoney((m.amount||0)*(m.qty||1))}));
      if (pend.length>3) l3.push({t:'…還有 '+(pend.length-3)+' 筆',c:'var(--sub)'});
    }
    grid.appendChild(mkCard('💰 記帳', l3,'money'));
  }
  if (settings.modules.habits!==false){
    const vh=habits.filter(h=>spaceMatch(h.space)&&!h.archived);
    if (vh.length){
      const nowD=new Date(); nowD.setHours(0,0,0,0);
      const tISO=toISO(nowD);
      const sched=vh.filter(h=>habitScheduledOn(h,nowD));
      const undone=sched.filter(h=>!habitDone(h,tISO));
      const lh=[];

/* ───────── 習慣打卡（完全獨立，不與任務/日曆混合） ─────────
   h = {id, name, icon, daily(每日次數,預設1), target(每週目標天數,0=不設),
        days(指定星期[0-6]陣列,空=每天), log{iso:次數}, space, archived} */
const HABITS_KEY='taskInbox.habits';
let habits=[];
function loadHabits(){
  try{ habits=JSON.parse(localStorage.getItem(HABITS_KEY))||[]; }catch(e){ habits=[]; }
  habits.forEach(h=>{
    if (!h.space) h.space='work';
    if (!h.log) h.log={};
    if (!h.daily) h.daily=1;
    if (h.days===undefined) h.days=null;
    if (h.archived===undefined) h.archived=false;
    Object.keys(h.log).forEach(k=>{ if(h.log[k]===true) h.log[k]=1; });  // 舊資料 true→1
  });
}
function saveHabits(){ localStorage.setItem(HABITS_KEY, JSON.stringify(habits)); }
const uiHab={ expand:new Set(), edit:null, view:'list', delPending:null, delTimer:null, newIcon:'🌱' };
const HABIT_ICONS=['🌱','💧','🏃','📖','🧘','😴','🍎','💪','🧹','🎨'];
function mkHabitIconPicker(getV, setV){
  const w=document.createElement('span'); w.className='habIconRow';   // 📱 手機：橫向滑動選 icon
  w.style.cssText='display:inline-flex;gap:4px;align-items:center;flex-wrap:wrap;';
  const lb=document.createElement('span'); lb.style.cssText='font-size:12.5px;color:var(--sub);';
  lb.textContent='圖示：';
  w.appendChild(lb);
  const icons=HABIT_ICONS.includes(getV())?HABIT_ICONS:[getV(),...HABIT_ICONS];
  icons.forEach(ic=>{
    const c=document.createElement('button');
    c.className='qbtn'+(getV()===ic?' on':'');
    if (getV()===ic) c.style.cssText='background:var(--accent);color:var(--on-accent,#fff);';
    c.textContent=ic;
    c.onclick=()=>{ setV(ic);
      [...w.querySelectorAll('button')].forEach(b=>{ b.style.cssText=''; b.classList.remove('on'); });
      c.style.cssText='background:var(--accent);color:var(--on-accent,#fff);';
    };
    w.appendChild(c);
  });
  return w;
}
function habitScheduledOn(h, d){ return !h.days || !h.days.length || h.days.includes(d.getDay()); }
function habitDone(h, iso){ return (h.log[iso]||0) >= (h.daily||1); }
function habitStreak(h){
  let n=0, d=new Date(); d.setHours(0,0,0,0);
  if (habitScheduledOn(h,d) && !habitDone(h,toISO(d))) d=addDays(d,-1);  // 今天還沒完成不算斷
  let g=0;
  while (g++<3700){
    if (habitScheduledOn(h,d)){
      if (habitDone(h,toISO(d))) n++;
      else break;
    }
    d=addDays(d,-1);   // 非排程日直接跳過、不斷連續
  }
  return n;
}
function habitMaxStreak(h){
  const keys=Object.keys(h.log).filter(k=>h.log[k]>0).sort();
  if (!keys.length) return 0;
  let d=fromISO(keys[0]); const end=new Date(); end.setHours(0,0,0,0);
  let cur=0, max=0, g=0;
  while (d<=end && g++<3700){
    if (habitScheduledOn(h,d)){
      if (habitDone(h,toISO(d))){ cur++; if(cur>max) max=cur; }
      else cur=0;
    }
    d=addDays(d,1);
  }
  return max;
}
function habitWeekCount(h){
  const now=new Date(); now.setHours(0,0,0,0);
  const mon=addDays(now, -((now.getDay()+6)%7));
  let c=0;
  for (let i=0;i<7;i++){ const dd=addDays(mon,i); if (habitDone(h,toISO(dd))) c++; }
  return c;
}
function habitRate30(h){
  const now=new Date(); now.setHours(0,0,0,0);
  let sched=0, done=0;
  for (let i=0;i<30;i++){
    const dd=addDays(now,-i);
    if (habitScheduledOn(h,dd)){ sched++; if (habitDone(h,toISO(dd))) done++; }
  }
  return sched ? Math.round(done/sched*100) : 0;
}
function habitEditRow(h){

  const tmRow=document.createElement('div');
  tmRow.style.cssText='display:flex;gap:6px;flex-wrap:wrap;align-items:center;';
  const tmLb=document.createElement('span'); tmLb.className='qlabel'; tmLb.textContent='⏰ 提醒：';
  const tmChips=document.createElement('span');
  tmChips.style.cssText='display:inline-flex;gap:4px;flex-wrap:wrap;align-items:center;';
  const drawChips=()=>{
    tmChips.innerHTML='';
    if (!tmList.length){
      const e=document.createElement('span'); e.style.cssText='font-size:12.5px;color:var(--sub);';
      e.textContent='（不提醒）'; tmChips.appendChild(e);
    }
    tmList.forEach(tm=>{
      const c=document.createElement('span'); c.className='memberTag on';
      c.textContent=tm+' ✕'; c.title='點擊移除這個提醒時間';
      c.onclick=()=>{ tmList=tmList.filter(x=>x!==tm); drawChips(); };
      tmChips.appendChild(c);
    });
  };
  drawChips();
  const hSel=document.createElement('select'); hSel.className='miniSelect';
  for (let hh2=0; hh2<24; hh2++){
    const o=document.createElement('option'); o.value=('0'+hh2).slice(-2);
    o.textContent=('0'+hh2).slice(-2)+' 時';
    if (hh2===8) o.selected=true;
    hSel.appendChild(o);
  }
  const mSel=document.createElement('select'); mSel.className='miniSelect';
  for (let mm2=0; mm2<60; mm2+=5){
    const o=document.createElement('option'); o.value=('0'+mm2).slice(-2);
    o.textContent=('0'+mm2).slice(-2)+' 分';
    mSel.appendChild(o);
  }
  const tmAdd=document.createElement('button'); tmAdd.className='qbtn'; tmAdd.textContent='＋加提醒';
  tmAdd.title='可以加好幾個時段（例：早中晚各一次）。工具開著的時候才會提醒喵';
  tmAdd.onclick=()=>{
    const tm=hSel.value+':'+mSel.value;
    if (!tmList.includes(tm)){ tmList=[...tmList, tm].sort(); drawChips(); }
  };
  tmRow.append(tmLb,tmChips,hSel,mSel,tmAdd);
  f.appendChild(tmRow);
  const ok=document.createElement('button'); ok.className='qbtn'; ok.textContent='✔ 儲存';
  ok.style.cssText='background:var(--accent);color:var(--on-accent,#fff);';
  ok.onclick=()=>{
    if (ni.value.trim()) h.name=ni.value.trim();
    h.icon=icoV||'🌱';
    h.daily=Math.max(1,parseInt(dIn.value)||1);
    h.target=+tSel.value||0;
    h.days=daySet.size?[...daySet]:null;
    h.times=[...tmList];
    uiHab.edit=null; saveHabits(); renderHabits();
    if (h.times.length) catSay('提醒設好了：'+h.times.join('、')+'。工具開著我就會準時喊你喵⏰',3600,'happy');
  };
  const okRow=document.createElement('div');
  okRow.style.cssText='display:flex;justify-content:flex-end;';
  okRow.appendChild(ok);
  f.appendChild(okRow);
  return f;
}
/* 🎖 集點卡：每個完成日＝1 個 🐾 章；滿 10 點 🏅、50 點 🏆、100 點 👑 */
function habitTotalStamps(h){
  let n=0; Object.keys(h.log||{}).forEach(iso=>{ if ((h.log[iso]||0)>=(h.daily||1)) n++; });
  return n;
}
function badgeStr(n){
  const s='👑'.repeat(Math.floor(n/100))+'🏆'.repeat(Math.floor(n%100/50))+'🏅'.repeat(Math.floor(n%50/10));
  return s;
}
function renderHabitCards(wrap, vis){
  const now=new Date(); now.setHours(0,0,0,0);
  const tISO=toISO(now), y=now.getFullYear(), m=now.getMonth();
  // 總覽卡
  const total=vis.reduce((s,h)=>s+habitTotalStamps(h),0);
  const best=Math.max(0,...vis.map(h=>habitStreak(h)));
  const sum=document.createElement('div'); sum.className='trkCard';
  sum.innerHTML='<div class="trkHead"><span class="tTitle">🎖 集點總覽</span></div>'
    +'<div style="display:flex;gap:20px;flex-wrap:wrap;margin-top:8px;font-size:13.5px;align-items:baseline;">'
    +'<span>累積 <b style="font-size:22px;">'+total+'</b> 🐾</span>'
    +'<span>最長連續 <b style="font-size:22px;">'+best+'</b> 天'+(best>=7?' 🔥':'')+'</span>'
    +'<span>徽章：'+(badgeStr(total)||'還沒有，滿 10 點得第一面 🏅')+'</span></div>'
    +'<div class="setNote">每完成一天＝蓋一個 🐾 章。10 點＝🏅、50 點＝🏆、100 點＝👑。點「今天」的格子也能直接打卡。</div>';
  wrap.appendChild(sum);
  // 每個習慣一張集點卡（本月）
  const daysInM=new Date(y,m+1,0).getDate();
  vis.forEach(h=>{
    const c=document.createElement('div'); c.className='trkCard';
    const head=document.createElement('div'); head.className='trkHead';
    if (inAllView()){
      const si=document.createElement('span'); si.className='chip type'; si.textContent=spaceIcon(h.space); head.appendChild(si);
    }
    const tt=document.createElement('span'); tt.className='tTitle'; tt.textContent=(h.icon||'🌱')+' '+h.name;
    head.appendChild(tt);
    const n=habitTotalStamps(h);
    const sp2=document.createElement('span'); sp2.className='spacer'; head.appendChild(sp2);
    const pts=document.createElement('span'); pts.style.cssText='font-size:13.5px;font-weight:700;';
    pts.textContent=n+' 點 '+badgeStr(n); head.appendChild(pts);
    c.appendChild(head);
    const lbl=document.createElement('div'); lbl.style.cssText='font-size:12.5px;color:var(--sub);margin-top:8px;';
    lbl.textContent=(m+1)+'月集點卡'+((h.days&&h.days.length)?'（灰點＝休息日）':'');
    c.appendChild(lbl);
    const rowS=document.createElement('div'); rowS.className='stampRow';
    let monthDone=0, monthSched=0;
    for (let day=1; day<=daysInM; day++){
      const d=new Date(y,m,day); d.setHours(0,0,0,0);
      const iso=toISO(d);
      const s=document.createElement('span'); s.className='stamp'; s.title=(m+1)+'/'+day;
      if (!habitScheduledOn(h,d)){ s.classList.add('rest'); s.textContent='·'; }
      else {
        monthSched++;
        if (habitDone(h,iso)){ s.classList.add('on'); s.textContent='🐾'; monthDone++; }
        else if (d>now){ s.classList.add('future'); }
        if (iso===tISO){
          s.classList.add('today');
          s.style.cursor='pointer'; s.title='今天！點我打卡（'+(h.log[tISO]||0)+'/'+(h.daily||1)+'）';
          s.onclick=()=>{
            h.log[tISO]=(h.log[tISO]||0)+1;
            saveHabits(); renderHabits();
            catSay(habitDone(h,tISO)?'今日達成，蓋章！🐾':'打卡 '+h.log[tISO]+'/'+(h.daily||1)+'，繼續喵！',2400,'happy');
          };
        }
      }
      rowS.appendChild(s);
    }
    c.appendChild(rowS);
    const foot=document.createElement('div'); foot.style.cssText='font-size:12.5px;color:var(--sub);margin-top:8px;';
    const toNext=10-(n%10);
    foot.textContent='本月 '+monthDone+'/'+monthSched+(monthDone===monthSched&&monthSched>0?' 全勤 🎉':'')+'　｜　再 '+toNext+' 點升下一面徽章';
    c.appendChild(foot);
    wrap.appendChild(c);
  });
}

      card.appendChild(lg);
    }
    wrap.appendChild(card);
  });

/* 📊 習慣儀表板：每個習慣一列 30 天熱力格＋統計 */
function renderHabitDash(wrap, vis){
  const now=new Date(); now.setHours(0,0,0,0);
  const todayISO=toISO(now);
  const schedToday=vis.filter(h=>habitScheduledOn(h,now));
  const doneToday=schedToday.filter(h=>habitDone(h,todayISO)).length;
  const maxAll=Math.max(0,...vis.map(habitMaxStreak));
  const st=document.createElement('div'); st.className='trkCard';
  st.innerHTML='<div style="display:flex;gap:18px;flex-wrap:wrap;font-size:13.5px;">'
    +'<span>今日 <b style="font-size:20px;color:var(--accent)">'+doneToday+'</b> / '+schedToday.length+' 已達成</span>'
    +'<span>🏆 全場最長連續 <b style="font-size:20px;color:var(--orange)">'+maxAll+'</b> 天</span>'
    +'</div>';
  wrap.appendChild(st);
  vis.forEach(h=>{
    const daily=h.daily||1;
    const card=document.createElement('div'); card.className='trkCard';
    const head=document.createElement('div'); head.className='trkHead';
    const tt=document.createElement('span'); tt.className='tTitle';
    tt.textContent=(h.icon||'🌱')+' '+h.name;
    head.appendChild(tt);
    const cur=habitStreak(h), best=habitMaxStreak(h), rate=habitRate30(h);
    const mk=(txt,cls)=>{ const s=document.createElement('span'); s.className='chip '+cls; s.textContent=txt; head.appendChild(s); };
    if (cur>0) mk('🔥 目前 '+cur+' 天', cur>=7?'urg-orange':'subProg');
    mk('🏆 最佳 '+best+' 天','type');
    mk('30日達成 '+rate+'%', rate>=80?'subProg':(rate>=50?'urg-yellow':'type'));
    card.appendChild(head);
    // 近 30 天熱力格（左舊右新）
    const strip=document.createElement('div');
    strip.style.cssText='display:flex;gap:3px;flex-wrap:wrap;margin-top:9px;';
    for (let i=29;i>=0;i--){
      const dd=addDays(now,-i);
      const iso=toISO(dd);
      const cnt=h.log[iso]||0;
      const sq=document.createElement('span');
      sq.className='hdSq'
        +(cnt>=daily?' on':(cnt>0?' part':''))
        +(!habitScheduledOn(h,dd)?' ns':'');
      sq.title=iso+'　'+(daily>1?(cnt+'/'+daily):(cnt?'✓':'—'));
      strip.appendChild(sq);
    }
    card.appendChild(strip);
    wrap.appendChild(card);
  });
  const lg=document.createElement('div'); lg.className='calLegend';
  lg.style.cssText+='text-align:left;';
  lg.textContent='每列＝近 30 天（左舊右新）。實色＝達成、半色＝有做未達標、淡格＝休息日。';
  wrap.appendChild(lg);
}

/* ───────── 封存（以專案為資料夾） ───────── */
const uiArc={ collapsed:new Set(), delPending:null, delTimer:null, q:'' };
function renderArchive(){
  const wrap=document.getElementById('archivePane');
